<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMARTIE Quote Desk — Smart India Enterprises</title>
<meta name="theme-color" content="#12161A">
<meta name="description" content="Internal quoting and stock tool for Smart India Enterprises.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Quote Desk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1F24; --ink2:#414A54; --steel:#6E7883; --steel2:#9AA4AE;
  --rule:#DCE1DE; --rule2:#EDF0EE;
  --paper:#F5F7F5; --panel:#FFFFFF; --panel2:#FAFBFA;
  --saffron:#EE6C1F; --saffron-soft:#FFF1E6; --saffron-deep:#C4530F;
  --verd:#12874F; --verd-soft:#E8F5ED; --verd-deep:#0C6239;
  --warn:#A85A11; --warn-soft:#FFF3E2;
  --danger:#C0392B; --danger-soft:#FDECEA;
  --shadow:0 1px 2px rgba(18,22,26,.06),0 8px 24px -12px rgba(18,22,26,.18);
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
  --cond:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
  --r:9px; --r-sm:7px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55; letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

/* ---------- utility type ---------- */
.eyebrow{
  font-family:var(--cond); letter-spacing:.01em;
  font-weight:700; font-size:12.5px; color:var(--steel);
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
header.mast{
  background:var(--panel); color:var(--ink); position:sticky; top:0; z-index:60;
  border-bottom:1px solid var(--rule); box-shadow:0 1px 0 rgba(0,0,0,.02);
}
header.mast::after{content:"";display:block;height:3px;
  background:linear-gradient(90deg,var(--saffron) 0 34%,#fff 34% 66%,var(--verd) 66% 100%);
  position:absolute;left:0;right:0;bottom:-3px}
.mast-in{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--cond);font-weight:800;font-size:23px;letter-spacing:.02em;line-height:1}
.brand span{font-family:var(--cond);font-weight:600;letter-spacing:.02em;font-size:13px;color:var(--steel)}
.mark{width:34px;height:34px;margin-right:9px;flex:0 0 auto;display:block;object-fit:contain}

.tier{display:flex;align-items:center;gap:0;background:var(--panel2);border:1px solid var(--rule);border-radius:var(--r);padding:3px}
.tier button{
  font-family:var(--cond);letter-spacing:0;font-weight:700;font-size:13.5px;
  background:none;border:0;color:var(--steel);padding:8px 15px;cursor:pointer;border-radius:var(--r-sm);
}
.tier button[aria-pressed=true]{background:var(--saffron);color:#fff}
.tier-lbl{font-family:var(--cond);font-weight:600;font-size:12.5px;color:var(--steel);margin-right:4px}
.rev{font-family:var(--mono);font-size:11px;color:var(--steel2);letter-spacing:.02em}
#btnInstall{padding:6px 13px;font-size:13px}
.offline{background:var(--warn);color:#fff;text-align:center;padding:6px 12px;font-size:13px;font-weight:600}

/* ---------- tabs ---------- */
nav.tabs{background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:56px;z-index:55}
.tabs-in{max-width:1440px;margin:0 auto;padding:0 20px;display:flex;align-items:stretch;gap:0}
.tabgroup{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;flex:1 1 auto;min-width:0}
.tabback{
  flex:0 0 auto;background:none;border:0;border-right:1px solid var(--rule);cursor:pointer;
  display:flex;align-items:center;gap:6px;padding:0 15px 3px 0;margin-right:13px;
  font-family:var(--cond);font-weight:700;font-size:14.5px;color:var(--saffron);
}
.tabback:hover{color:var(--saffron-deep)}
.tabback span{font-size:17px;line-height:1}
@media(max-width:560px){.tabback{padding-right:11px;margin-right:9px}}
.tabs button{
  background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;
  font-family:var(--cond);letter-spacing:-.005em;font-weight:700;font-size:14.5px;
  color:var(--steel);padding:14px 13px 11px;
}
.tabsep{align-self:center;width:1px;height:18px;background:var(--rule);margin:0 9px;flex:0 0 auto}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--saffron)}

/* ---------- layout ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
@media(max-width:1080px){.wrap{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.wrap>*{min-width:0}
.card-hd{padding:16px 20px 14px;border-bottom:1px solid var(--rule2);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.card-hd h2{font-family:var(--cond);font-weight:800;font-size:23px;letter-spacing:-.02em;margin:0;line-height:1.15}
.card-hd p{margin:0;color:var(--steel);font-size:13.5px;flex:1 1 260px}
.card-bd{padding:18px 20px}

/* ---------- forms ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.g2,.g3,.g4{grid-template-columns:1fr}}
label.f{display:block}
label.f>span{display:block;font-family:var(--cond);letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--steel);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 10px;background:var(--panel2);border:1px solid var(--rule);border-radius:var(--r);
}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
select{cursor:pointer}
.hint{font-size:12.5px;color:var(--steel);margin:6px 0 0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;padding-top:22px}
.chk input{width:16px;height:16px;accent-color:var(--saffron)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--cond);letter-spacing:-.005em;font-weight:700;font-size:14px;
  background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:var(--r);padding:9px 17px;
}
.btn:hover{background:#000}
.btn.pri{background:var(--saffron);border-color:var(--saffron)}
.btn.pri:hover{background:var(--saffron-deep);border-color:var(--saffron-deep)}
.btn.gh{background:none;color:var(--ink2);border-color:var(--rule)}
.btn.gh:hover{background:var(--panel2);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- result strip ---------- */
.calcout{margin-top:18px;border-top:1px dashed var(--rule);padding-top:16px}
.rows-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rows{width:100%;border-collapse:collapse}
.rows td:first-child{overflow-wrap:anywhere}
.rows th{
  text-align:left;font-family:var(--cond);letter-spacing:0;font-size:12.5px;
  color:var(--steel);font-weight:600;padding:0 8px 7px;border-bottom:1px solid var(--rule);
}
.rows td{padding:8px;border-bottom:1px solid var(--rule2);vertical-align:top;font-size:14px}
.rows td.n,.rows th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rows tr:last-child td{border-bottom:0}
.rows .sub{display:block;color:var(--steel);font-size:12.5px;margin-top:2px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 8px 0;border-top:2px solid var(--ink);margin-top:6px}
.tot .lbl{font-family:var(--cond);letter-spacing:-.005em;font-weight:700;font-size:15px}
.tot .val{font-family:var(--mono);font-size:22px;font-weight:600}

/* ---------- computed spec strip ---------- */
.spec{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.spec span{
  font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--rule2);
  border-radius:var(--r);padding:5px 10px;color:var(--ink2);
}
.spec span b{color:var(--steel);font-weight:400}

/* narrow screens: line items stack instead of squeezing into four columns */
@media(max-width:700px){
  .rows thead{display:none}
  .rows,.rows tbody,.rows tr,.rows td{display:block;width:100%}
  .rows tr{padding:13px 0;border-bottom:1px solid var(--rule2)}
  .rows tr:last-child{border-bottom:0}
  .rows td{border:0;padding:0}
  .rows td:first-child{font-weight:600;font-size:14.5px;line-height:1.4}
  .rows td:first-child .sub{font-weight:400}
  .rows td.n{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:4px 0 0;text-align:right}
  .rows td.n::before{
    content:attr(data-l);font-family:var(--sans);font-size:13px;font-weight:500;color:var(--steel);
    letter-spacing:0;flex:0 0 auto;
  }
  .rows td.n:nth-of-type(4){margin-top:3px;font-size:15.5px;font-weight:600}
  .tot .val{font-size:20px}
  .spec{gap:6px}
  .spec span{font-size:12px;padding:5px 9px}
}
@media(max-width:560px){
  .pitem{grid-template-columns:minmax(0,1fr) auto;row-gap:9px}
  .pitem>div:last-child{grid-column:1/-1;justify-content:flex-end}
}

/* ---------- badges & notes ---------- */
.tag{display:inline-block;font-family:var(--cond);letter-spacing:0;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--steel);border:1px solid var(--rule)}
.tag.o{background:var(--saffron-soft);color:var(--saffron-deep);border-color:#F0CDAE}
.tag.g{background:var(--verd-soft);color:var(--verd-deep);border-color:#BFE2CD}
.tag.w{background:var(--warn-soft);color:var(--warn);border-color:#EBD3B4}
.note{background:var(--warn-soft);border-left:3px solid var(--warn);padding:11px 14px;border-radius:0 var(--r) var(--r) 0;font-size:13.5px;color:#5C3A18;margin:0 0 16px}
.note b{color:var(--warn)}
.note ul{margin:6px 0 0;padding-left:18px}
.note li{margin:3px 0}

/* ---------- browse list ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters label.f{flex:1 1 160px;min-width:140px}
.plist{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--rule2)}
.pitem:last-child{border-bottom:0}
.pitem:nth-child(even){background:var(--panel2)}
.pitem .nm{font-size:14px;line-height:1.35}
.pitem .nm b{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}
.pitem .nm span{display:block;color:var(--steel);font-size:12.5px}
.pitem .pr{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
.pitem .pr small{display:block;font-family:var(--sans);font-size:11px;color:var(--steel);font-weight:400}
.empty{padding:34px 18px;text-align:center;color:var(--steel);font-size:14px;line-height:1.6}
.empty b{color:var(--ink);font-size:15px}

/* ---------- search ---------- */
.searchbar{position:relative;margin-bottom:14px}
.searchbar input{
  width:100%;padding:14px 44px 14px 16px;font-size:16px;background:var(--panel);
  border:2px solid var(--rule);border-radius:var(--r);
}
.searchbar input:focus{border-color:var(--saffron);outline:none}
.searchbar input::-webkit-search-cancel-button{display:none}
.clearq{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;
  border:0;background:var(--panel2);border-radius:50%;cursor:pointer;font-size:19px;line-height:1;color:var(--steel)}
.clearq:hover{background:var(--saffron-soft);color:var(--saffron-deep)}
.filters.slim{gap:10px;margin-bottom:14px;align-items:flex-end}
.filters.slim .fgrow{flex:1 1 auto}
.reshead{margin:0 0 10px;font-size:13.5px;color:var(--steel);font-weight:600}
.cat-of{display:block;font-size:11.5px;color:var(--saffron-deep);font-weight:600;margin-bottom:1px}

/* ---------- category accordion ---------- */
.cat{border:1px solid var(--rule);border-radius:var(--r);margin-bottom:10px;background:var(--panel);overflow:hidden}
.cat>summary{
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;
  padding:15px 16px;font-family:var(--cond);font-weight:700;font-size:15.5px;
}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary::before{
  content:"";width:9px;height:9px;flex:0 0 auto;border-right:2.4px solid var(--saffron);
  border-bottom:2.4px solid var(--saffron);transform:rotate(45deg);margin-top:-4px;transition:transform .18s
}
.cat[open]>summary::before{transform:rotate(225deg);margin-top:2px}
.cat[open]>summary{border-bottom:1px solid var(--rule2);background:var(--panel2)}
.cat .cname{flex:1 1 auto;min-width:0}
.cat .cnt{flex:0 0 auto;background:var(--saffron-soft);color:var(--saffron-deep);
  font-family:var(--mono);font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.cat .plist{border:0;border-radius:0}

/* ---------- product card with a live stepper ---------- */
.pitem{grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}
.pitem.inquote{background:var(--verd-soft)!important;box-shadow:inset 3px 0 0 var(--verd)}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--rule);border-radius:var(--r);
  overflow:hidden;background:var(--panel);flex:0 0 auto}
.stepper button{
  width:40px;min-height:42px;border:0;background:var(--panel2);cursor:pointer;
  font-size:19px;line-height:1;color:var(--ink);font-weight:600;
}
.stepper button:hover:not(:disabled){background:var(--saffron);color:#fff}
.stepper button:disabled{color:var(--steel2);cursor:not-allowed}
.stepper input{
  width:54px;text-align:center;border:0;border-left:1px solid var(--rule);border-right:1px solid var(--rule);
  font-family:var(--mono);font-weight:600;font-size:15px;background:var(--panel);padding:0;
}
@media(max-width:560px){
  .pitem{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}
  .pitem .stepper{grid-column:2}
  .pitem .pr{text-align:right}
}

/* ---------- quotation line editing ---------- */
.ln-top{display:flex;gap:10px;align-items:flex-start}
.ln-top .t{flex:1 1 auto;min-width:0}
.ln-rm{flex:0 0 auto;width:28px;height:28px;border:0;background:none;color:var(--steel2);
  font-size:20px;line-height:1;cursor:pointer;border-radius:6px}
.ln-rm:hover{background:var(--danger-soft);color:var(--danger)}
.ln-ed{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap;row-gap:10px}
.ln-ed .stepper button{width:38px;min-height:38px;font-size:18px}
.ln-ed .stepper input{width:50px;font-size:14.5px}
.ln-amt{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:16px;white-space:nowrap}

/* rate reads as text until you tap the pencil */
.rateview{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.rateview .rv{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap}
.rateview .rlab{font-size:12px;color:var(--steel);font-weight:600}
.penc{width:34px;height:34px;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r-sm);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.penc:hover{border-color:var(--saffron);background:var(--saffron-soft)}
.penc svg{width:15px;height:15px;stroke:var(--ink2);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.penc:hover svg{stroke:var(--saffron-deep)}
.rate-ed{display:flex;align-items:center;gap:7px;flex-wrap:wrap;width:100%;margin-top:10px;
  background:var(--saffron-soft);border:1px solid #F5CFAF;border-radius:var(--r);padding:9px 10px}
.rate-ed input{width:106px;padding:8px 9px;font-family:var(--mono);font-size:14px;text-align:right;background:#fff}
.rate-ed .btn{padding:7px 13px;font-size:13px}
.rate-ed .lbl{font-size:12.5px;color:var(--saffron-deep);font-weight:700}
.editflag{display:inline-block;font-size:11px;font-weight:700;color:var(--saffron-deep);
  background:var(--saffron-soft);border:1px solid #F5CFAF;border-radius:20px;padding:1px 8px;margin-left:6px}
@media(max-width:430px){
  .ln-ed{gap:9px}
  .ln-amt{margin-left:0;width:100%;text-align:right;border-top:1px dashed var(--rule2);padding-top:9px}
}
.ln-was{margin-top:7px;font-size:12px;color:var(--saffron-deep);background:var(--saffron-soft);
  border-radius:6px;padding:5px 9px;display:inline-block}
.ln-was button{background:none;border:0;color:var(--saffron-deep);font-weight:700;cursor:pointer;
  text-decoration:underline;padding:0;font-size:12px}
#cfForm .cfrow3{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
#cfForm .cfrow3 .btn{height:38px}

/* ---------- purchase requirements ---------- */
.addbox{border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;background:var(--panel2)}
.addbox>summary{cursor:pointer;list-style:none;font-family:var(--cond);font-weight:700;font-size:15.5px;color:var(--saffron-deep)}
.addbox>summary::-webkit-details-marker{display:none}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--rule2)}
.prow:last-child{border-bottom:0}
.prow.u-critical{box-shadow:inset 4px 0 0 var(--danger)}
.prow.u-urgent{box-shadow:inset 4px 0 0 var(--saffron)}
.prow.u-normal{box-shadow:inset 4px 0 0 var(--verd)}
.prow.st-received{opacity:.6}
.prow .nm{font-size:14px;line-height:1.4;min-width:0}
.prow .nm b{font-size:14.5px}
.prow .nm span{display:block;color:var(--steel);font-size:12.5px;margin-top:2px}
.prow .nm .meta{font-size:11.5px;color:var(--steel2)}
.prow .nm .tag{display:inline-block;margin-left:5px}
.practs{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.practs select{padding:7px 9px;font-size:13px;width:auto}
.urgpick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
@media(max-width:560px){.urgpick{grid-template-columns:1fr}}
.urgbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left;
  border:2px solid var(--rule);background:var(--panel);border-radius:var(--r);padding:12px 13px;min-height:64px}
.urgbtn .dot{font-size:15px;line-height:1}
.urgbtn .ul{font-weight:700;font-size:14px}
.urgbtn .uh{font-size:11.5px;color:var(--steel);line-height:1.35}
.urgbtn.on.u-critical{border-color:var(--danger);background:var(--danger-soft)}
.urgbtn.on.u-urgent{border-color:var(--saffron);background:var(--saffron-soft)}
.urgbtn.on.u-normal{border-color:var(--verd);background:var(--verd-soft)}
.prow .qtyline{font-size:13px;color:var(--ink2)}
.prow .qtyline b{color:var(--ink)}
.prow .short{color:var(--danger);font-weight:700}
.histbox{margin-top:22px;border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;background:var(--panel2)}
.histbox>summary{cursor:pointer;list-style:none;font-family:var(--cond);font-weight:700;font-size:15.5px;
  display:flex;align-items:center;gap:10px}
.histbox>summary::-webkit-details-marker{display:none}
.histbox>summary .cnt{background:var(--panel);border:1px solid var(--rule);color:var(--steel);
  font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:20px}
.aboutmark{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--rule2)}
.aboutmark img{max-width:190px;height:auto}
.aboutmark b{display:block;font-family:var(--cond);font-size:19px;font-weight:800}
.aboutmark span{display:block;color:var(--steel);font-size:13.5px;margin-top:2px}
.aboutmark a{color:var(--saffron-deep)}
.legal{border-bottom:1px solid var(--rule2);padding:4px 0}
.legal>summary{cursor:pointer;list-style:none;padding:13px 0;font-family:var(--cond);font-weight:700;font-size:15.5px;
  display:flex;align-items:center;gap:10px}
.legal>summary::-webkit-details-marker{display:none}
.legal>summary::before{content:"";width:8px;height:8px;border-right:2.2px solid var(--saffron);
  border-bottom:2.2px solid var(--saffron);transform:rotate(45deg);margin-top:-3px;flex:0 0 auto}
.legal[open]>summary::before{transform:rotate(225deg);margin-top:2px}
.legal p,.legal li{font-size:13.5px;line-height:1.6;color:var(--ink2);margin:0 0 10px}
.legal ul{padding-left:19px;margin:0 0 10px}
/* ---------- sign in & team ---------- */
.signin{max-width:460px;margin:0 auto}
.note.bad{background:var(--danger-soft);border-left-color:var(--danger);color:#7A241A}
.note.bad b{color:var(--danger)}
.whobox{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--rule);
  border-radius:var(--r);background:var(--panel2);flex-wrap:wrap}
.whobox .avatar{width:46px;height:46px;border-radius:50%;background:var(--saffron);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:0 0 auto}
.whobox b{display:block;font-size:15.5px}
.whobox span{display:block;color:var(--steel);font-size:13px;margin-top:2px}
.whobox>div{flex:1 1 160px;min-width:0}
.whobox .tag{margin-right:5px}
h3.sect{font-family:var(--cond);font-size:19px;font-weight:800;letter-spacing:-.01em;margin:26px 0 10px}
.backendpick{display:grid;gap:9px}
.bopt{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border:2px solid var(--rule);
  border-radius:var(--r);cursor:pointer;background:var(--panel)}
.bopt:has(input:checked){border-color:var(--saffron);background:var(--saffron-soft)}
.bopt input{margin-top:3px;width:18px;height:18px;accent-color:var(--saffron);flex:0 0 auto}
.bopt span{font-size:13px;color:var(--steel);line-height:1.45}
.bopt b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
/* ---------- badges ---------- */
.tabs button{position:relative}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;margin-left:6px;border-radius:10px;background:var(--danger);color:#fff;
  font-family:var(--mono);font-size:11px;font-weight:600;line-height:1;vertical-align:middle}
.badge.amber{background:var(--saffron)}

/* ---------- rate switch inside the quotation ---------- */
.dk-tier{display:flex;align-items:center;gap:6px;padding:11px 16px 0;flex-wrap:wrap}
.dk-tier>span{font-size:12px;font-weight:700;color:var(--steel);margin-right:2px}
.dk-tier button{flex:1 1 auto;border:1.5px solid var(--rule);background:var(--panel);border-radius:var(--r-sm);
  padding:8px 6px;font-family:var(--cond);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink2)}
.dk-tier button[aria-pressed=true]{background:var(--saffron);border-color:var(--saffron);color:#fff}

/* ---------- products ---------- */
.prodbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.prodbar .fgrow{flex:1 1 auto}
.note.conf{background:var(--saffron-soft);border-left-color:var(--saffron)}
.prodrow{display:grid;grid-template-columns:minmax(0,1.4fr) auto auto;gap:14px;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--rule2)}
.prodrow:last-child{border-bottom:0}
.prodrow.archived{opacity:.55}
.prodrow .nm{min-width:0;font-size:14px;line-height:1.4}
.prodrow .nm b{font-family:var(--mono);font-size:13.5px}
.prodrow .nm span{display:block;color:var(--steel);font-size:12.5px;margin-top:2px}
.prodrow .nm .spec2{color:var(--ink2);font-size:12px}
.prodrow .nm .meta{font-size:11.5px;color:var(--steel2)}
.prices{display:flex;gap:14px;flex-wrap:wrap}
.pcell{text-align:right;min-width:82px}
.pcell span{display:block;font-size:11px;color:var(--steel);font-weight:600}
.pcell b{font-family:var(--mono);font-size:13.5px}
.pcell.unset b{color:var(--steel2);font-family:var(--sans);font-size:12.5px;font-weight:600}
.pr.unset{color:var(--steel2);font-size:13px}
.confbox{border:1px solid var(--saffron);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;background:var(--saffron-soft)}
.confbox h4{margin:0 0 10px;font-family:var(--cond);font-size:16px}
.confrow{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;
  padding:10px 0;border-top:1px solid #F0CDAE}
.confrow b{font-family:var(--mono);font-size:13px}
.confrow span{display:block;font-size:12.5px;color:var(--ink2)}
.confrow .meta{font-size:11.5px;color:var(--steel)}
.confpick{display:flex;gap:7px;flex-wrap:wrap}
@media(max-width:720px){
  .prodrow{grid-template-columns:1fr;row-gap:11px}
  .prices{gap:16px}
}

/* ---------- modal form ---------- */
.modal{position:fixed;inset:0;z-index:500;background:rgba(26,31,36,.55);display:flex;
  align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;overscroll-behavior:contain}
.modal-in{background:var(--panel);border-radius:var(--r);padding:20px;width:100%;max-width:560px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);margin:auto}
.modal-in h3{margin:0 0 16px;font-family:var(--cond);font-size:21px;font-weight:800}
.modal-acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.partybar{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;padding-top:2px}
#qPickPanel{grid-column:1/-1;border:1px solid var(--rule);border-radius:var(--r);padding:10px;background:var(--panel2)}
#qPickPanel input{width:100%;padding:9px 10px;font-size:14px;margin-bottom:8px}
#qPickList{max-height:200px;overflow-y:auto;overscroll-behavior:contain}
.pickrow{display:block;width:100%;text-align:left;border:0;background:var(--panel);cursor:pointer;
  padding:9px 11px;border-radius:var(--r-sm);margin-bottom:5px}
.pickrow:hover{background:var(--saffron-soft)}
.pickrow b{display:block;font-size:13.5px}
.pickrow span{display:block;font-size:12px;color:var(--steel);margin-top:1px}
.imgpick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.imgpick{grid-template-columns:1fr}}
.imgpick>div{border:1px solid var(--rule);border-radius:var(--r);padding:13px;background:var(--panel2)}
.imgpick>div>span{display:block;font-size:12px;font-weight:600;color:var(--steel);margin-bottom:8px}
.imgpick img{max-width:100%;max-height:92px;display:block;margin-bottom:10px;background:#fff}
.imgpick input[type=file]{font-size:12px;margin-bottom:8px;width:100%}
.numprev{margin:12px 0 0;font-size:13.5px;color:var(--ink2)}
.numprev b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.copyfoot{margin:22px 0 0;padding-top:16px;border-top:1px solid var(--rule2);
  text-align:center;font-size:12px;color:var(--steel2)}
.tag.u-critical{background:var(--danger-soft);color:var(--danger);border-color:#F3C9C4}
.tag.u-urgent{background:var(--saffron-soft);color:var(--saffron-deep);border-color:#F5CFAF}
.tag.u-normal{background:var(--verd-soft);color:var(--verd-deep);border-color:#BFE2CD}
@media(max-width:620px){
  .prow{grid-template-columns:1fr;row-gap:11px}
  .practs{justify-content:flex-start}
  .practs select{flex:1 1 auto}
}

/* ---------- stock ---------- */
.tag.r{background:#FCEAE8;color:#A3281B;border-color:#EFC6C0}
.syncbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:var(--r);
  border:1px solid var(--rule);background:var(--panel2);font-size:13.5px;margin-bottom:18px}
.syncbar span{flex:1 1 220px;min-width:0}
.syncbar.good{background:var(--verd-soft);border-color:#BFDCCF;color:#0E4F3A}
.syncbar.bad{background:#FCEAE8;border-color:#EFC6C0;color:#8A2318}
.syncbar.busy{background:var(--saffron-soft);border-color:#F0CDAE;color:var(--saffron-deep)}
.strow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;
  padding:12px 14px;border-bottom:1px solid var(--rule2)}
.strow:last-child{border-bottom:0}
.strow:nth-child(even){background:var(--panel2)}
.strow.out{box-shadow:inset 3px 0 0 #C0392B}
.strow.low{box-shadow:inset 3px 0 0 var(--saffron)}
.strow .nm{font-size:14px;line-height:1.35;min-width:0}
.strow .nm b{font-family:var(--mono);font-size:13px;font-weight:600}
.strow .nm span{display:block;color:var(--steel);font-size:12.5px}
.strow .nm .meta{font-size:11.5px;color:var(--steel2)}
.strow .qty{display:flex;align-items:center;gap:5px}
.stepb{width:32px;height:32px;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r-sm);
  cursor:pointer;font-size:17px;line-height:1;color:var(--ink2)}
.stepb:hover{border-color:var(--saffron);color:var(--saffron)}
.qin{width:64px;text-align:center;padding:6px 4px;font-family:var(--mono);font-weight:600}
.minf{display:flex;flex-direction:column;gap:3px}
.minf span{font-size:11px;color:var(--steel);white-space:nowrap}
.minf input{width:70px;text-align:center;padding:5px 4px;font-family:var(--mono);font-size:12.5px}
@media(max-width:620px){
  .strow{grid-template-columns:1fr auto;row-gap:10px}
  .strow .nm{grid-column:1/-1}
  .minf{flex-direction:row;align-items:center;gap:7px}
}

/* ---------- docket (signature) ---------- */
.docket{position:sticky;top:104px}
@media(max-width:1080px){.docket{position:static;transform:none;max-height:none;padding:0}}
.dk{background:var(--panel);border:1px solid var(--rule);box-shadow:var(--shadow);position:relative;border-radius:0 0 var(--r) var(--r)}
.dk::before{
  content:"";position:absolute;left:-1px;right:-1px;top:-9px;height:9px;
  background:
    radial-gradient(circle at 6px 9px, transparent 5.5px, var(--rule) 5.5px, var(--rule) 6.3px, var(--panel) 6.4px) repeat-x;
  background-size:12px 9px;
}
.dk-back{
  display:none;width:100%;background:none;border:0;cursor:pointer;text-align:left;
  padding:2px 16px 10px;font-family:var(--cond);font-weight:700;font-size:13.5px;color:var(--saffron);
}
@media(max-width:1080px){.dk-back{display:block}}
.dk-hd{padding:16px 16px 12px;border-bottom:2px solid var(--ink)}
.dk-hd h3{margin:0;font-family:var(--cond);font-weight:800;font-size:20px;letter-spacing:-.015em}
.dk-hd .meta{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.dk-meta{padding:12px 16px;border-bottom:1px dashed var(--rule);display:grid;gap:9px;grid-template-columns:1fr 1fr}
.dk-meta input{padding:6px 8px;font-size:13px}
.dk-meta label.f>span{font-size:10.5px;margin-bottom:3px}
.dk-lines{max-height:min(46vh,460px);overflow-y:auto;overscroll-behavior:contain;padding:4px 0}
@media(max-width:1080px){.dk-lines{max-height:none;overflow:visible}}
/* one quotation line, stacked so nothing can collide on a narrow screen */
.ln{display:block;padding:14px 16px;border-bottom:1px solid var(--rule2)}
.ln:last-child{border-bottom:0}
.ln .t{font-size:14px;line-height:1.4;min-width:0;overflow-wrap:anywhere;word-break:normal;hyphens:none}
.ln .t b{font-weight:700;display:block}
.ln .t span{display:block;color:var(--steel);font-size:12.5px;margin-top:3px;line-height:1.45;overflow-wrap:anywhere}
.dk-add{padding:10px 16px 12px;border-top:1px dashed var(--rule)}
.lnk{background:none;border:0;padding:0;cursor:pointer;font-family:var(--cond);
  letter-spacing:0;font-weight:700;font-size:13px;color:var(--saffron)}
.lnk:hover{color:var(--saffron-deep)}
#cfForm{display:grid;gap:7px;margin-top:9px}
#cfForm input{padding:7px 9px;font-size:13px}
#cfForm .cfrow{display:grid;grid-template-columns:1fr auto;gap:7px}
.dk-foot{padding:14px 16px 16px;border-top:2px solid var(--ink);background:var(--panel2)}
.frow{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;padding:3px 0}
.frow .num{font-weight:500}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.grand .lbl{font-family:var(--cond);letter-spacing:-.01em;font-weight:700;font-size:16px}
.grand .val{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}
.dk-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dk-acts .btn{width:100%}
.dk-acts .wide{grid-column:1/-1}
.tport{padding:0 0 12px;margin-bottom:11px;border-bottom:1px dashed var(--rule);display:grid;gap:8px}
.tport .tprow{display:grid;grid-template-columns:118px 1fr;gap:7px}
.tport input{padding:7px 9px;font-size:13px}
.tport.off .tprow{opacity:.5}
.tpk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer}
.tpk input{width:16px;height:16px;accent-color:var(--saffron);cursor:pointer}
.gstline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--steel);margin-top:8px}
.gstline input{width:15px;height:15px;accent-color:var(--saffron)}

/* ---------- prices editor ---------- */
.pgroup{border:1px solid var(--rule);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.pgroup>summary{
  cursor:pointer;padding:13px 15px;background:var(--panel2);display:flex;align-items:center;gap:12px;
  font-family:var(--cond);letter-spacing:-.01em;font-weight:700;font-size:15.5px;list-style:none;
}
.pgroup>summary::-webkit-details-marker{display:none}
.pgroup>summary::before{content:"+";font-family:var(--mono);color:var(--saffron);font-weight:600}
.pgroup[open]>summary::before{content:"–"}
.pgroup>summary .count{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--steel);letter-spacing:0;font-weight:400}
.ptbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ptbl{width:100%;min-width:700px;border-collapse:collapse;font-size:13.5px}
.ptbl th{text-align:left;font-family:var(--cond);letter-spacing:0;font-size:12px;color:var(--steel);font-weight:600;padding:9px 10px;background:var(--panel);border-bottom:1px solid var(--rule)}
.ptbl th.n{text-align:right}
.ptbl td{padding:6px 10px;border-bottom:1px solid var(--rule2);vertical-align:middle}
.ptbl tr:last-child td{border-bottom:0}
.ptbl .mdl{font-family:var(--mono);font-size:12.5px;font-weight:600}
.ptbl .dsc{color:var(--steel);font-size:12.5px;display:block;max-width:46ch}
.ptbl .nmin{width:100%;max-width:420px;text-align:left;font-family:var(--sans);font-size:12.5px;color:var(--steel);
  background:transparent;border:1px solid transparent;padding:3px 5px}
.ptbl .nmin:hover,.ptbl .nmin:focus{background:var(--panel);border-color:var(--rule)}
.ptbl .mdin{width:100%;max-width:210px;text-align:left;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);
  background:transparent;border:1px solid transparent;padding:3px 5px}
.ptbl .mdin:hover,.ptbl .mdin:focus{background:var(--panel);border-color:var(--rule)}
.ptbl .uin{width:86px;text-align:left;font-size:12px;font-family:var(--cond);letter-spacing:0}
.ptbl tr.gone{opacity:.45}
.rowacts{display:flex;gap:6px;align-items:center;margin-top:4px}
.rowacts button{background:none;border:0;padding:0;cursor:pointer;font-family:var(--cond);
  letter-spacing:0;font-size:12px;font-weight:600;color:var(--steel)}
.rowacts button:hover{color:var(--saffron)}
.addrow{padding:10px 12px;background:var(--panel2);border-top:1px solid var(--rule)}

@media(max-width:760px){
  .ptbl-wrap{overflow-x:visible}
  .ptbl{min-width:0}
  .ptbl thead{display:none}
  .ptbl,.ptbl tbody,.ptbl tr,.ptbl td{display:block;width:100%}
  .ptbl tr{border-bottom:1px solid var(--rule);padding:12px 12px 14px}
  .ptbl tr:last-child{border-bottom:0}
  .ptbl td{border:0;padding:4px 0}
  .ptbl td.pc{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .ptbl td.pc::before{content:attr(data-l);font-family:var(--cond);letter-spacing:0;
    font-size:12.5px;font-weight:600;color:var(--steel)}
  .ptbl input[type=number]{width:132px}
  .ptbl .nmin,.ptbl .mdin{max-width:none}
  .ptbl .was{display:inline;margin-left:8px}
}
.ptbl input{width:104px;text-align:right;padding:5px 7px;font-family:var(--mono);font-size:13px;background:var(--panel);border:1px solid var(--rule2)}
.ptbl input:hover{border-color:var(--rule)}
.ptbl input.edited{border-color:var(--saffron);background:var(--saffron-soft);font-weight:600}
.ptbl input.derived{color:var(--steel2)}
.ptbl td.pc{text-align:right;white-space:nowrap}
.was{display:block;font-family:var(--mono);font-size:10.5px;color:var(--saffron-deep);margin-top:2px}
.pbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--panel2);border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:18px}
.pbar label.f{flex:0 0 auto}
.pbar input[type=number],.pbar select{width:130px}
.pbar .sp{flex:1 1 auto}
.saveState{font-size:12.5px;color:var(--steel);font-family:var(--mono)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:14px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}


/* ---------- add feedback ---------- */
.btn.ok{background:var(--verd)!important;border-color:var(--verd)!important;color:#fff!important}
.pitem.just{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:var(--verd-soft)}100%{background:transparent}}
.inq{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:11px;font-weight:600;
  color:var(--verd);background:var(--verd-soft);border:1px solid #BFDCCF;border-radius:var(--r-sm);padding:1px 6px;white-space:nowrap}
.dk.bump{animation:bump .55s ease-out}
@keyframes bump{0%{box-shadow:0 0 0 0 rgba(17,103,76,.4)}100%{box-shadow:0 0 0 16px rgba(17,103,76,0)}}
#toast button{background:none;border:0;color:var(--saffron);font-family:var(--cond);
  letter-spacing:0;font-weight:700;font-size:13.5px;cursor:pointer;margin-left:14px;padding:0}
#toast button:hover{color:#fff}

/* ---------- running total bar & mobile sheet ---------- */
#qbar{display:none}
.dk-close{display:none;justify-content:center;padding:9px 0 3px}
.dk-close button{background:var(--rule);border:0;width:48px;height:5px;border-radius:var(--r);cursor:pointer;padding:0}
#scrim{position:fixed;inset:0;background:rgba(18,22,26,.5);z-index:94;opacity:0;pointer-events:none;transition:opacity .2s}
@media(max-width:1080px){
  body{padding-bottom:120px}
  #qbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:90;
    background:var(--panel);color:var(--ink);box-shadow:0 -3px 16px rgba(26,31,36,.10);
    align-items:center;gap:10px;border-top:3px solid var(--saffron);
    padding:10px 12px calc(14px + env(safe-area-inset-bottom));
  }

/* ========================= state & storage ========================= */
/* ========================= storage =========================
   IndexedDB is the real store: it survives a reload, an app restart and a
   phone reboot, and it has room for the price book. localStorage mirrors it
   as a backup for the rare case where IndexedDB is blocked (private windows,
   some embedded browsers). MEM is the last resort and lasts one session.  */

const MEM = {};
const KEY = "smartie.quotedesk.v1";
const DRAFT_KEY = KEY + ".draft";
const DB_NAME = "smartie-quote-desk", DB_STORE = "kv", DB_VER = 1;

let dbPromise = null;
function openDb(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    if(typeof indexedDB === "undefined") return rej(new Error("IndexedDB unavailable"));
    let req;
    try{ req = indexedDB.open(DB_NAME, DB_VER); }
    catch(e){ return rej(e); }
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error || new Error("IndexedDB refused"));
    req.onblocked = () => rej(new Error("IndexedDB blocked by another tab"));
  }).catch(err => { dbPromise = null; throw err; });
  return dbPromise;
}
function idbGet(k){
  return openDb().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readonly");
    const rq = tx.objectStore(DB_STORE).get(k);
    rq.onsuccess = () => res(rq.result);
    rq.onerror   = () => rej(rq.error);
  }));
}
function idbSet(k, v){
  return openDb().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(v, k);
    tx.oncomplete = () => res(true);
    tx.onerror    = () => rej(tx.error);
    tx.onabort    = () => rej(tx.error);
  }));
}
/** Where the last write actually landed — shown in Settings. */
let storageMode = "checking";

const Store = {
  async get(k){
    try{
      const v = await idbGet(k);
      if(v !== undefined && v !== null){ storageMode = "IndexedDB"; return v; }
    }catch(e){ /* fall through to the backup */ }
    try{
      const raw = localStorage.getItem(k);
      if(raw != null){
        const parsed = JSON.parse(raw);
        storageMode = "localStorage";
        // put it back into IndexedDB so the next read is from the main store
        idbSet(k, parsed).catch(()=>{});
        return parsed;
      }
    }catch(e){ /* unreadable or unavailable — not fatal */ }
    if(MEM[k] !== undefined){ storageMode = "this session only"; return MEM[k]; }
    return null;
  },
  async set(k, v){
    MEM[k] = v;                       // always, so the session is consistent
    let ok = false;
    try{ await idbSet(k, v); ok = true; storageMode = "IndexedDB"; }
    catch(e){ /* try the backup */ }
    try{ localStorage.setItem(k, JSON.stringify(v)); if(!ok){ ok = true; storageMode = "localStorage"; } }
    catch(e){ /* quota or private mode — the mirror is optional */ }
    if(!ok) storageMode = "this session only";
    return ok;
  }
};

/** Display model, description and unit, honouring any rename. */
function label(gid,it){
  const o = ovOf(gid,it.m), g = groupById(gid);
  return { m:o.md||it.m, n:o.nm||it.n, u:o.u||it.u||(g?g.unit:""), hidden:!!o.x };

function ovOf(gid,m){ return (state.ov[gid]||{})[m] || {}; }
function setOv(gid,m,key,val){
  state.ov[gid] = state.ov[gid] || {};
  state.ov[gid][m] = state.ov[gid][m] || {};
  if(val==null || val==="") delete state.ov[gid][m][key];
  else state.ov[gid][m][key] = val;
  if(!Object.keys(state.ov[gid][m]).length) delete state.ov[gid][m];
  if(!Object.keys(state.ov[gid]).length) delete state.ov[gid];
}

/** Resolve the rate for an item at a tier. Returns {v, derived, edited}. */
const NULLP = "\u2205";   // "this price is deliberately not set", distinct from "no override"
function rate(gid, m, tier){
  const g = groupById(gid), it = itemBy(gid,m);
  if(!g || !it) return {v:null, derived:false, edited:false, unset:true};
  const ov = ovOf(gid,m), k = TIERKEY[tier];
  if(ov[k]===NULLP) return {v:null, unset:true, edited:true};
  if(ov[k]!=null) return {v:ov[k], derived:false, edited:true};
  if(it[k]!=null) return {v:it[k], derived:false, edited:false};
  // A missing price stays missing. It is never quietly turned into zero.
  const d = ov.d!=null ? ov.d : it.d;
  if(tier==="dealer") return d==null ? {v:null, unset:true} : {v:d, derived:false, edited:false};
  const cRaw = ov.c!=null ? ov.c : it.c;
  const c = cRaw!=null ? cRaw : (d==null ? null : d*g.derive.c);
  if(tier==="contractor") return c==null ? {v:null, unset:true} : {v:c, derived:cRaw==null};
  return c==null ? {v:null, unset:true} : {v:c*g.derive.cl, derived:true};
}
const px = (gid,m) => rate(gid,m,state.tier).v;

/** Indian numbering, for the amount-in-words line on the printed quotation. */
function words(n){
  n = Math.round(n||0);
  if(!n) return "Zero rupees only";
  const o=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen",
    "fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const t=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  const two = v => v<20 ? o[v] : t[Math.floor(v/10)] + (v%10 ? "-"+o[v%10] : "");
  const three = v => (v>=100 ? o[Math.floor(v/100)]+" hundred"+(v%100?" and ":"") : "") + (v%100 ? two(v%100) : "");
  const parts=[];
  const cr=Math.floor(n/10000000); n%=10000000;
  const lk=Math.floor(n/100000);   n%=100000;
  const th=Math.floor(n/1000);     n%=1000;
  if(cr) parts.push(three(cr)+" crore");
  if(lk) parts.push(three(lk)+" lakh");
  if(th) parts.push(three(th)+" thousand");
  if(n)  parts.push(three(n));
  const s=parts.join(" ");
  return s.charAt(0).toUpperCase()+s.slice(1)+" rupees only";
}

function toast(msg, actLabel, fn){
  const t=$("#toast");
  t.innerHTML = esc(msg) + (actLabel?` <button type="button" id="tAct">${esc(actLabel)}</button>`:"");
  t.classList.add("on");
  if(actLabel) $("#tAct").onclick = () => { fn(); t.classList.remove("on"); };
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), actLabel?4500:2200);
}
function flashBtn(b){
  if(!b) return;
  if(!b.dataset.label) b.dataset.label = b.textContent;
  b.textContent = "Added \u2713"; b.classList.add("ok");
  clearTimeout(b._t); b._t = setTimeout(()=>{ b.textContent = b.dataset.label; b.classList.remove("ok"); }, 1500);
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove(); return ok;
  }
}

/* ========================= quote docket =========================
   One line per product. Adding the same product again raises its quantity
   instead of making a second line. Quantity and rate can both be edited
   here; a rate changed on a quotation never touches the master price book. */

const amtOf = l => Math.max(0,(+l.qty||0)) * Math.max(0,(+l.rate||0));

/** Accept both the catalogue shape and the older calculator shape. */
function normLine(l){
  const qty  = l.qty!=null ? +l.qty : (l.q!=null && !isNaN(+l.q) ? +l.q : 1);
  const rate = l.rate!=null ? +l.rate : (l.amt!=null ? (+l.amt)/(qty||1) : 0);
  return {
    k: l.k||null, t: l.t, s: l.s||"", u: l.u||"",
    qty: Math.max(0,qty||0), rate: Math.max(0,rate||0),
    origRate: l.origRate!=null ? +l.origRate : Math.max(0,rate||0),
    qlabel: (typeof l.q === "string") ? l.q : null,
    manual: !!l.manual
  };
}
const qLabel = l => l.qlabel || `${num(l.qty,2)} ${l.u || "no"}`;

/** The quoted lines, plus transportation when that field has been filled in. */
function quoteLines(){
  const L=state.lines.slice(), t=state.transport;
  if(t.on && t.amt>0) L.push(normLine({t:"Transportation", s:t.note||"", amt:t.amt, q:"1 no"}));
  return L;
}
const subtotal = () => quoteLines().reduce((a,l)=>a+amtOf(l),0);
const grandTotal = () => { const s=subtotal(); return s + (state.gst ? s*gstRate() : 0); };

const lineIndex = k => state.lines.findIndex(l=>l.k===k);

/** Raise or lower a catalogue product's quantity. Zero removes the line. */
function changeQty(k, delta, absolute){
  const i = lineIndex(k);
  if(i<0){
    const q = absolute!=null ? absolute : delta;
    if(!(q>0)) return;
    const [gid,m]=k.split("|");
    const it=itemBy(gid,m); if(!it) return;
    const L=label(gid,it);
    let r=px(gid,m);
    if(r==null){                    // no price on this tier — ask, never assume zero
      const ans=prompt(`${L.m} has no ${TIERNAME[state.tier].replace(" rate","").toLowerCase()} price set.\n\nEnter the rate to use on this quotation:`,"");
      if(ans===null) return;
      r=+ans;
      if(isNaN(r) || r<0){ toast("That is not a valid rate"); return; }
    }
    state.lines.push(normLine({k, t:`${L.m} — ${L.n}`, s:"", u:L.u, qty:q, rate:r, origRate:r}));
  } else {
    const l=state.lines[i];
    l.qty = absolute!=null ? Math.max(0,absolute) : l.qty + delta;
    if(!(l.qty>0)) state.lines.splice(i,1);
  }

}

/** Change the rate type. Catalogue lines follow; manual items and rates the
    user typed over are left exactly as they are. */
function setTier(t){
  if(!TIERNAME[t] || t===state.tier) return;
  const prev=state.tier;
  state.tier=t;
  let moved=0, kept=0; const missing=[];
  state.lines.forEach(l=>{
    if(l.manual || !l.k){ kept++; return; }
    if(Math.abs(l.rate-l.origRate)>0.004){ kept++; return; }   // an override the user set
    const [gid,m]=l.k.split("|");
    const nv=px(gid,m);
    if(nv==null){ missing.push(l.t.split(" \u2014 ")[0]); return; }
    l.rate=nv; l.origRate=nv; moved++;
  });
  $$("[data-tier]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tier===state.tier));
  refreshAll();
  if(!["prices","products"].includes(state.view)) render(); else renderDocket();
  if(missing.length) toast(`No ${TIERNAME[t].replace(" rate","").toLowerCase()} price for ${missing.slice(0,2).join(", ")}${missing.length>2?" +"+(missing.length-2):""} \u2014 set a rate on the line`);
  else if(kept) toast(`${TIERNAME[t]} \u00b7 ${moved} repriced, ${kept} left as entered`);
  else toast(TIERNAME[t]);
}

/* ========================= the unfinished quotation =========================
   Whatever is on the docket is kept, so closing the app, losing signal or a
   phone restart does not throw the work away. It is cleared only when the
   quotation is finalised or when the user asks for a new one. */

let draftTimer = null;
function draftSnapshot(){
  const g = id => { const el=$(id); return el ? el.value : ""; };
  return {
    at: Date.now(),
    draftId: state.draftId || null,
    tier: state.tier,
    gst: state.gst,
    transport: state.transport,
    lines: state.lines,
    party: {
      client:  g("#qClient"), site: g("#qSite"),  gstin: g("#qGst"),
      contact: g("#qContact"), phone: g("#qPhone"),
      email:   g("#qEmail"),   addr:  g("#qAddr")
    }
  };
}
function saveDraft(){
  if(isFinalised()) return;                   // a finalised quotation is history, not a draft
  clearTimeout(draftTimer);
  draftTimer = setTimeout(()=>{
    const d = draftSnapshot();
    const empty = !d.lines.length && !d.transport.amt &&
                  !Object.values(d.party).some(Boolean);
    if(empty){ Store.set(DRAFT_KEY, null).catch(()=>{}); return; }
    Store.set(DRAFT_KEY, d).catch(()=>{});
  }, 500);
}
function clearDraft(){
  clearTimeout(draftTimer);
  Store.set(DRAFT_KEY, null).catch(()=>{});
}
async function restoreDraft(){
  let d = null;
  try{ d = await Store.get(DRAFT_KEY); }catch(e){ return false; }
  if(!d || typeof d !== "object") return false;
  try{
    if(Array.isArray(d.lines) && d.lines.length) state.lines = d.lines.map(l=>normLine(l));
    if(d.draftId) state.draftId = d.draftId;
    if(d.tier && TIERNAME[d.tier]) state.tier = d.tier;
    if(typeof d.gst === "boolean") state.gst = d.gst;
    if(d.transport && typeof d.transport === "object"){
      state.transport = {on:!!d.transport.on, amt:+d.transport.amt||0, note:d.transport.note||""};
      const on=$("#trOn"), amt=$("#trAmt"), note=$("#trNote");
      if(on)  on.checked = state.transport.on;
      if(amt) amt.value  = state.transport.amt || "";
      if(note)note.value = state.transport.note || "";
    }
    const p = d.party || {};
    [["#qClient",p.client],["#qSite",p.site],["#qGst",p.gstin],["#qContact",p.contact],
     ["#qPhone",p.phone],["#qEmail",p.email],["#qAddr",p.addr]]
      .forEach(([id,v])=>{ const el=$(id); if(el && v) el.value=v; });
    const g=$("#gstOn"); if(g) g.checked = state.gst;
    return !!(state.lines.length || state.transport.amt || Object.values(p).some(Boolean));
  }catch(e){ return false; }
}

document.addEventListener("click", e=>{
  const q=e.target.closest("[data-lq]");
  if(q){
    const l=state.lines[+q.dataset.lq]; if(!l) return;
    l.qty = Math.max(0, (+l.qty||0) + (+q.dataset.d));
    if(!(l.qty>0)) state.lines.splice(+q.dataset.lq,1);
    renderDocket(); return;
  }
  const rst=e.target.closest("[data-lrst]");
  if(rst){
    const l=state.lines[+rst.dataset.lrst]; if(!l) return;
    l.rate=l.origRate; renderDocket(); toast("Catalogue rate restored"); return;
  }
  const ed=e.target.closest("[data-ledit]");
  if(ed){
    const i=+ed.dataset.ledit, l=state.lines[i]; if(!l) return;
    const row=ed.closest(".ln");

    inp.addEventListener("keydown", ev=>{
      if(ev.key==="Enter") box.querySelector("[data-rsave]").click();
      if(ev.key==="Escape") box.remove();
    });

  }
  const sv=e.target.closest("[data-rsave]");
  if(sv){
    const i=+sv.dataset.rsave, l=state.lines[i]; if(!l) return;
    const v=+sv.closest(".rate-ed").querySelector("input").value;

/* Freezing the body with position:fixed is the only approach Android Chrome
   respects; plain overflow:hidden still lets the page behind scroll. The
   scroll position is parked and put back exactly on close. */
let parkedScroll = 0, bodyLocked = false;
function lockBody(on){
  const mobile = window.innerWidth<=1080;
  if(on && mobile && !bodyLocked){
    parkedScroll = window.scrollY || document.documentElement.scrollTop || 0;
    document.body.style.position="fixed";
    document.body.style.top = `-${parkedScroll}px`;
    document.body.style.left="0"; document.body.style.right="0";
    document.body.style.width="100%";
    document.body.style.overflow="hidden";
    bodyLocked=true;
  } else if(!on && bodyLocked){
    document.body.style.position=""; document.body.style.top="";
    document.body.style.left=""; document.body.style.right="";
    document.body.style.width=""; document.body.style.overflow="";
    bodyLocked=false;
    window.scrollTo(0, parkedScroll);
  }
}
function openSheet(on){
  $(".docket").classList.toggle("open", on);
  $("#scrim").classList.toggle("on", on);
  lockBody(on);
}
const sheetOpen = () => $(".docket").classList.contains("open");

/* ---------- going back ----------
   One stack of undoable steps: a tab you came from, or the open quotation
   sheet. The device back button rides on the same stack through history. */
const nav = [];
let HIST_OK = false;

function scrollTop(){ try{ window.scrollTo({top:0,behavior:"instant"}); }catch(e){ window.scrollTo(0,0); } }
function updateBack(){
  const b=$("#btnBack"); if(!b) return;
  b.hidden = nav.length===0;
}
function pushNav(entry){
  nav.push(entry);
  try{ history.pushState({qd:1}, ""); HIST_OK=true; }catch(e){ HIST_OK=false; }
  updateBack();
}
function applyBack(){
  const e=nav.pop();
  if(e){
    if(e.sheet) openSheet(false);
    else if(e.view){ state.view=e.view; render(); scrollTop(); }
  }
  updateBack();
}
/** Undo one step, keeping browser history in step where it is available. */
function stepBack(){
  if(!nav.length) return;
  if(HIST_OK) history.back();   // popstate runs applyBack
  else applyBack();
}
function goView(v){
  if(v===state.view) return;
  if(sheetOpen()) closeSheet();
  pushNav({view:state.view});
  state.view=v; render(); scrollTop();
}
function showSheet(){ openSheet(true); pushNav({sheet:true}); }
function closeSheet(){
  if(!sheetOpen()) return;
  if(nav.length && nav[nav.length-1].sheet) stepBack();
  else openSheet(false);
}
window.addEventListener("popstate", applyBack);

    const sys=$("#sSys").value;
    const dwSlats=["ALDW80-MILL","ALDW80-WM","ALDW80-PUFF","ALDW80-WOOD"];
    const swSlats=["ALSW77-RECT","ALSW77-HC"];
    const sgs=["ALSG80-MILL","ALSG80-WM","ALSG80-WOOD","ALSG100"];
    const btms=["ALBTM80-MILL","ALBTM80-WM","ALBTM80-WOOD"];
    const slatSet = sys==="dw"?dwSlats : sys==="sw"?swSlats : ["PCROLL"];
    const btmSet  = sys==="pc"?["ALBTM-PC"]:btms;
    const prevSlat=$("#sSlat")?.value, prevSg=$("#sSg")?.value, prevBtm=$("#sBtm")?.value;
    $("#sPick").innerHTML =
      fieldSel("sSlat", sys==="pc"?"Polycarbonate roll":"Slat & finish", slatOpts(g,slatSet), slatSet.includes(prevSlat)?prevSlat:slatSet[0]) +
      fieldSel("sSg","Side guide", slatOpts(g,sgs), sgs.includes(prevSg)?prevSg:"ALSG80-WM") +
      fieldSel("sBtm","Bottom profile", slatOpts(g,btmSet), btmSet.includes(prevBtm)?prevBtm:btmSet[0]);
    $("#sConnWrap").hidden = sys!=="pc";
    $("#sPick").querySelectorAll("select").forEach(s=>s.addEventListener("change",calc));
    calc();
  };
  const calc = () => {
    const FT = 304.8;
    const wFt=+$("#sW").value||0, hFt=+$("#sH").value||0, q=Math.max(1,+$("#sQ").value||1), sys=$("#sSys").value;
    const wM = wFt*FT/1000, hM = hFt*FT/1000, hMM = hFt*FT;
    if(!wM||!hM){ $("#sOut").innerHTML=""; $("#sSpec").innerHTML=""; return; }
    const pitch = sys==="dw"?80 : sys==="sw"?77 : 117;
    const n = Math.ceil(hMM/pitch);
    const rows=[];
    const slatM = label(g, itemBy(g,$("#sSlat").value));
    const rSlat = px(g,$("#sSlat").value);
    const slatMtr = n*wM*q;
    rows.push({t:slatM.n, s:`${n} ${sys==="pc"?"connector pitches":"slats"} at ${num(wM)} m — ${num(slatMtr)} m`, q:`${num(slatMtr)} m`, rt:money(rSlat), amt:slatMtr*rSlat});

      const r=px(g,"PCCONN"); rows.push({t:itemBy(g,"PCCONN").n, s:`${n} connectors at ${num(wM)} m`, q:`${num(n*wM*q)} m`, rt:money(r), amt:n*wM*q*r});
    }
    const sgM=label(g, itemBy(g,$("#sSg").value)), rSg=px(g,$("#sSg").value), sgMtr=2*hM*q;
    rows.push({t:sgM.n, s:`2 lengths at ${num(hM)} m`, q:`${num(sgMtr)} m`, rt:money(rSg), amt:sgMtr*rSg});
    const btM=label(g, itemBy(g,$("#sBtm").value)), rBt=px(g,$("#sBtm").value);
    rows.push({t:btM.n, s:`1 length at ${num(wM)} m`, q:`${num(wM*q)} m`, rt:money(rBt), amt:wM*q*rBt});
    if($("#sCaps").checked){
      const key = sys==="pc"?"PCFL-ENDCAP":"ENDCAP", r=px(g,key), pcs=2*n*q;
      rows.push({t:label(g,itemBy(g,key)).n, s:`2 per ${sys==="pc"?"connector":"slat"}`, q:`${pcs} pc`, rt:money(r), amt:pcs*r});
    }
    if($("#sSeal").checked){ const r=px(g,"BTMSEAL"); rows.push({t:label(g,itemBy(g,"BTMSEAL")).n, s:"Full width", q:`${num(wM*q)} m`, rt:money(r), amt:wM*q*r}); }
    if($("#sVel").checked){ const r=px(g,"VELVET"); rows.push({t:label(g,itemBy(g,"VELVET")).n, s:"Both side guides", q:`${num(2*hM*q)} m`, rt:money(r), amt:2*hM*q*r}); }

    $("#sSpec").innerHTML = [
      ["Opening", `${num(wM)} × ${num(hM)} m`],
      [sys==="pc"?"Connectors":"Slats", `${n} at ${pitch} mm`],
      ["Curtain", `${num(n*wM)} m per shutter`],
      ["Side guide", `${num(2*hM)} m per shutter`]
    ].map(([k,v])=>`<span><b>${k}</b> ${v}</span>`).join("");
    $("#sOut").innerHTML = outBlock(rows, `Slat count is rounded up to a whole slat. Lengths converted at 1 ft = 304.8 mm, as printed on the profile list. Profile only — no motor, fabrication or fitting.`);
    $("#btnAdd").onclick = (ev) => addLines(rows.map(r=>({t:r.t, s:`${wFt}′ × ${hFt}′ shutter${q>1?` × ${q}`:""} — ${r.q} @ ${r.rt}`, amt:r.amt})), ev.currentTarget);
  };
  ["sW","sH","sQ","sCaps","sSeal","sVel"].forEach(id=>$("#"+id).addEventListener("input",calc));
  $("#sSys").addEventListener("change",draw);
  document.addEventListener("change", e=>{ if(e.target.id==="sConn") calc(); });
  draw();
};

    const q=Math.max(1,+$("#hQ").value||1);

    const cH=oH+aH, cW=oW+aW;

    const shaftFt=cW/FT;
    const slab = area<=15?"PVC-A" : area<=18?"PVC-B" : area<=25?"PVC-C" : "PVC-D";
    const rows=[];
    const rCur=px("hsdbuild",slab);
    rows.push({t:"PVC curtain, 700–900 GSM EN-standard fabric",
      s:`MS guide with brush seal, rubber bottom seal, middle joint bar in welded pockets · ${num(area)} m² complete`,
      q:`${num(sqft*q)} sq ft`, rt:money(rCur), amt:sqft*q*rCur});

    rows.push({t:"MS roller shaft with both-side bearing", s:`Shaft length ${num(shaftFt)} ft`, q:`${num(shaftFt*q)} ft`, rt:money(rSh), amt:shaftFt*q*rSh});

      rows.push({t:"Top cover for shutter", s:"Motor cover not included", q:`${num(shaftFt*q)} ft`, rt:money(r), amt:shaftFt*q*r}); }

    const motors=itemsOf("hsdmotor").filter(i=>i.area).sort((a,b)=>a.area-b.area);
    autoM = motors.find(i=>area<=i.area) || motors[motors.length-1];
    const mm = mSel==="auto" ? autoM : itemBy("hsdmotor",mSel);
    const rM=px("hsdmotor",mm.m);
    rows.push({t:label("hsdmotor",mm).m+" — "+label("hsdmotor",mm).n.replace(/^High-speed door motor — |^Direct drive motor — /,"motor, "), s:"Motor with control unit", q:`${q} no`, rt:money(rM), amt:rM*q});

    if(pc){ const r=px("gate","PHOTOCELL"); rows.push({t:"Photocell sensor", s:"Wired, 10 m anti-sun", q:`${pc} set`, rt:money(r), amt:pc*r}); }

    $("#hSpec").innerHTML = [
      ["Opening", `${Math.round(oW)} × ${Math.round(oH)} mm`],
      ["Complete", `${Math.round(cW)} × ${Math.round(cH)} mm`],
      ["Area", `${num(area)} m² · ${num(sqft)} sq ft`],
      ["Shaft", `${num(shaftFt)} ft`]
    ].map(([k,v])=>`<span><b>${k}</b> ${v}</span>`).join("");
    let over = area>120 ? `<b>Over 120 m²</b> — outside the listed motor range, check with the works before quoting. ` : "";

  };
  ["hH","hW","hCH","hCW","hQ","hPc","hCov","hMotor"].forEach(id=>$("#"+id).addEventListener("input",calc));

/* ---------- catalogue browser ----------
   Products sit inside collapsible categories so nothing is a single endless
   list. Typing in the search box flattens everything into one result list,
   so a match is found even when its category is shut. */

function productCard(g, it){
  const r=rate(g.id,it.m,state.tier), L=label(g.id,it), k=`${g.id}|${it.m}`;
  const q=qtyInQuote(k);
  return `<div class="pitem${q>0?" inquote":""}" data-pk="${esc(k)}">
    <div class="nm"><b>${esc(L.m)}</b>${stockChip(g.id,it.m)}${it.kg?` <span class="tag">${it.kg} kg</span>`:""}${it.custom?` <span class="tag g">added</span>`:""}${r.derived?` <span class="tag o">derived</span>`:""}${r.edited?` <span class="tag g">edited</span>`:""}
      <span>${esc(L.n)}</span></div>
    <div class="pr${r.v==null?" unset":""}">${r.v==null?"Price not set":money(r.v)}<small>${esc(L.u)}</small></div>
    <div class="stepper" role="group" aria-label="Quantity for ${esc(L.m)}">
      <button data-pd="-1" aria-label="One fewer"${q>0?"":" disabled"}>&minus;</button>
      <input type="number" min="0" step="1" value="${q?num(q,2):0}" data-pq aria-label="Quantity in the quotation">
      <button data-pd="1" aria-label="One more">+</button>
    </div>
  </div>`;
}

function mountBrowse(sel, gids, opt={}){
  const host=$(sel);
  host.innerHTML = `${opt.hideFilters?"":`
    <div class="searchbar">
      <input type="search" data-q placeholder="Search products by model, name or description" aria-label="Search products">
      <button class="clearq" data-clear hidden aria-label="Clear search">&times;</button>
    </div>
    <div class="filters slim">
      <label class="f"><span>Minimum load, kg</span><input type="number" data-kg placeholder="any" min="0" step="50"></label>
      <div class="fgrow"></div>
      <button class="btn gh sm" data-openall>Expand all</button>
      <button class="btn gh sm" data-shutall>Collapse all</button>
    </div>`}<div data-list></div>`;

  const list=host.querySelector("[data-list]");

  const render = () => {
    const qEl=host.querySelector("[data-q]");
    const q=(qEl?.value||"").toLowerCase().trim();
    const kg=+(host.querySelector("[data-kg]")?.value||0);
    const cl=host.querySelector("[data-clear]"); if(cl) cl.hidden = !q;

    const match = (g,it) => {
      const L=label(g.id,it);
      if(opt.exclude && opt.exclude.includes(it.m)) return false;
      if(kg && !(it.kg>=kg)) return false;
      if(q && !((L.m+" "+L.n+" "+g.label).toLowerCase().includes(q))) return false;
      return true;
    };

    if(q){
      const hits=[];
      gids.forEach(id=>{ const g=groupById(id);
        visibleItems(id).forEach(it=>{ if(match(g,it)) hits.push([g,it]); }); });
      if(!hits.length){
        list.innerHTML = `<div class="empty"><b>No products found</b><br>Nothing matches “${esc(q)}”. Try a shorter word, or part of the model number.</div>`;
        return;
      }
      list.innerHTML = `<p class="reshead">${hits.length} product${hits.length>1?"s":""} matching “${esc(q)}”</p>
        <div class="plist">${hits.slice(0,300).map(([g,it])=>
          productCard(g,it).replace('<span>','<span class="cat-of">'+esc(g.label)+'</span><span>')).join("")}</div>`;
      return;
    }

    const cats = gids.map(id=>{
      const g=groupById(id);
      const items=visibleItems(id).filter(it=>match(g,it));
      return [g, items];
    }).filter(([,items])=>items.length);

    if(!cats.length){ list.innerHTML='<div class="empty"><b>No products found</b><br>Try clearing the load filter.</div>'; return; }

    list.innerHTML = cats.map(([g,items])=>`
      <details class="cat" data-cat="${esc(g.id)}"${state.catOpen[g.id]?" open":""}>
        <summary><span class="cname">${esc(g.label)}</span><span class="cnt">${items.length}</span></summary>
        <div class="plist">${items.map(it=>productCard(g,it)).join("")}</div>
      </details>`).join("");
  };

  host.addEventListener("input", e=>{
    if(e.target.matches("[data-q],[data-kg]")) render();
  });
  host.addEventListener("click", e=>{
    if(e.target.closest("[data-clear]")){
      host.querySelector("[data-q]").value=""; render();
      host.querySelector("[data-q]").focus(); return;
    }
    if(e.target.closest("[data-openall]")){
      gids.forEach(id=>state.catOpen[id]=true);
      $$(".cat",host).forEach(d=>d.open=true); saveSettings(); return;
    }
    if(e.target.closest("[data-shutall]")){
      gids.forEach(id=>state.catOpen[id]=false);
      $$(".cat",host).forEach(d=>d.open=false); saveSettings(); return;
    }
    const step=e.target.closest("[data-pd]");
    if(step){
      const card=step.closest("[data-pk]");
      changeQty(card.dataset.pk, +step.dataset.pd);
      card.classList.remove("just"); void card.offsetWidth; card.classList.add("just");
      return;
    }
  });
  host.addEventListener("change", e=>{
    const box=e.target.closest("[data-pq]");
    if(box){
      const card=box.closest("[data-pk]");
      const v=+box.value;
      if(isNaN(v)||v<0){ syncQty(); return; }
      changeQty(card.dataset.pk, 0, v);
      return;
    }
  });
  host.addEventListener("toggle", e=>{
    const d=e.target.closest(".cat");
    if(d){ state.catOpen[d.dataset.cat]=d.open; saveSettings(); }
  }, true);

  render();
  host._render = render;
}

  const paint = () => {
    $("#pGroups").innerHTML = BOOK.groups.map(g=>{
      const edits = Object.keys(state.ov[g.id]||{}).length;

      const v=el.value.trim();

      state.custom[gid]=(state.custom[gid]||[]).filter(i=>i.m!==m);
      delete (state.ov[gid]||{})[m];
      state.lines=state.lines.filter(l=>l.k!==`${gid}|${m}`);
      dirty(); paint(); renderDocket(); return;

    const hd=e.target.closest("[data-hide]");
    if(hd){

      setOv(gid,m,"x", ovOf(gid,m).x?null:1); dirty(); paint(); return;
    }

  $("#pResetAll").onclick = () => {
    if(!confirm("Reset every rate back to the filed price lists? Your edits will be lost.")) return;
    state.ov={}; state.custom={}; dirty(); paint(); refreshAll(); toast("All rates reset to the filed lists");

  $("#pSave").onclick = save;
  $("#pRev").addEventListener("input", e=>{ state.rev=e.target.value; $("#revLbl").textContent="rates "+state.rev; dirty(); });
  $("#pEff").addEventListener("input", e=>{ state.effective=e.target.value; dirty(); });
  $("#pExport").onclick = () => {
    const blob=new Blob([JSON.stringify({rev:state.rev,effective:state.effective,ov:state.ov,

      numbering:state.numbering},null,2)],{type:"application/json"});

      nothing happens until you choose it.
      <div style="margin-top:9px"><button class="btn sm" id="fyRoll">Start ${esc(now)} at 001</button></div></div>`;

      if(!confirm(`Start the ${now} sequence at 001?\n\nThe ${state.numbering.fy} numbers already issued are unaffected, but new quotations will begin again from 1.`)) return;

let dirtyFlag=false;
function dirty(){ dirtyFlag=true; showState(); }
function showState(){
  const el=$("#pState"); if(!el) return;
  const n=Object.values(state.ov).reduce((a,g)=>a+Object.keys(g).length,0);
  el.textContent = dirtyFlag ? `${n} item${n===1?"":"s"} changed — not saved yet`
    : n ? `${n} item${n===1?"":"s"} changed · saved` + (hasStore?"":" on this device only")
        : "Filed rates, unchanged";
}
/** Persist without the toast — used for small UI preferences. */
function saveSettings(){
  Store.set(KEY,{rev:state.rev,effective:state.effective,ov:state.ov,custom:state.custom,
    terms:state.terms,notes:state.notes,stock:state.stock,sync:state.sync,
    catOpen:state.catOpen,purchase:state.purchase,numbering:state.numbering,backend:state.backend,
    priceReviewed:state.priceReviewed,seeded:state.seeded,customers:state.customers,quotes:state.quotes,
    company:state.company,prefs:state.prefs});
}
async function save(){
  const persisted = await Store.set(KEY,{rev:state.rev,effective:state.effective,ov:state.ov,
    custom:state.custom, terms:state.terms, notes:state.notes,
    stock:state.stock, sync:state.sync, catOpen:state.catOpen, purchase:state.purchase,
    numbering:state.numbering, backend:state.backend, priceReviewed:state.priceReviewed,
    seeded:state.seeded, customers:state.customers, quotes:state.quotes,
    company:state.company, prefs:state.prefs});
  dirtyFlag=false; showState(); refreshAll();
  toast(persisted ? "Prices saved" : "Saved for this session — download the price book to keep it");
}
/** Live count of open purchase requirements, and prices awaiting a decision. */
function pendingPurchaseCount(){
  return state.purchase.filter(p=>!p.del && !p.received && p.status!=="Cancelled").length;
}
function paintBadges(){
  const set=(el,n)=>{ if(!el) return; el.hidden = !(n>0); el.textContent = n>99 ? "99+" : String(n); };
  set($("#pBadge"), pendingPurchaseCount());
  set($("#cBadge"), typeof conflictCount==="function" ? conflictCount() : 0);
}

function refreshAll(){
  $$("[data-list]").forEach(l=>{ const h=l.parentElement; if(h && h._render) h._render(); });
  renderDocket();
}

/* ========================= stock =========================
   Each item can carry a quantity in hand and a reorder level. It all works
   offline on one device; set a team sync address and every change is pushed
   to a shared Google Sheet and pulled back, so the team sees one figure. */

const skey = (gid,m) => gid+"|"+m;
const stockOf = (gid,m) => { const s=state.stock[skey(gid,m)]; return (s && !s.off) ? s : null; };
const pendingStock = new Set();

/** untracked | out | low | ok */
function stockState(s){
  if(!s) return "untracked";
  if(s.q<=0) return "out";
  if(s.min>0 && s.q<=s.min) return "low";
  return "ok";
}
function stockChip(gid,m){
  const s=stockOf(gid,m), st=stockState(s);
  if(st==="untracked") return "";
  if(st==="out") return ` <span class="tag r">Out of stock</span>`;
  if(st==="low") return ` <span class="tag w">Low &middot; ${s.q} left</span>`;
  return ` <span class="tag g">${s.q} in stock</span>`;
}
function setStock(gid,m,q,min){
  const k=skey(gid,m), cur=state.stock[k]||{q:0,min:0};
  state.stock[k]={
    q:   Math.max(0, q==null ? cur.q : q),
    min: Math.max(0, min==null ? (cur.min||0) : min),
    t:   Date.now(),
    by:  currentUserName()
  };
  pendingStock.add(k); queuePush();
  if(usingFirebase()) fbPushStock([k]).catch(e=>toast("Stock did not reach the team: "+friendlyAuthError(e)));
  save();
}
function clearStock(gid,m){
  const k=skey(gid,m);
  if(!state.stock[k]) return;
  state.stock[k]={q:0,min:0,off:1,t:Date.now(),by:currentUserName()};
  pendingStock.add(k); queuePush();
  if(usingFirebase()) fbPushStock([k]).catch(()=>{});
  save();
}
const ago = t => {
  if(!t) return "never";
  const s=Math.round((Date.now()-t)/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.round(s/60)+" min ago";
  if(s<86400) return Math.round(s/3600)+" h ago";
  return new Date(t).toLocaleDateString("en-IN",{day:"2-digit",month:"short"});
};

/* ---------- talking to the team sheet ---------- */
async function api(payload){
  if(!state.sync.url) throw new Error("no sync address set");
  const r = await fetch(state.sync.url, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},   // keeps this a simple request
    body: JSON.stringify(Object.assign({key:state.sync.key, by:state.sync.who}, payload))
  });
  if(!r.ok) throw new Error("sheet replied "+r.status);
  const d = await r.json();
  if(d && d.error) throw new Error(d.error);
  return d;
}
let pushTimer=null, syncing=false;
function queuePush(){
  if(state.backend!=="sheets" || !state.sync.url) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>syncStock(true), 1800);
  paintSyncBar();
}
async function syncStock(quiet){
  if(state.backend!=="sheets") return;          // Firebase handles this instead
  if(!state.sync.url || syncing) return;
  syncing=true; state.sync.err=""; paintSyncBar();
  try{
    const changes={};
    pendingStock.forEach(k=>{ if(state.stock[k]) changes[k]=state.stock[k]; });
    const res = await api({action:"stock", changes});
    let pulled=0;
    Object.entries(res.stock||{}).forEach(([k,v])=>{
      const cur=state.stock[k];
      if(!cur || (v.t||0) > (cur.t||0)){ state.stock[k]=v; pulled++; }
    });
    pendingStock.clear();
    state.sync.last=Date.now();
    await Store.set(KEY,{rev:state.rev,effective:state.effective,ov:state.ov,custom:state.custom,
      terms:state.terms,notes:state.notes,stock:state.stock,sync:state.sync,
      catOpen:state.catOpen,purchase:state.purchase,numbering:state.numbering,backend:state.backend,
      priceReviewed:state.priceReviewed,seeded:state.seeded,customers:state.customers,quotes:state.quotes,
      company:state.company,prefs:state.prefs});
    if(state.view==="stock") V.stock.repaint && V.stock.repaint();
    refreshAll();
    if(!quiet) toast(pulled ? `Stock synced — ${pulled} updated from the team` : "Stock synced");
  }catch(e){
    state.sync.err=e.message;
    if(!quiet) toast("Sync failed: "+e.message);
  }finally{
    syncing=false; paintSyncBar();
  }
}
function paintSyncBar(){
  const el=$("#syncBar"); if(!el) return;
  const s=state.sync, waiting=pendingStock.size;
  let cls, txt;
  if(usingFirebase()){
    el.className="syncbar good";
    el.querySelector("[data-txt]").textContent=`Team synced through Firebase \u00b7 signed in as ${state.auth.name}`;
    const bb=el.querySelector("[data-now]"); if(bb) bb.disabled=true;
    return;
  }
  if(!s.url){ cls="idle"; txt="Saved on this device. Sign in on the Team tab to share it."; }
  else if(syncing){ cls="busy"; txt="Syncing…"; }
  else if(s.err){ cls="bad"; txt="Last sync failed — "+s.err; }
  else { cls="good"; txt=`Synced ${ago(s.last)}${waiting?` · ${waiting} change${waiting>1?"s":""} waiting`:""}${s.who?` · signed in as ${s.who}`:""}`; }
  el.className="syncbar "+cls;
  el.querySelector("[data-txt]").textContent=txt;
  const b=el.querySelector("[data-now]"); if(b) b.disabled=!s.url||syncing;
}

/* ========================= purchase requirements =========================
   What the team needs to order. Works entirely on this device; if the stock
   sheet is configured later, the same records ride the existing sync with
   per-record timestamps, so an older offline edit cannot overwrite a newer
   team update. */

const URGENCY = {
  normal:  {label:"Needed later",     dot:"\u{1F7E2}", hint:"Required, but not now", cls:"u-normal",  rank:0},
  urgent:  {label:"Can wait 1–2 days",dot:"\u{1F7E1}", hint:"Order within a couple of days", cls:"u-urgent", rank:1},
  critical:{label:"Very urgent",      dot:"\u{1F534}", hint:"Needed immediately", cls:"u-critical", rank:2}
};
const PSTATUS = ["Needed","Ordered","Received","Cancelled"];

/** Whose name is recorded on a change. Firebase, when configured, will
    supply this instead of the typed name. */
function currentUserName(){
  if(state.auth && state.auth.name) return state.auth.name;   // never a typed name when signed in
  return state.sync.who || "unnamed";
}
const currentUserId = () => (state.auth && state.auth.uid) || null;
const newId = () => "pr_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const activeReqs   = () => state.purchase.filter(p=>!p.del && !p.received && p.status!=="Cancelled");
const receivedReqs = () => state.purchase.filter(p=>!p.del && (p.received || p.status==="Cancelled"));

function activeReqFor(name, key){
  return state.purchase.find(p => !p.del && !p.received &&
    ((key && p.key===key) || (!key && p.name.toLowerCase()===String(name||"").toLowerCase())));
}
function sortReqs(list){
  return list.slice().sort((a,b)=>{
    const ur=(URGENCY[b.urgency]?.rank||0)-(URGENCY[a.urgency]?.rank||0);
    if(ur) return ur;                               // very urgent, then 1-2 days, then later
    const sr=PSTATUS.indexOf(a.status)-PSTATUS.indexOf(b.status);
    if(sr) return sr;
    return (b.t||0)-(a.t||0);
  });
}
const stamp = t => t ? new Date(t).toLocaleString("en-IN",
  {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
function touchReq(p){
  p.updated = Date.now();
  p.upBy = p.upBy || currentUserName();
  p.by = p.by || currentUserName();
  pendingPurchase.add(p.id);
  saveSettings();
  paintBadges();
  queuePurchasePush();
  if(usingFirebase()) fbPushPurchase([p.id]).catch(e=>toast("Requirement did not reach the team: "+friendlyAuthError(e)));
}

/* ---------- sync, once the sheet is configured ---------- */
const pendingPurchase = new Set();
let pTimer=null, psyncing=false;
function queuePurchasePush(){
  if(state.backend!=="sheets" || !state.sync.url) return;   // nothing to complain about yet
  clearTimeout(pTimer);
  pTimer=setTimeout(()=>syncPurchase(true), 1800);
}
async function syncPurchase(quiet){
  if(state.backend!=="sheets") return;            // Firebase handles this instead
  if(!state.sync.url || psyncing) return;         // silent when sync is not set up
  psyncing=true; state.psync.err=""; paintPBar();
  try{
    const changes={};
    pendingPurchase.forEach(id=>{ const p=state.purchase.find(x=>x.id===id); if(p) changes[id]=p; });
    const res = await api({action:"purchase", changes});
    let pulled=0;
    Object.entries(res.purchase||{}).forEach(([id,v])=>{
      const i=state.purchase.findIndex(x=>x.id===id);
      if(i<0){ state.purchase.push(v); pulled++; }
      else if((v.updated||0) > (state.purchase[i].updated||0)){ state.purchase[i]=v; pulled++; }
    });
    state.purchase = state.purchase.filter(p=>!p.del);
    pendingPurchase.clear();
    state.psync.last=Date.now();
    saveSettings();
    if(state.view==="purchase" && V.purchase.repaint) V.purchase.repaint();
    if(!quiet) toast(pulled ? `Requirements synced — ${pulled} updated` : "Requirements synced");
  }catch(e){
    state.psync.err=e.message;
    if(!quiet) toast("Sync failed: "+e.message);
  }finally{ psyncing=false; paintPBar(); }
}
function paintPBar(){
  const el=$("#pBar"); if(!el) return;
  const on=!!state.sync.url;
  el.className="syncbar "+(psyncing?"busy":state.psync.err?"bad":on?"good":"idle");
  el.querySelector("[data-txt]").textContent =
    usingFirebase() ? `Team synced through Firebase \u00b7 signed in as ${state.auth.name}`
    : !on ? "Saved on this device. Sign in on the Team tab to share these with the team."
    : psyncing ? "Syncing…"
    : state.psync.err ? "Last sync failed — "+state.psync.err
    : `Team synced · ${ago(state.psync.last)}`;
  const b=el.querySelector("[data-pnow]"); if(b) b.hidden=!on;
}

V.purchase.wire = () => {
  let urg = "normal";

  const drawActive = () => {
    const q=($("#prQ").value||"").toLowerCase().trim();
    const fu=$("#prFU").value, fs=$("#prFS").value;
    const rows=sortReqs(activeReqs()).filter(p=>{

      if(fs && p.status!==fs) return false;

    });

      $("#prList").innerHTML = `<div class="empty">${activeReqs().length
