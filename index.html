<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMARTIE Quote Desk — Smart India Enterprises</title>
<meta name="theme-color" content="#6D28D9">
<meta name="description" content="Internal quoting and stock tool for Smart India Enterprises.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quote Desk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* SMARTIE purple & white — one place to change the whole app. */
  --purple:#6D28D9; --purple-dark:#4C1D95; --purple-light:#EDE9FE;
  --purple-line:#D8CCF5; --purple-tint:#F5F2FE;
  --ink:#1F2937; --ink2:#374151; --steel:#6B7280; --steel2:#9099A8;
  --rule:#E3DEF2; --rule2:#EFECF8;
  --paper:#F8F7FC; --panel:#FFFFFF; --panel2:#F6F4FC;
  /* legacy accent names now resolve to purple, so nothing is left orange */
  --saffron:var(--purple); --saffron-soft:var(--purple-light); --saffron-deep:var(--purple-dark);
  /* status colours keep their meaning: green available, amber low, red out */
  --verd:#15803D; --verd-soft:#E7F6EC; --verd-deep:#166534; --verd-line:#BFE2CD;
  --warn:#B45309; --warn-soft:#FEF3C7; --warn-line:#F0D9A0;
  --danger:#B91C1C; --danger-soft:#FEE2E2; --danger-line:#F3C9C4;
  --shadow:0 1px 2px rgba(31,41,55,.05),0 8px 24px -14px rgba(76,29,149,.20);
  --sans:'Inter','Roboto',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:var(--sans);
  --cond:var(--sans);
  --r:10px; --r-sm:8px;
  /* the bottom navigation bar, plus the phone's own home indicator */
  --navh:calc(56px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55; letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

/* ---------- utility type ---------- */
.eyebrow{
  font-family:var(--cond); letter-spacing:.01em;
  font-weight:700; font-size:12.5px; color:var(--steel);
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:0}

/* ---------- masthead ---------- */
header.mast{
  background:var(--panel); color:var(--ink); position:sticky; top:0; z-index:60;
  border-bottom:1px solid var(--rule); box-shadow:0 1px 0 rgba(0,0,0,.02);
}
header.mast::after{content:"";display:block;height:3px;
  background:linear-gradient(90deg,#FF9933 0 34%,#fff 34% 66%,#138808 66% 100%);
  position:absolute;left:0;right:0;bottom:-3px}
.mast-in{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--cond);font-weight:800;font-size:23px;letter-spacing:-.01em;line-height:1;color:var(--purple-dark)}
.brand span{font-family:var(--cond);font-weight:700;letter-spacing:0;font-size:13px;color:var(--purple-dark)}
.mark{width:34px;height:34px;margin-right:9px;flex:0 0 auto;display:block;object-fit:contain}

.tier{display:flex;align-items:center;gap:0;background:var(--panel2);border:1px solid var(--rule);border-radius:var(--r);padding:3px}
.tier button{
  font-family:var(--cond);letter-spacing:0;font-weight:700;font-size:13.5px;
  background:none;border:0;color:var(--steel);padding:8px 15px;cursor:pointer;border-radius:var(--r-sm);
}
.tier button[aria-pressed=true]{background:var(--purple);color:#fff}
.tier-lbl{font-family:var(--cond);font-weight:600;font-size:12.5px;color:var(--steel);margin-right:4px}
.rev{font-size:11.5px;color:var(--steel);font-weight:600;letter-spacing:.01em}
.offline{background:var(--warn);color:#fff;text-align:center;padding:6px 12px;font-size:13px;font-weight:600}
/* one small chip says whether the team is in step */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;
  border:1px solid var(--rule);background:var(--panel2);font-size:12px;font-weight:600;color:var(--ink2);
  white-space:nowrap;flex:0 0 auto}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--steel2);flex:0 0 auto}
.chip.ok{background:var(--verd-soft);border-color:var(--verd-line);color:var(--verd-deep)}
.chip.ok i{background:var(--verd)}
.chip.busy{background:var(--purple-light);border-color:var(--purple-line);color:var(--purple-dark)}
.chip.busy i{background:var(--purple);animation:pulse 1.1s ease-in-out infinite}
.chip.off{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.chip.off i{background:var(--warn)}
.chip.bad{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.chip.bad i{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media(max-width:420px){ .chip span{display:none} .chip{padding:6px} }
/* the app is doing something before the first paint */
#boot{position:fixed;inset:0;z-index:600;background:var(--paper);display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--steel)}
#boot .spin{width:30px;height:30px;border:3px solid var(--purple-light);
  border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}
#boot p{margin:0;font-size:14px;font-weight:600}
/* the update bar */
#updbar{position:fixed;left:12px;right:12px;z-index:130;display:none;align-items:center;gap:12px;
  background:var(--purple-dark);color:#fff;border-radius:var(--r);padding:12px 14px;
  box-shadow:0 10px 30px rgba(31,41,55,.28);font-size:14px;font-weight:600;
  bottom:calc(12px + 56px + env(safe-area-inset-bottom))}
#updbar.on{display:flex}
@media(max-width:1080px){ #updbar{bottom:calc(var(--navh) + 74px)} }
#updbar .sp{flex:1}
#updbar button{background:#fff;color:var(--purple-dark);border:0;border-radius:var(--r-sm);
  padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer;min-height:40px}
#updbar .later{background:none;color:#DDD6FE;padding:9px 6px}
@media(min-width:1081px){ #updbar{left:auto;right:20px;bottom:20px;max-width:420px} }
/* a modal must stay usable when the on-screen keyboard opens */
body.modal-open{overflow:hidden}
.modal{padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.modal-in{max-height:calc(100dvh - 28px);display:flex;flex-direction:column}
.modal-bd{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;min-height:0;
  padding-right:2px}
.modal-acts{margin-top:16px;flex:0 0 auto;position:sticky;bottom:0;background:var(--panel);
  padding-top:12px;border-top:1px solid var(--rule2)}
.modal-acts .btn{flex:1 1 auto}

/* ---------- tabs ---------- */
nav.tabs{background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:56px;z-index:55}
.tabs-in{max-width:1440px;margin:0 auto;padding:0 20px;display:flex;align-items:stretch;gap:0;min-width:0}
.tabgroup{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;flex:1 1 auto;min-width:0}
.tabback{
  flex:0 0 auto;background:none;border:0;border-right:1px solid var(--rule);cursor:pointer;
  display:flex;align-items:center;gap:6px;padding:0 15px 3px 0;margin-right:13px;
  font-family:var(--cond);font-weight:700;font-size:14.5px;color:var(--purple);
}
.tabback:hover{color:var(--purple-dark)}
.tabback span{font-size:17px;line-height:1}
@media(max-width:560px){.tabback{padding-right:11px;margin-right:9px}}
.tabs button{
  background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;
  font-family:var(--cond);letter-spacing:-.005em;font-weight:700;font-size:14.5px;
  color:var(--steel);padding:14px 13px 11px;
}
.tabsep{align-self:center;width:1px;height:18px;background:var(--rule);margin:0 9px;flex:0 0 auto}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--purple)}

/* ---------- layout ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
@media(max-width:1080px){.wrap{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.wrap>*{min-width:0}
.card-hd{padding:16px 20px 14px;border-bottom:1px solid var(--rule2);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.card-hd h2{font-family:var(--cond);font-weight:800;font-size:23px;letter-spacing:-.02em;margin:0;line-height:1.15}
.card-hd p{margin:0;color:var(--steel);font-size:13.5px;flex:1 1 260px}
.card-bd{padding:18px 20px}

/* ---------- forms ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.g2,.g3,.g4{grid-template-columns:1fr}}
label.f{display:block}
label.f>span{display:block;font-family:var(--cond);letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--steel);margin-bottom:5px}
/* :where() keeps this at element specificity, so .stepper input, .qin and the
   other component sizes below still win. */
input:where(:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit])),
select,textarea{
  width:100%;padding:10px 11px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  color:var(--ink);transition:border-color .15s,box-shadow .15s;font-size:15px;
}
input:disabled,select:disabled,textarea:disabled{background:var(--panel2);color:var(--ink2);cursor:not-allowed}
textarea{min-height:64px;line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(109,40,217,.12)}
input::placeholder,textarea::placeholder{color:var(--steel2)}
input[type=number]{font-variant-numeric:tabular-nums}
select{cursor:pointer}
.hint{font-size:12.5px;color:var(--steel);margin:6px 0 0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;padding-top:22px}
.chk input{width:16px;height:16px;accent-color:var(--purple)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--cond);letter-spacing:-.005em;font-weight:600;font-size:14px;
  background:var(--purple-dark);color:#fff;border:1px solid var(--purple-dark);border-radius:var(--r);
  padding:10px 17px;min-height:42px;transition:background .15s,border-color .15s;
}
.btn:hover{background:#3B1580;border-color:#3B1580}
.btn.pri{background:var(--purple);border-color:var(--purple)}
.btn.pri:hover{background:var(--purple-dark);border-color:var(--purple-dark)}
.btn.gh{background:none;color:var(--ink2);border-color:var(--rule)}
.btn.gh:hover{background:var(--purple-light);color:var(--purple-dark);border-color:var(--purple-line)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- result strip ---------- */
.calcout{margin-top:18px;border-top:1px dashed var(--rule);padding-top:16px}
.rows-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rows{width:100%;border-collapse:collapse}
.rows td:first-child{overflow-wrap:anywhere}
.rows th{
  text-align:left;font-family:var(--cond);letter-spacing:0;font-size:12.5px;
  color:var(--steel);font-weight:600;padding:0 8px 7px;border-bottom:1px solid var(--rule);
}
.rows td{padding:8px;border-bottom:1px solid var(--rule2);vertical-align:top;font-size:14px}
.rows td.n,.rows th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows tr:last-child td{border-bottom:0}
.rows .sub{display:block;color:var(--steel);font-size:12.5px;margin-top:2px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 8px 0;border-top:2px solid var(--purple);margin-top:6px}
.tot .lbl{font-family:var(--cond);letter-spacing:-.005em;font-weight:700;font-size:15px}
.tot .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- computed spec strip ---------- */
.spec{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.spec span{
  font-size:12.5px;background:var(--panel2);border:1px solid var(--rule2);
  border-radius:var(--r);padding:5px 10px;color:var(--ink2);font-variant-numeric:tabular-nums;
}
.spec span b{color:var(--steel);font-weight:400}

/* narrow screens: line items stack instead of squeezing into four columns */
@media(max-width:700px){
  .rows thead{display:none}
  .rows,.rows tbody,.rows tr,.rows td{display:block;width:100%}
  .rows tr{padding:13px 0;border-bottom:1px solid var(--rule2)}
  .rows tr:last-child{border-bottom:0}
  .rows td{border:0;padding:0}
  .rows td:first-child{font-weight:600;font-size:14.5px;line-height:1.4}
  .rows td:first-child .sub{font-weight:400}
  .rows td.n{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:4px 0 0;text-align:right}
  .rows td.n::before{
    content:attr(data-l);font-family:var(--sans);font-size:13px;font-weight:500;color:var(--steel);
    letter-spacing:0;flex:0 0 auto;
  }
  .rows td.n:nth-of-type(4){margin-top:3px;font-size:15.5px;font-weight:600}
  .tot .val{font-size:20px}
  .spec{gap:6px}
  .spec span{font-size:12px;padding:5px 9px}
}
@media(max-width:560px){
  .pitem{grid-template-columns:minmax(0,1fr) auto;row-gap:9px}
  .pitem>div:last-child{grid-column:1/-1;justify-content:flex-end}
}

/* ---------- badges & notes ---------- */
.tag{display:inline-block;font-family:var(--cond);letter-spacing:0;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--steel);border:1px solid var(--rule)}
.tag.o{background:var(--purple-light);color:var(--purple-dark);border-color:var(--purple-line)}
.tag.g{background:var(--verd-soft);color:var(--verd-deep);border-color:var(--verd-line)}
.tag.w{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.note{background:var(--purple-light);border-left:3px solid var(--purple);padding:11px 14px;border-radius:0 var(--r) var(--r) 0;font-size:13.5px;color:#3B2E63;margin:0 0 16px}
.note b{color:var(--purple-dark)}
.note ul{margin:6px 0 0;padding-left:18px}
.note li{margin:3px 0}

/* ---------- browse list ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters label.f{flex:1 1 160px;min-width:140px}
.plist{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--rule2)}
.pitem:last-child{border-bottom:0}
.pitem:nth-child(even){background:var(--panel2)}
.pitem .nm{font-size:14px;line-height:1.35}
.pitem .nm b{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.pitem .nm span{display:block;color:var(--ink2);font-size:12.5px;line-height:1.4}
.pitem .pr{font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:700;text-align:right;white-space:nowrap;color:var(--ink)}
.pitem .pr small{display:block;font-size:11px;color:var(--steel);font-weight:500}
.empty{padding:34px 18px;text-align:center;color:var(--steel);font-size:14px;line-height:1.6}
.empty b{color:var(--ink);font-size:15px}

/* ---------- search ---------- */
.searchbar{position:relative;margin-bottom:14px}
.searchbar input{
  width:100%;padding:14px 44px 14px 16px;font-size:16px;background:var(--panel);
  border:2px solid var(--rule);border-radius:var(--r);
}
.searchbar input:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px rgba(109,40,217,.12)}
.searchbar input::-webkit-search-cancel-button{display:none}
.clearq{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;
  border:0;background:var(--panel2);border-radius:50%;cursor:pointer;font-size:19px;line-height:1;color:var(--steel)}
.clearq:hover{background:var(--purple-light);color:var(--purple-dark)}
.filters.slim{gap:10px;margin-bottom:14px;align-items:flex-end}
.filters.slim .fgrow{flex:1 1 auto}
.reshead{margin:0 0 10px;font-size:13.5px;color:var(--steel);font-weight:600}
.cat-of{display:block;font-size:11.5px;color:var(--purple-dark);font-weight:600;margin-bottom:1px}

/* ---------- category accordion ---------- */
.cat{border:1px solid var(--rule);border-radius:var(--r);margin-bottom:10px;background:var(--panel);overflow:hidden}
.cat>summary{
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;
  padding:15px 16px;font-family:var(--cond);font-weight:700;font-size:15.5px;
}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary::before{
  content:"";width:9px;height:9px;flex:0 0 auto;border-right:2.4px solid var(--purple);
  border-bottom:2.4px solid var(--purple);transform:rotate(45deg);margin-top:-4px;transition:transform .18s
}
.cat[open]>summary::before{transform:rotate(225deg);margin-top:2px}
.cat[open]>summary{border-bottom:1px solid var(--rule2);background:var(--panel2)}
.cat .cname{flex:1 1 auto;min-width:0}
.cat .cnt{flex:0 0 auto;background:var(--purple-light);color:var(--purple-dark);
  font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.cat .plist{border:0;border-radius:0}

/* ---------- product card with a live stepper ---------- */
.pitem{grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}
.pact{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.padd{white-space:nowrap;min-width:66px;padding:8px 12px}
.pitem.inquote .padd{background:var(--purple-dark);border-color:var(--purple-dark)}
.pitem.inquote .padd:hover{background:#3B1580;border-color:#3B1580}
.pitem.inquote{background:var(--purple-tint)!important;box-shadow:inset 3px 0 0 var(--purple)}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--rule);border-radius:var(--r);
  overflow:hidden;background:var(--panel);flex:0 0 auto}
.stepper button{
  width:40px;min-height:42px;border:0;background:var(--panel2);cursor:pointer;
  font-size:19px;line-height:1;color:var(--ink);font-weight:600;
}
.stepper button:hover:not(:disabled){background:var(--purple);color:#fff}
.stepper button:disabled{color:var(--steel2);cursor:not-allowed}
.stepper input{
  width:54px;text-align:center;border:0;border-left:1px solid var(--rule);border-right:1px solid var(--rule);
  font-weight:700;font-size:15px;background:var(--panel);padding:0;font-variant-numeric:tabular-nums;
  border-radius:0;
}
.stepper input:focus{box-shadow:none;border-color:var(--purple)}
@media(max-width:560px){
  .pitem{grid-template-columns:minmax(0,1fr) auto;row-gap:9px;padding:11px 12px}
  .pitem .nm{grid-column:1/-1}
  .pitem .pr{grid-column:1;text-align:left;align-self:center}
  .pitem .pact{grid-column:2;justify-content:flex-end}
  .pitem .stepper button{width:38px;min-height:40px}
  .pitem .stepper input{width:44px}
  .padd{min-width:58px;padding:8px 10px;font-size:12.5px}
}

/* ---------- quotation line editing ---------- */
.ln-top{display:flex;gap:10px;align-items:flex-start}
.ln-top .t{flex:1 1 auto;min-width:0}
.ln-tools{flex:0 0 auto;display:flex;gap:7px;align-items:flex-start}
.penc.danger:hover{border-color:var(--danger);background:var(--danger-soft)}
.penc.danger:hover svg{stroke:var(--danger)}
.ln.needrate{box-shadow:inset 3px 0 0 var(--warn);background:var(--warn-soft)}
.ln.needrate .rv{color:var(--warn);font-weight:700}

/* ---------- purchase requirements ---------- */
.addbox{border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;background:var(--panel2)}
.addbox>summary{cursor:pointer;list-style:none;font-family:var(--cond);font-weight:700;font-size:15.5px;color:var(--purple-dark)}

#prList{margin-top:14px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--rule2)}
.prow:last-child{border-bottom:0}
.prow.u-critical{box-shadow:inset 4px 0 0 var(--danger)}
.prow.u-urgent{box-shadow:inset 4px 0 0 var(--warn)}
.prow.u-normal{box-shadow:inset 4px 0 0 var(--verd)}

.prow.st-cancelled{box-shadow:inset 4px 0 0 var(--steel2)}
.prow .nm{font-size:14px;line-height:1.4;min-width:0}

.prow .nm span{display:block;color:var(--steel);font-size:12.5px;margin-top:2px}
.prow .nm .meta{font-size:11.5px;color:var(--steel2)}
.prow .nm .tag{display:inline-block;margin-left:5px}
.practs{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.practs select{padding:7px 9px;font-size:13px;width:auto}
.urgpick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
@media(max-width:560px){.urgpick{grid-template-columns:1fr}}
.urgbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left;
  border:2px solid var(--rule);background:var(--panel);border-radius:var(--r);padding:12px 13px;min-height:64px}
.urgbtn .dot{font-size:15px;line-height:1}
.urgbtn .ul{font-weight:700;font-size:14px}
.urgbtn .uh{font-size:11.5px;color:var(--steel);line-height:1.35}
.urgbtn.on.u-critical{border-color:var(--danger);background:var(--danger-soft)}
.urgbtn.on.u-urgent{border-color:var(--warn);background:var(--warn-soft)}
.urgbtn.on.u-normal{border-color:var(--verd);background:var(--verd-soft)}
.prow .qtyline{font-size:13px;color:var(--ink2)}
.prow .qtyline b{color:var(--ink)}
.prow .short{color:var(--danger);font-weight:700}
.histbox{margin-top:22px;border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;background:var(--panel2)}
.histbox>summary{cursor:pointer;list-style:none;font-family:var(--cond);font-weight:700;font-size:15.5px;
  display:flex;align-items:center;gap:10px}
.histbox>summary::-webkit-details-marker{display:none}
.histbox>summary .cnt{background:var(--panel);border:1px solid var(--rule);color:var(--ink2);
  font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px}
.aboutmark{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--rule2)}
.aboutmark img{max-width:190px;height:auto}
.aboutmark b{display:block;font-family:var(--cond);font-size:19px;font-weight:800}
.aboutmark span{display:block;color:var(--steel);font-size:13.5px;margin-top:2px}
.aboutmark a{color:var(--purple-dark)}
.legal{border-bottom:1px solid var(--rule2);padding:4px 0}
.legal>summary{cursor:pointer;list-style:none;padding:13px 0;font-family:var(--cond);font-weight:700;font-size:15.5px;
  display:flex;align-items:center;gap:10px}
.legal>summary::-webkit-details-marker{display:none}
.legal>summary::before{content:"";width:8px;height:8px;border-right:2.2px solid var(--purple);
  border-bottom:2.2px solid var(--purple);transform:rotate(45deg);margin-top:-3px;flex:0 0 auto}
.legal[open]>summary::before{transform:rotate(225deg);margin-top:2px}
.legal p,.legal li{font-size:13.5px;line-height:1.6;color:var(--ink2);margin:0 0 10px}
.legal ul{padding-left:19px;margin:0 0 10px}
/* ---------- sign in & team ---------- */
.signin{max-width:460px;margin:0 auto}
.note.bad{background:var(--danger-soft);border-left-color:var(--danger);color:#7A241A}

  border-radius:var(--r);background:var(--panel2);flex-wrap:wrap}

  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:0 0 auto}
.whobox b{display:block;font-size:15.5px}
.whobox span{display:block;color:var(--steel);font-size:13px;margin-top:2px}
.whobox>div{flex:1 1 160px;min-width:0}
.whobox .tag{margin-right:5px}
h3.sect{font-family:var(--cond);font-size:19px;font-weight:800;letter-spacing:-.01em;margin:26px 0 10px}

  border-radius:var(--r);cursor:pointer;background:var(--panel)}

.bopt input{margin-top:3px;width:18px;height:18px;accent-color:var(--purple);flex:0 0 auto}
.bopt span{font-size:13px;color:var(--steel);line-height:1.45}
.bopt b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}

.tabs button{position:relative}

.dk-tier{display:flex;align-items:center;gap:6px;padding:11px 16px 0;flex-wrap:wrap}

.dk-tier button{flex:1 1 auto;border:1.5px solid var(--rule);background:var(--panel);border-radius:var(--r-sm);

/* ---------- products ---------- */
.prodbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

.prodrow{display:grid;grid-template-columns:minmax(0,1.4fr) auto auto;gap:14px;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--rule2)}
.prodrow:last-child{border-bottom:0}
.prodrow.archived{opacity:.55}
.prodrow .nm{min-width:0;font-size:14px;line-height:1.4}
.prodrow .nm b{font-size:14.5px;font-weight:700}
.prodrow .nm span{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.prodrow .nm .spec2{color:var(--ink2);font-size:12px}
.prodrow .nm .meta{font-size:11.5px;color:var(--steel2)}
.prices{display:flex;gap:14px;flex-wrap:wrap}
.pcell{text-align:right;min-width:82px}
.pcell span{display:block;font-size:11px;color:var(--steel);font-weight:600}
.pcell b{font-size:13.5px;font-variant-numeric:tabular-nums}
.pcell.unset b{color:var(--warn);font-size:12.5px;font-weight:600}
.pr.unset{color:var(--warn);font-size:13px;font-weight:600}
.confbox{border:1px solid var(--purple-line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;background:var(--purple-light)}
.confbox h4{margin:0 0 10px;font-family:var(--cond);font-size:16px}
.confrow{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;
  padding:10px 0;border-top:1px solid var(--purple-line)}
.confrow b{font-size:13.5px;font-weight:700}
.confrow span{display:block;font-size:12.5px;color:var(--ink2)}
.confrow .meta{font-size:11.5px;color:var(--steel)}
.confpick{display:flex;gap:7px;flex-wrap:wrap}
@media(max-width:720px){
  .prodrow{grid-template-columns:1fr;row-gap:11px}

}

.viewmeta{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;border:1px solid var(--rule);
  border-radius:var(--r);padding:10px 12px;margin-bottom:14px;background:var(--panel2)}
.viewmeta div{display:flex;gap:8px;font-size:12.5px;min-width:0}

.viewmeta span{min-width:0;overflow-wrap:anywhere}
@media(max-width:560px){ .viewmeta{grid-template-columns:1fr} }

/* ---------- modal form ---------- */
.modal{position:fixed;inset:0;z-index:500;background:rgba(31,41,55,.55);display:flex;
  align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;overscroll-behavior:contain}
.modal-in{background:var(--panel);border-radius:var(--r);padding:20px;width:100%;max-width:560px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);margin:auto}
.modal-in h3{margin:0 0 16px;font-family:var(--cond);font-size:21px;font-weight:800}
.modal-acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.partybar{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;padding-top:2px}
#qPickPanel{grid-column:1/-1;border:1px solid var(--rule);border-radius:var(--r);padding:10px;background:var(--panel2)}
#qPickPanel input{width:100%;padding:9px 10px;font-size:14px;margin-bottom:8px}
#qPickList{max-height:200px;overflow-y:auto;overscroll-behavior:contain}
.pickrow{display:block;width:100%;text-align:left;border:0;background:var(--panel);cursor:pointer;
  padding:9px 11px;border-radius:var(--r-sm);margin-bottom:5px}
.pickrow:hover{background:var(--purple-light)}
.pickrow b{display:block;font-size:13.5px}
.pickrow span{display:block;font-size:12px;color:var(--steel);margin-top:1px}
.imgpick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.imgpick{grid-template-columns:1fr}}
.imgpick>div{border:1px solid var(--rule);border-radius:var(--r);padding:13px;background:var(--panel2)}
.imgpick>div>span{display:block;font-size:12px;font-weight:600;color:var(--steel);margin-bottom:8px}
.imgpick img{max-width:100%;max-height:92px;display:block;margin-bottom:10px;background:#fff}
.imgpick input[type=file]{font-size:12px;margin-bottom:8px;width:100%}
/* ================= navigation ================= */
.navbar{display:none}
.drawer{display:none}
#drawerScrim{position:fixed;inset:0;background:rgba(31,41,55,.48);z-index:118;opacity:0;
  pointer-events:none;transition:opacity .2s}
#drawerScrim.on{opacity:1;pointer-events:auto}
.totop{
  position:fixed;right:16px;z-index:85;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--rule);background:var(--panel);box-shadow:0 4px 16px rgba(26,31,36,.16);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;
  bottom:calc(96px + env(safe-area-inset-bottom));
}
.totop.on{opacity:1;pointer-events:auto;transform:translateY(0)}
.totop svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crumb{display:flex;align-items:center;gap:8px;padding:13px 0 11px;min-width:0}
.crumb-up{background:none;border:0;padding:0;cursor:pointer;color:var(--purple-dark);
  font-family:var(--cond);font-weight:700;font-size:14.5px}
.crumb-sep{color:var(--steel2)}
.crumb-here{font-family:var(--cond);font-weight:700;font-size:15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.navbtn,.drawitem{font-family:var(--cond);font-weight:700;cursor:pointer;background:none;border:0}
.navbtn svg,.drawitem svg{fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* the drawer, on every size */
.drawer{
  position:fixed;z-index:120;background:var(--panel);display:block;
  box-shadow:-8px 0 32px rgba(26,31,36,.18);
  top:0;right:0;height:100dvh;width:min(310px,86vw);
  transform:translateX(102%);transition:transform .24s ease;
  overflow-y:auto;overscroll-behavior:contain;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
.drawer.open{transform:translateX(0)}
.drawer-hd{display:flex;align-items:center;justify-content:space-between;
  padding:18px 18px 12px;border-bottom:1px solid var(--rule2)}

  cursor:pointer;width:44px;height:44px;border-radius:50%}

  padding:15px 18px;font-size:15px;color:var(--ink);min-height:52px;position:relative}

.drawitem:hover{background:var(--purple-tint)}
.drawitem[aria-current=page]{background:var(--purple-light);color:var(--purple-dark)}
.drawitem[aria-current=page] svg{color:var(--purple-dark)}
.drawitem .badge{margin-left:auto}
body.drawer-open{overflow:hidden}

@media(max-width:1080px){
  .navbar{
    display:grid;grid-template-columns:repeat(5,1fr);
    position:fixed;left:0;right:0;bottom:0;z-index:100;
    background:var(--panel);border-top:1px solid var(--rule);
    box-shadow:0 -2px 14px rgba(26,31,36,.07);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;

.stat{border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;background:var(--purple-tint);
  display:flex;flex-direction:column;justify-content:space-between;min-height:76px}
.stat span{display:block;font-size:12px;font-weight:600;color:var(--steel);line-height:1.3}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--purple-dark);margin-top:6px}
.stat.low{background:var(--warn-soft);border-color:var(--warn-line)}
.stat.low b{color:var(--warn)}
.stat.out{background:var(--danger-soft);border-color:var(--danger-line)}
.stat.out b{color:var(--danger)}
.statbtn{width:100%;font-family:inherit;text-align:left;cursor:pointer;color:inherit}
.statbtn:hover,.statbtn:focus-visible{transform:translateY(-1px);box-shadow:0 5px 14px rgba(31,41,55,.10)}
.statbtn.active{outline:2px solid currentColor;outline-offset:2px}
.stock-alert-list{margin:-3px 0 16px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--panel);padding:9px 12px}
.stock-alert-list[hidden]{display:none}
.stock-alert-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.stock-alert-close{border:0;background:none;color:var(--steel);font-size:18px;line-height:1;cursor:pointer;padding:2px 5px}
.stock-alert-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--rule2);
  font-size:11.5px;line-height:1.35;color:var(--ink2)}
.stock-alert-row b{font-size:12px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stock-alert-row span{margin-left:auto;white-space:nowrap;font-weight:700;color:var(--ink)}
@media(max-width:560px){
  .statrow{gap:8px}
  .stat{padding:10px 11px}
  .stat span{font-size:11px}
  .stat b{font-size:21px}
}
.picklist{max-height:46vh;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--rule);
  border-radius:var(--r);padding:8px;background:var(--panel2)}
.mvrow{padding:12px 14px;border-bottom:1px solid var(--rule2)}
.mvrow:last-child{border-bottom:0}
.mvrow .nm b{font-size:14px}
.mvrow .qtyline{display:block;font-size:13px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}
.mvrow .nm span{display:block;color:var(--ink2);font-size:12.5px}
.mvrow .meta{font-size:11.5px;color:var(--steel)}
.mvd{font-weight:700}
.mvd.g{color:var(--verd-deep)}
.mvd.r{color:var(--danger)}
.movelist{border:1px solid var(--rule);border-radius:var(--r);margin-top:8px;background:var(--panel2)}
.tag.r{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.syncbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:var(--r);
  border:1px solid var(--rule);background:var(--panel2);font-size:13.5px;margin-bottom:18px}
.syncbar span{flex:1 1 220px;min-width:0}
.syncbar.good{background:var(--verd-soft);border-color:var(--verd-line);color:var(--verd-deep)}
.syncbar.bad{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.syncbar.busy{background:var(--purple-light);border-color:var(--purple-line);color:var(--purple-dark)}
.strow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;
  padding:12px 14px;border-bottom:1px solid var(--rule2)}
.strow:last-child{border-bottom:0}
.strow:nth-child(even){background:var(--panel2)}
.strow.out{box-shadow:inset 3px 0 0 var(--danger)}
.strow.low{box-shadow:inset 3px 0 0 var(--warn)}
.strow .nm{font-size:14px;line-height:1.35;min-width:0}
.strow .nm b{font-size:14.5px;font-weight:700}
.strow .nm span{display:block;color:var(--ink2);font-size:12.5px}
.strow .nm .meta{font-size:11.5px;color:var(--steel2)}
.strow .qty{display:flex;align-items:center;gap:5px}
.stock-section{margin-top:22px}
.stock-section-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 10px}
.stock-section-h h3{margin:0;font-size:18px;letter-spacing:-.01em}
.stock-section-h span{font-size:12px;color:var(--steel);font-weight:600}
.stock-grid{display:grid;gap:10px}
.stock-card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 18px;
  align-items:center;border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);padding:15px 52px 14px 16px;
  box-shadow:0 2px 8px rgba(31,41,55,.04);transition:box-shadow .16s,border-color .16s,transform .16s}
.stock-card:hover{border-color:var(--purple-line);box-shadow:0 6px 18px rgba(76,29,149,.08)}
.stock-card.pinned{border-color:var(--purple-line);background:linear-gradient(135deg,var(--panel),var(--purple-tint))}
.stock-card.low{box-shadow:inset 3px 0 0 var(--warn)}
.stock-card.out{box-shadow:inset 3px 0 0 var(--danger)}
.stock-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.stock-title>b{font-size:16px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
.stock-name{font-size:13.5px;color:var(--ink2);margin-top:3px}
.stock-meta{font-size:11.5px;color:var(--steel);margin-top:5px}
.stock-available{text-align:right;min-width:82px;font-variant-numeric:tabular-nums}
.stock-available strong{display:block;font-size:28px;line-height:1;color:var(--ink);font-weight:900;letter-spacing:-.03em}
.stock-available span{display:block;margin-top:4px;color:var(--ink2);font-size:12px;font-weight:700}
.stock-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pinbtn{position:absolute;right:12px;top:11px;border:0;background:transparent;color:var(--steel);font-size:26px;
  cursor:pointer;width:36px;height:36px;border-radius:50%;line-height:1}
.pinbtn:hover,.pinbtn.on{color:var(--purple);background:var(--purple-light)}
.iconbtn{min-width:44px;padding-left:10px!important;padding-right:10px!important}
.stock-add-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice-card{border:1px solid var(--rule);background:var(--panel);border-radius:var(--r);padding:18px;text-align:left;cursor:pointer;min-height:112px}
.choice-card:hover{border-color:var(--purple);background:var(--purple-tint)}
.choice-card b,.choice-card span{display:block}.choice-card b{font-size:16px;color:var(--ink)}
.choice-card span{font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.45}
.inline-create{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;margin-top:11px;
  padding:11px;border:1px dashed var(--purple-line);border-radius:var(--r);background:var(--purple-tint)}
.stepb{width:32px;height:32px;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r-sm);
  cursor:pointer;font-size:17px;line-height:1;color:var(--ink2)}
.stepb:hover{border-color:var(--purple);color:var(--purple)}
.qin{width:64px;text-align:center;padding:6px 4px;font-weight:700;font-variant-numeric:tabular-nums}
.minf input,.qin{flex:0 0 auto}
.minf{display:flex;flex-direction:column;gap:3px}
.minf span{font-size:11px;color:var(--steel);white-space:nowrap}
.minf input{width:70px;text-align:center;padding:5px 4px;font-size:12.5px;font-variant-numeric:tabular-nums}
@media(max-width:620px){
  .strow{grid-template-columns:1fr auto;row-gap:10px}
  .strow .nm{grid-column:1/-1}
  .minf{flex-direction:row;align-items:center;gap:7px}
  .stock-card{grid-template-columns:minmax(0,1fr) auto;padding:14px 48px 13px 14px}
  .stock-available strong{font-size:25px}
  .stock-actions .btn{flex:1 1 92px;min-height:44px}
  .stock-add-choices,.inline-create{grid-template-columns:1fr}
}

/* ---------- docket (signature) ---------- */
.docket{position:sticky;top:104px}
@media(max-width:1080px){.docket{position:static;transform:none;max-height:none;padding:0}}
.dk{background:var(--panel);border:1px solid var(--rule);box-shadow:var(--shadow);position:relative;border-radius:0 0 var(--r) var(--r)}
.dk::before{
  content:"";position:absolute;left:-1px;right:-1px;top:-9px;height:9px;
  background:
    radial-gradient(circle at 6px 9px, transparent 5.5px, var(--rule) 5.5px, var(--rule) 6.3px, var(--panel) 6.4px) repeat-x;
  background-size:12px 9px;
}
.dk-back{
  display:none;width:100%;background:none;border:0;cursor:pointer;text-align:left;min-height:44px;
  padding:2px 16px 10px;font-family:var(--cond);font-weight:700;font-size:14px;color:var(--purple);
}
@media(max-width:1080px){.dk-back{display:block}}
.dk-hd{padding:14px 16px 12px;border-bottom:2px solid var(--purple)}
.dk-hd h3{margin:0;font-family:var(--cond);font-weight:800;font-size:20px;letter-spacing:-.015em}
.dk-hd .meta{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.dk-meta{padding:12px 16px;border-bottom:1px dashed var(--rule);display:grid;gap:9px;grid-template-columns:1fr 1fr}
.dk-meta input{padding:6px 8px;font-size:13px}
.dk-meta label.f>span{font-size:10.5px;margin-bottom:3px}
.dk-lines{max-height:min(46vh,460px);overflow-y:auto;overscroll-behavior:contain;padding:4px 0}
@media(max-width:1080px){.dk-lines{max-height:none;overflow:visible}}
/* one quotation line, stacked so nothing can collide on a narrow screen */
.ln{display:block;padding:14px 16px;border-bottom:1px solid var(--rule2)}
.ln:last-child{border-bottom:0}
.ln .t{font-size:14px;line-height:1.4;min-width:0;overflow-wrap:anywhere;word-break:normal;hyphens:none}
.ln .t b{font-weight:700;display:block}
.ln .t span{display:block;color:var(--steel);font-size:12.5px;margin-top:3px;line-height:1.45;overflow-wrap:anywhere}
.dk-add{padding:10px 16px 12px;border-top:1px dashed var(--rule)}
.lnk{background:none;border:0;padding:4px 0;cursor:pointer;font-family:var(--cond);
  letter-spacing:0;font-weight:700;font-size:13.5px;color:var(--purple);min-height:32px}
.lnk:hover{color:var(--purple-dark)}
#cfForm{display:grid;gap:7px;margin-top:9px}
#cfForm input{padding:7px 9px;font-size:13px}
#cfForm .cfrow{display:grid;grid-template-columns:1fr auto;gap:7px}
.dk-foot{padding:14px 16px 16px;border-top:2px solid var(--purple);background:var(--purple-tint)}
.frow{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;padding:3px 0}
.frow .num{font-weight:500}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.grand .lbl{font-family:var(--cond);letter-spacing:-.01em;font-weight:700;font-size:16px}
.grand .val{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dk-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dk-acts .btn{width:100%}
.dk-acts .wide{grid-column:1/-1}
.tport{padding:0 0 12px;margin-bottom:11px;border-bottom:1px dashed var(--rule);display:grid;gap:8px}
.tport .tprow{display:grid;grid-template-columns:118px 1fr;gap:7px}
.tport input{padding:7px 9px;font-size:13px}
.tport.off .tprow{opacity:.5}
.tpk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer}
.tpk input{width:16px;height:16px;accent-color:var(--purple);cursor:pointer}
.gstline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--steel);margin-top:8px}
.gstline input{width:15px;height:15px;accent-color:var(--purple)}

/* ---------- prices editor ---------- */
.pgroup{border:1px solid var(--rule);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.pgroup>summary{
  cursor:pointer;padding:13px 15px;background:var(--panel2);display:flex;align-items:center;gap:12px;
  font-family:var(--cond);letter-spacing:-.01em;font-weight:700;font-size:15.5px;list-style:none;
}
.pgroup>summary::-webkit-details-marker{display:none}
.pgroup>summary::before{content:"+";color:var(--purple);font-weight:800}
.pgroup[open]>summary::before{content:"–"}
.pgroup>summary .count{margin-left:auto;font-size:11.5px;color:var(--steel);letter-spacing:0;font-weight:500}
.ptbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ptbl{width:100%;min-width:700px;border-collapse:collapse;font-size:13.5px}
.ptbl th{text-align:left;font-family:var(--cond);letter-spacing:0;font-size:12px;color:var(--steel);font-weight:600;padding:9px 10px;background:var(--panel);border-bottom:1px solid var(--rule)}
.ptbl th.n{text-align:right}
.ptbl td{padding:6px 10px;border-bottom:1px solid var(--rule2);vertical-align:middle}
.ptbl tr:last-child td{border-bottom:0}
.ptbl .mdl{font-size:13px;font-weight:700}
.ptbl .dsc{color:var(--ink2);font-size:12.5px;display:block;max-width:46ch}
.ptbl .nmin{width:100%;max-width:420px;text-align:left;font-size:12.5px;color:var(--ink2);
  background:transparent;border:1px solid transparent;padding:3px 5px}
.ptbl .nmin:hover,.ptbl .nmin:focus{background:var(--panel);border-color:var(--rule)}
.ptbl .mdin{width:100%;max-width:210px;text-align:left;font-size:12.5px;font-weight:700;color:var(--ink);
  background:transparent;border:1px solid transparent;padding:3px 5px}
.ptbl .mdin:hover,.ptbl .mdin:focus{background:var(--panel);border-color:var(--rule)}
.ptbl .uin{width:86px;text-align:left;font-size:12px;font-family:var(--cond);letter-spacing:0}
.ptbl tr.gone{opacity:.45}
.rowacts{display:flex;gap:6px;align-items:center;margin-top:4px}
.rowacts button{background:none;border:0;padding:0;cursor:pointer;font-family:var(--cond);
  letter-spacing:0;font-size:12px;font-weight:600;color:var(--steel)}
.rowacts button:hover{color:var(--purple)}
.addrow{padding:10px 12px;background:var(--panel2);border-top:1px solid var(--rule)}

@media(max-width:760px){
  .ptbl-wrap{overflow-x:visible}
  .ptbl{min-width:0}
  .ptbl thead{display:none}
  .ptbl,.ptbl tbody,.ptbl tr,.ptbl td{display:block;width:100%}
  .ptbl tr{border-bottom:1px solid var(--rule);padding:12px 12px 14px}
  .ptbl tr:last-child{border-bottom:0}
  .ptbl td{border:0;padding:4px 0}
  .ptbl td.pc{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .ptbl td.pc::before{content:attr(data-l);font-family:var(--cond);letter-spacing:0;
    font-size:12.5px;font-weight:600;color:var(--steel)}
  .ptbl input[type=number]{width:132px}
  .ptbl .nmin,.ptbl .mdin{max-width:none}
  .ptbl .was{display:inline;margin-left:8px}
}
.ptbl input{width:104px;text-align:right;padding:5px 7px;font-size:13px;background:var(--panel);border:1px solid var(--rule2);font-variant-numeric:tabular-nums}
.ptbl input:hover{border-color:var(--purple-line)}
.ptbl input.edited{border-color:var(--purple);background:var(--purple-light);font-weight:700}
.ptbl input.derived{color:var(--steel2)}
.ptbl td.pc{text-align:right;white-space:nowrap}
.was{display:block;font-size:10.5px;color:var(--purple-dark);margin-top:2px}
.pbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--panel2);border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:18px}
.pbar label.f{flex:0 0 auto}
.pbar input[type=number],.pbar select{width:130px}
.pbar .sp{flex:1 1 auto}
.saveState{font-size:12.5px;color:var(--steel)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:650;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:14px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}


/* ---------- add feedback ---------- */
.btn.ok{background:var(--verd)!important;border-color:var(--verd)!important;color:#fff!important}
.pitem.just{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:var(--purple-light)}100%{background:transparent}}
.inq{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;
  color:var(--verd-deep);background:var(--verd-soft);border:1px solid var(--verd-line);border-radius:var(--r-sm);padding:1px 6px;white-space:nowrap}
.dk.bump{animation:bump .55s ease-out}
@keyframes bump{0%{box-shadow:0 0 0 0 rgba(109,40,217,.35)}100%{box-shadow:0 0 0 16px rgba(109,40,217,0)}}
#toast button{background:none;border:0;color:#C4B5FD;font-family:var(--cond);
  letter-spacing:0;font-weight:700;font-size:13.5px;cursor:pointer;margin-left:14px;padding:0}
#toast button:hover{color:#fff}

/* ---------- running total bar & mobile sheet ---------- */
#qbar{display:none}
.dk-close{display:none;justify-content:center;padding:9px 0 3px}
.dk-close button{background:var(--rule);border:0;width:48px;height:5px;border-radius:var(--r);cursor:pointer;padding:0}
/* the grab handle and "Back to products" stay pinned to the top of the sheet */
@media(max-width:1080px){
  .dk-close,.dk-back{position:sticky;z-index:3;background:var(--panel)}
  .dk-close{top:0;padding:10px 0 4px;border-radius:var(--r) var(--r) 0 0}
  .dk-close button{width:52px;height:5px;min-height:0}
  .dk-back{top:19px;padding:2px 16px 10px;border-bottom:1px solid var(--rule2)}
  .dk-back:active{color:var(--purple-dark)}
}
#scrim{position:fixed;inset:0;background:rgba(31,41,55,.48);z-index:94;opacity:0;pointer-events:none;transition:opacity .2s}
@media(max-width:1080px){
  body{padding-bottom:var(--navh)}
  body.quote-bar-visible{padding-bottom:calc(var(--navh) + 76px)}
  #qbar{
    display:none;position:fixed;left:0;right:0;bottom:var(--navh);z-index:92;
    background:var(--panel);color:var(--ink);box-shadow:0 -3px 16px rgba(31,41,55,.10);
    align-items:center;gap:10px;border-top:3px solid var(--purple);
    padding:9px 12px 10px;min-height:62px;
  }
  body.quote-bar-visible #qbar{display:flex}
  #qbar .qb-l{display:flex;align-items:baseline;gap:9px;min-width:0;overflow:hidden}
  #qbar .qb-n{font-family:var(--cond);letter-spacing:0;font-weight:600;font-size:12px;color:var(--steel);white-space:nowrap}
  #qbar .qb-t{font-size:20px;font-weight:800;line-height:1;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
  #qbar .sp{flex:1}
  #qbar .btn{padding:9px 14px;flex:0 0 auto}

  /* ---- the quotation sheet ----------------------------------------------
     It is a panel that sits ON TOP of the page but UNDER the bottom bar, so
     Catalogue, Stock, Purchase and More stay reachable the whole time it is
     open. --navh is the height of the bar plus the phone's own home
     indicator, and both the sheet and the backdrop stop exactly there.      */
  .docket{
    position:fixed;left:0;right:0;top:auto;z-index:96;
    bottom:var(--navh);
    max-height:calc(100dvh - var(--navh) - 8px);
    overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding:0 10px 0;transform:translateY(112%);transition:transform .26s ease;
    visibility:hidden;
  }
  .docket.open{transform:translateY(0);visibility:visible}
  .dk{border-radius:var(--r) var(--r) 0 0}
  .dk-close{display:flex}
  #scrim{inset:0 0 var(--navh) 0}
  #scrim.on{opacity:1;pointer-events:auto}
  #toast{bottom:calc(var(--navh) + 74px)}
  /* the last control in the sheet always clears the bar and the home bar */
  .docket.open .dk-foot{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
}
@media(max-width:1080px) and (prefers-reduced-motion:reduce){.docket{transition:none}}

/* ---------- print ---------- */
#print{display:none}
#pdfmask{
  position:fixed;inset:0;z-index:400;background:rgba(18,22,26,.94);color:#fff;
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:15px;text-align:center;padding:26px;
}
#pdfmask.on{display:flex}
#pdfmask .spin{
  width:34px;height:34px;border:3px solid rgba(255,255,255,.22);border-top-color:#A78BFA;
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#pdfmask p{margin:0;font-size:15.5px;font-weight:600}
#pdfmask small{color:#9AA5AF;font-size:13px}
@media print{
  @page{size:A4;margin:11mm}
  body>*{display:none!important}
  #print{display:block!important}
  body{background:#fff;padding:0}
}
/* quotation sheet */
#print{font-family:var(--sans);color:#000;font-size:11px;line-height:1.45}
#print .ph{display:flex;gap:16px;align-items:flex-start;border-bottom:2.5px solid #000;padding-bottom:9px}

/* ========================= state & storage ========================= */
/* ========================= storage =========================
   IndexedDB is the real store: it survives a reload, an app restart and a
   phone reboot, and it has room for the price book. localStorage mirrors it
   as a backup for the rare case where IndexedDB is blocked (private windows,
   some embedded browsers). MEM is the last resort and lasts one session.  */

const MEM = {};
const KEY = "smartie.quotedesk.v1";
const DRAFT_KEY = KEY + ".draft";
const DB_NAME = "smartie-quote-desk", DB_STORE = "kv", DB_VER = 1;

let dbPromise = null;
function openDb(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    if(typeof indexedDB === "undefined") return rej(new Error("IndexedDB unavailable"));
    let req;
    try{ req = indexedDB.open(DB_NAME, DB_VER); }
    catch(e){ return rej(e); }
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error || new Error("IndexedDB refused"));
    req.onblocked = () => rej(new Error("IndexedDB blocked by another tab"));
  }).catch(err => { dbPromise = null; throw err; });
  return dbPromise;
}
function idbGet(k){
  return openDb().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readonly");
    const rq = tx.objectStore(DB_STORE).get(k);
    rq.onsuccess = () => res(rq.result);
    rq.onerror   = () => rej(rq.error);
  }));
}
function idbSet(k, v){
  return openDb().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(v, k);
    tx.oncomplete = () => res(true);
    tx.onerror    = () => rej(tx.error);
    tx.onabort    = () => rej(tx.error);
  }));
}
/** Where the last write actually landed — shown in Settings. */
let storageMode = "checking";

const Store = {
  async get(k){
    try{
      const v = await idbGet(k);
      if(v !== undefined && v !== null){ storageMode = "IndexedDB"; return v; }
    }catch(e){ /* fall through to the backup */ }
    try{
      const raw = localStorage.getItem(k);
      if(raw != null){
        const parsed = JSON.parse(raw);
        storageMode = "localStorage";
        // put it back into IndexedDB so the next read is from the main store
        idbSet(k, parsed).catch(()=>{});
        return parsed;
      }
    }catch(e){ /* unreadable or unavailable — not fatal */ }
    if(MEM[k] !== undefined){ storageMode = "this session only"; return MEM[k]; }
    return null;
  },
  async set(k, v){
    MEM[k] = v;                       // always, so the session is consistent
    let ok = false;
    try{ await idbSet(k, v); ok = true; storageMode = "IndexedDB"; }
    catch(e){ /* try the backup */ }
    try{ localStorage.setItem(k, JSON.stringify(v)); if(!ok){ ok = true; storageMode = "localStorage"; } }
    catch(e){ /* quota or private mode — the mirror is optional */ }
    if(!ok) storageMode = "this session only";
    return ok;
  }
};

/** Resolve the rate for an item at a tier. Returns {v, derived, edited}. */
const NULLP = "\u2205";   // "this price is deliberately not set", distinct from "no override"
function rate(gid, m, tier){
  const g = groupById(gid), it = itemBy(gid,m);
  if(!g || !it) return {v:null, derived:false, edited:false, unset:true};
  const ov = ovOf(gid,m), k = TIERKEY[tier];
  if(ov[k]===NULLP) return {v:null, unset:true, edited:true};
  if(ov[k]!=null) return {v:ov[k], derived:false, edited:true};
  if(it[k]!=null) return {v:it[k], derived:false, edited:false};
  // A missing price stays missing. It is never quietly turned into zero.
  const d = ov.d!=null ? ov.d : it.d;
  if(tier==="dealer") return d==null ? {v:null, unset:true} : {v:d, derived:false, edited:false};
  const cRaw = ov.c!=null ? ov.c : it.c;
  const c = cRaw!=null ? cRaw : (d==null ? null : d*g.derive.c);
  if(tier==="contractor") return c==null ? {v:null, unset:true} : {v:c, derived:cRaw==null};
  return c==null ? {v:null, unset:true} : {v:c*g.derive.cl, derived:true};
}

/** Indian numbering, for the amount-in-words line on the printed quotation. */
function words(n){
  n = Math.round(n||0);
  if(!n) return "Zero rupees only";
  const o=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen",
    "fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const t=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  const two = v => v<20 ? o[v] : t[Math.floor(v/10)] + (v%10 ? "-"+o[v%10] : "");
  const three = v => (v>=100 ? o[Math.floor(v/100)]+" hundred"+(v%100?" and ":"") : "") + (v%100 ? two(v%100) : "");
  const parts=[];
  const cr=Math.floor(n/10000000); n%=10000000;
  const lk=Math.floor(n/100000);   n%=100000;
  const th=Math.floor(n/1000);     n%=1000;
  if(cr) parts.push(three(cr)+" crore");
  if(lk) parts.push(three(lk)+" lakh");
  if(th) parts.push(three(th)+" thousand");
  if(n)  parts.push(three(n));
  const s=parts.join(" ");
  return s.charAt(0).toUpperCase()+s.slice(1)+" rupees only";
}

/* ---------- one modal, used everywhere a small form is needed ----------
   It closes on Escape, on the backdrop, and on Cancel; it never leaves a
   stray listener behind, and the Save button stays above the keyboard. */
function openModal(title, bodyHtml, opts){
  opts = opts || {};
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<div class="modal-in" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3>
      <div class="modal-bd">${bodyHtml}</div>
      <div class="modal-acts">
        <button class="btn pri" data-mok>${esc(opts.ok || "Save")}</button>
        <button class="btn gh" data-mcancel${opts.hideCancel?" hidden":""}>${esc(opts.cancel || "Cancel")}</button>
      </div>
    </div>`;
  document.body.appendChild(box);
  document.body.classList.add("modal-open");
  const close = () => {
    document.removeEventListener("keydown", onKey);
    box.remove();
    if(!document.querySelector(".modal")) document.body.classList.remove("modal-open");
    if(opts.onClose) opts.onClose();
  };
  const onKey = e => {
    if(e.key === "Escape"){ e.stopPropagation(); close(); }
    if(e.key === "Enter" && e.target.tagName === "INPUT"){ e.preventDefault(); box.querySelector("[data-mok]").click(); }
  };
  document.addEventListener("keydown", onKey);
  box.querySelector("[data-mcancel]").onclick = close;
  box.addEventListener("click", e => { if(e.target === box) close(); });
  box.querySelector("[data-mok]").onclick = () => {
    if(opts.onSave && opts.onSave(box) === false) return;   // the form said no
    close();
  };
  const first = box.querySelector("input,textarea,select");
  if(first){ first.focus(); if(first.select) try{ first.select(); }catch(e){} }
  return {box, close};
}

  t.classList.add("on");

}

  if(!b.dataset.label) b.dataset.label = b.textContent;
  b.textContent = "Added \u2713"; b.classList.add("ok");
  clearTimeout(b._t); b._t = setTimeout(()=>{ b.textContent = b.dataset.label; b.classList.remove("ok"); }, 1500);

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove(); return ok;
  }
}

/* ========================= quote docket =========================
   One line per product. Adding the same product again raises its quantity
   instead of making a second line. Quantity and rate can both be edited
   here; a rate changed on a quotation never touches the master price book. */

const amtOf = l => Math.max(0,(+l.qty||0)) * Math.max(0,(+l.rate||0));

/** Accept both the catalogue shape and the older calculator shape. */
function normLine(l){
  const qty  = l.qty!=null ? +l.qty : (l.q!=null && !isNaN(+l.q) ? +l.q : 1);
  const rate = l.rate!=null ? +l.rate : (l.amt!=null ? (+l.amt)/(qty||1) : 0);
  return {
    k: l.k||null, t: l.t, s: l.s||"", u: l.u||"",
    qty: Math.max(0,qty||0), rate: Math.max(0,rate||0),
    origRate: l.origRate!=null ? +l.origRate : Math.max(0,rate||0),
    qlabel: (typeof l.q === "string") ? l.q : null,
    manual: !!l.manual,
    needsRate: !!l.needsRate
  };
}
const qLabel = l => l.qlabel || `${num(l.qty,2)} ${l.u || "no"}`;

/** The quoted lines, plus transportation when that field has been filled in. */
function quoteLines(){
  const L=state.lines.slice(), t=state.transport;
  if(t.on && t.amt>0) L.push(normLine({t:"Transportation", s:t.note||"", amt:t.amt, q:"1 no", transport:true}));
  return L;
}
/** Just the products and services — what the item table prints. */
const itemLines = () => state.lines.slice();
/** The transportation charge, or zero. */
const transportAmt = () => (state.transport.on && state.transport.amt > 0) ? +state.transport.amt : 0;
const subtotal = () => quoteLines().reduce((a,l)=>a+amtOf(l),0);
const grandTotal = () => { const s=subtotal(); return s + (state.gst ? s*gstRate() : 0); };

const lineIndex = k => state.lines.findIndex(l=>l.k===k);

/** Raise or lower a catalogue product's quantity. Zero removes the line. */
function changeQty(k, delta, absolute){
  const i = lineIndex(k);
  if(i<0){
    const q = absolute!=null ? absolute : delta;
    if(!(q>0)) return;
    const [gid,m]=k.split("|");
    const it=itemBy(gid,m); if(!it) return;
    const L=label(gid,it);
    let r=px(gid,m);
    const needsRate = (r==null);
    if(needsRate) r = 0;            // never silently a zero — the line is flagged
    state.lines.push(normLine({k, t:`${L.m} — ${L.n}`, s:it.spec||"", u:L.u,
                               qty:q, rate:r, origRate:r, needsRate}));
    if(needsRate){
      renderDocket();
      const idx = state.lines.length-1;
      toast(`${L.m} has no ${TIERNAME[state.tier].replace(" rate","").toLowerCase()} price \u2014 enter one for this quotation`);
      setTimeout(()=>editLine(idx), 60);
      return;
    }
  } else {
    const l=state.lines[i];
    l.qty = absolute!=null ? Math.max(0,absolute) : l.qty + delta;
    if(!(l.qty>0)) state.lines.splice(i,1);
  }
  renderDocket();
}
const qtyInQuote = k => { const i=lineIndex(k); return i<0 ? 0 : state.lines[i].qty; };

function addLines(arr, btn){
  const n = arr.length;
  arr.forEach(l=>state.lines.push(normLine(l)));
  renderDocket();
  flashBtn(btn);
  const dk = $(".dk");
  if(dk){ dk.classList.remove("bump"); void dk.offsetWidth; dk.classList.add("bump"); }
  toast(`${n} line${n>1?"s":""} added · quote now ${money(grandTotal())}`, "Undo", ()=>{
    state.lines.splice(state.lines.length-n, n); renderDocket(); toast("Removed");
  });
}

/** Change the rate type. Catalogue lines follow; manual items and rates the
    user typed over are left exactly as they are. */
function setTier(t){
  if(!TIERNAME[t] || t===state.tier) return;
  const prev=state.tier;
  state.tier=t;
  let moved=0, kept=0; const missing=[];
  state.lines.forEach(l=>{
    if(l.manual || !l.k){ kept++; return; }
    if(Math.abs(l.rate-l.origRate)>0.004){ kept++; return; }   // an override the user set
    const [gid,m]=l.k.split("|");
    const nv=px(gid,m);
    if(nv==null){ missing.push(l.t.split(" \u2014 ")[0]); return; }
    l.rate=nv; l.origRate=nv; moved++;
  });
  $$("[data-tier]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tier===state.tier));
  refreshAll();
  if(!["prices","products"].includes(state.view)) render(); else renderDocket();
  if(missing.length) toast(`No ${TIERNAME[t].replace(" rate","").toLowerCase()} price for ${missing.slice(0,2).join(", ")}${missing.length>2?" +"+(missing.length-2):""} \u2014 set a rate on the line`);
  else if(kept) toast(`${TIERNAME[t]} \u00b7 ${moved} repriced, ${kept} left as entered`);
  else toast(TIERNAME[t]);
}

/* ========================= the unfinished quotation =========================
   Whatever is on the docket is kept, so closing the app, losing signal or a
   phone restart does not throw the work away. It is cleared only when the
   quotation is finalised or when the user asks for a new one. */

let draftTimer = null;
function draftSnapshot(){
  const g = id => { const el=$(id); return el ? el.value : ""; };
  return {
    at: Date.now(),
    draftId: state.draftId || null,
    partyId: state.partyId || null,
    tier: state.tier,
    gst: state.gst,
    transport: state.transport,
    lines: state.lines,
    party: {
      client:  g("#qClient"), site: g("#qSite"),  gstin: g("#qGst"),
      contact: g("#qContact"), phone: g("#qPhone"),
      email:   g("#qEmail"),   addr:  g("#qAddr")
    }
  };
}
function saveDraft(){
  if(isFinalised()) return;                   // a finalised quotation is history, not a draft
  clearTimeout(draftTimer);
  draftTimer = setTimeout(()=>{
    const d = draftSnapshot();
    const empty = !d.lines.length && !d.transport.amt &&
                  !Object.values(d.party).some(Boolean);
    if(empty){ Store.set(DRAFT_KEY, null).catch(()=>{}); return; }
    Store.set(DRAFT_KEY, d).catch(()=>{});
  }, 500);
}
function clearDraft(){
  clearTimeout(draftTimer);
  Store.set(DRAFT_KEY, null).catch(()=>{});
}
async function restoreDraft(){
  let d = null;
  try{ d = await Store.get(DRAFT_KEY); }catch(e){ return false; }
  if(!d || typeof d !== "object") return false;
  try{
    if(Array.isArray(d.lines) && d.lines.length) state.lines = d.lines.map(l=>normLine(l));
    if(d.draftId) state.draftId = d.draftId;
    if(d.partyId) state.partyId = d.partyId;
    if(d.tier && TIERNAME[d.tier]) state.tier = d.tier;
    if(typeof d.gst === "boolean") state.gst = d.gst;
    if(d.transport && typeof d.transport === "object"){
      state.transport = {on:!!d.transport.on, amt:+d.transport.amt||0, note:d.transport.note||""};
      const on=$("#trOn"), amt=$("#trAmt"), note=$("#trNote");
      if(on)  on.checked = state.transport.on;
      if(amt) amt.value  = state.transport.amt || "";
      if(note)note.value = state.transport.note || "";
    }
    const p = d.party || {};
    [["#qClient",p.client],["#qSite",p.site],["#qGst",p.gstin],["#qContact",p.contact],
     ["#qPhone",p.phone],["#qEmail",p.email],["#qAddr",p.addr]]
      .forEach(([id,v])=>{ const el=$(id); if(el && v) el.value=v; });
    const g=$("#gstOn"); if(g) g.checked = state.gst;
    return !!(state.lines.length || state.transport.amt || Object.values(p).some(Boolean));
  }catch(e){ return false; }
}

/* ---------- editing inside the quotation ----------
   Everything here changes THIS quotation line only. The catalogue product
   keeps its own name, description and price; nothing written on a quotation
   ever reaches the master price book. */

/** Open the line editor: name, description, quantity, rate, Save, Cancel. */
function editLine(i){
  const l = state.lines[i];
  if(!l) return;
  const wasNew = !!l.needsRate && !(l.rate > 0);
  openModal(wasNew ? "Set the rate for this line" : "Edit this quotation line", `
    <label class="f"><span>Product name</span>
      <input type="text" id="leT" value="${esc(l.t)}"></label>
    <label class="f" style="margin-top:11px"><span>Description</span>
      <input type="text" id="leS" value="${esc(l.s||"")}" placeholder="Optional"></label>
    <div class="grid g2" style="margin-top:11px">
      <label class="f"><span>Quantity</span>
        <input type="number" id="leQ" value="${Math.round((+l.qty||0)*100)/100}" min="0" step="1" inputmode="decimal"></label>
      <label class="f"><span>Rate \u20b9</span>
        <input type="number" id="leR" value="${l.needsRate && !(l.rate>0) ? "" : Math.round((+l.rate||0)*100)/100}" min="0" step="1" inputmode="decimal" placeholder="0"></label>
    </div>
    <p class="hint">This changes only this quotation. The saved product is not touched.</p>`,
  {
    ok: "Save",
    onSave: box => {
      const t2 = box.querySelector("#leT").value.trim();
      const s2 = box.querySelector("#leS").value.trim();
      const qs = box.querySelector("#leQ").value.trim();
      const rs = box.querySelector("#leR").value.trim();
      const q2 = +qs, r2 = +rs;
      if(!t2){ toast("The line needs a name"); return false; }
      if(qs==="" || isNaN(q2) || q2 <= 0){ toast("Quantity must be more than zero"); return false; }
      if(rs==="" || isNaN(r2) || r2 < 0){ toast("Enter a rate of zero or more"); return false; }
      const cur = state.lines[i];
      if(!cur) return;
      cur.t = t2; cur.s = s2; cur.qty = q2; cur.rate = r2;
      if(r2 > 0) delete cur.needsRate;
      if(wasNew) cur.origRate = r2;             // this is the rate it started life on
      renderDocket();                           // line total, subtotal, GST, grand total
      toast(Math.abs(r2 - cur.origRate) > 0.004
        ? `Rate set to ${money(r2)} for this quotation only`
        : "Line updated");
    },
    onClose: () => {
      // a product added with no price and no rate typed does not stay behind
      const cur = state.lines[i];
      if(wasNew && cur && cur.needsRate && !(cur.rate > 0)){
        state.lines.splice(i, 1);
        renderDocket();
        toast("Line removed \u2014 no rate was entered");
      }
    }
  });
}

/* Freezing the body with position:fixed is the only approach Android Chrome
   respects; plain overflow:hidden still lets the page behind scroll. The
   scroll position is parked and put back exactly on close. */
let parkedScroll = 0, bodyLocked = false;
function lockBody(on){
  const mobile = window.innerWidth<=1080;
  if(on && !mobile) return;                  // desktop keeps its sidebar
  if(on && mobile && !bodyLocked){
    parkedScroll = window.scrollY || document.documentElement.scrollTop || 0;
    document.body.style.position="fixed";
    document.body.style.top = `-${parkedScroll}px`;
    document.body.style.left="0"; document.body.style.right="0";
    document.body.style.width="100%";
    document.body.style.overflow="hidden";
    bodyLocked=true;
  } else if(!on && bodyLocked){
    document.body.style.position=""; document.body.style.top="";
    document.body.style.left=""; document.body.style.right="";
    document.body.style.width=""; document.body.style.overflow="";
    bodyLocked=false;
    window.scrollTo(0, parkedScroll);
  }
}
function openSheet(on){
  const dk = $(".docket");
  const was = dk.classList.contains("open");
  dk.classList.toggle("open", on);
  $("#scrim").classList.toggle("on", on);
  if(window.innerWidth<=1080) dk.setAttribute("aria-hidden", on ? "false" : "true");
  else dk.removeAttribute("aria-hidden");
  lockBody(on);
  if(on && !was){
    // always start at the top of the quotation, never halfway down the last one
    dk.scrollTop = 0;
    requestAnimationFrame(()=>{ dk.scrollTop = 0; });
    const l = $("#dkLines"); if(l) l.scrollTop = 0;
  }
  const qb = $("#qbOpen"); if(qb) qb.setAttribute("aria-expanded", on ? "true" : "false");
}
const sheetOpen = () => $(".docket").classList.contains("open");

/* ---------- going back ----------
   One stack of undoable steps: a tab you came from, or the open quotation
   sheet. The device back button rides on the same stack through history. */
const nav = [];
let HIST_OK = false;
let skipPop = 0;        // history entries we have already accounted for

function scrollTop(){ try{ window.scrollTo({top:0,behavior:"instant"}); }catch(e){ window.scrollTo(0,0); } }
function updateBack(){
  const b=$("#btnBack"); if(!b) return;
  b.hidden = nav.length===0;
}
function pushNav(entry){
  nav.push(entry);
  try{ history.pushState({qd:1}, ""); HIST_OK=true; }catch(e){ HIST_OK=false; }
  updateBack();
}
function applyBack(){
  const e=nav.pop();
  if(e){
    if(e.sheet) openSheet(false);
    else if(e.view){
      state.view=e.view; render();
      const y=navScroll[e.view]||0;
      requestAnimationFrame(()=>window.scrollTo(0, y));   // back where you left off
    }
  }
  updateBack();
}
/** Undo one step, keeping browser history in step where it is available. */
function stepBack(){
  if(!nav.length) return;
  if(HIST_OK) history.back();   // popstate runs applyBack
  else applyBack();
}
/** Drop the history entry that belongs to a step we have already undone
    ourselves, so the device Back button never replays it. */
function consumeHistory(){
  if(!HIST_OK) return;
  skipPop++;
  try{ history.back(); }catch(e){ skipPop = Math.max(0, skipPop-1); }
}
const navScroll = {};
function goView(v){
  // Closing the sheet first, and synchronously, is what lets a bottom-bar tap
  // both dismiss the quotation and land on the section that was tapped.
  closeSheet();
  if(v===state.view){ scrollTop(); return; }
  navScroll[state.view] = window.scrollY || 0;      // so Back can return you there
  pushNav({view:state.view});
  state.view=v; render(); scrollTop();
}
function showSheet(){
  if(sheetOpen()){ $(".docket").scrollTop = 0; return; }   // already open, no second entry
  openSheet(true);
  pushNav({sheet:true});
}
/** Close the quotation. Safe to call when it is already closed. */
function closeSheet(){
  if(!sheetOpen()) return;
  openSheet(false);
  if(nav.length && nav[nav.length-1].sheet){
    nav.pop();
    consumeHistory();          // the entry is spent; Back will not reopen it
    updateBack();
  }
}
window.addEventListener("popstate", ()=>{
  if(skipPop > 0){ skipPop--; return; }   // a step we have already undone
  applyBack();                            // Android Back closes the sheet first
});

/* ========================= shared UI bits ========================= */
function fieldNum(id,label,val,step,extra=""){
  return `<label class="f"><span>${label}</span><input type="number" id="${id}" value="${val}" step="${step||"any"}" ${extra}></label>`;
}
function fieldSel(id,label,opts,sel){
  return `<label class="f"><span>${label}</span><select id="${id}">${opts.map(o=>`<option value="${esc(o[0])}"${o[0]===sel?" selected":""}>${esc(o[1])}</option>`).join("")}</select></label>`;
}
function slatOpts(gid,models){
  return models.map(m=>{ const L=label(gid,itemBy(gid,m)); return [m, `${L.n} — ${money(px(gid,m))}/${L.u.replace("per ","")}`]; });
}
function rowsTable(rows){
  return `<div class="rows-wrap"><table class="rows"><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.t)}${r.s?`<span class="sub">${esc(r.s)}</span>`:""}</td>
      <td class="n" data-l="Qty">${r.q}</td><td class="n" data-l="Rate">${r.rt}</td><td class="n" data-l="Amount">${money(r.amt)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function outBlock(rows, note){
  const tot = rows.reduce((a,r)=>a+r.amt,0);
  return `<div class="calcout">${rowsTable(rows)}
    <div class="tot"><span class="lbl">Works total, before GST</span><span class="val">${money(tot)}</span></div>
    ${note?`<p class="hint">${note}</p>`:""}
    <div style="margin-top:14px"><button class="btn pri" id="btnAdd">Add these lines to the quotation</button></div></div>`;
}

V.shutter.wire = () => {
  const g="profile";
  const draw = () => {
    const sys=$("#sSys").value;
    const dwSlats=["ALDW80-MILL","ALDW80-WM","ALDW80-PUFF","ALDW80-WOOD"];
    const swSlats=["ALSW77-RECT","ALSW77-HC"];
    const sgs=["ALSG80-MILL","ALSG80-WM","ALSG80-WOOD","ALSG100"];
    const btms=["ALBTM80-MILL","ALBTM80-WM","ALBTM80-WOOD"];
    const slatSet = sys==="dw"?dwSlats : sys==="sw"?swSlats : ["PCROLL"];
    const btmSet  = sys==="pc"?["ALBTM-PC"]:btms;
    const prevSlat=$("#sSlat")?.value, prevSg=$("#sSg")?.value, prevBtm=$("#sBtm")?.value;
    $("#sPick").innerHTML =
      fieldSel("sSlat", sys==="pc"?"Polycarbonate roll":"Slat & finish", slatOpts(g,slatSet), slatSet.includes(prevSlat)?prevSlat:slatSet[0]) +
      fieldSel("sSg","Side guide", slatOpts(g,sgs), sgs.includes(prevSg)?prevSg:"ALSG80-WM") +
      fieldSel("sBtm","Bottom profile", slatOpts(g,btmSet), btmSet.includes(prevBtm)?prevBtm:btmSet[0]);
    $("#sConnWrap").hidden = sys!=="pc";
    $("#sPick").querySelectorAll("select").forEach(s=>s.addEventListener("change",calc));
    calc();
  };
  const calc = () => {
    const FT = 304.8;
    const wFt=+$("#sW").value||0, hFt=+$("#sH").value||0, q=Math.max(1,+$("#sQ").value||1), sys=$("#sSys").value;
    const wM = wFt*FT/1000, hM = hFt*FT/1000, hMM = hFt*FT;
    if(!wM||!hM){ $("#sOut").innerHTML=""; $("#sSpec").innerHTML=""; return; }
    const pitch = sys==="dw"?80 : sys==="sw"?77 : 117;
    const n = Math.ceil(hMM/pitch);
    const rows=[];
    const slatM = label(g, itemBy(g,$("#sSlat").value));
    const rSlat = px(g,$("#sSlat").value);
    const slatMtr = n*wM*q;
    rows.push({t:slatM.n, s:`${n} ${sys==="pc"?"connector pitches":"slats"} at ${num(wM)} m — ${num(slatMtr)} m`, q:`${num(slatMtr)} m`, rt:money(rSlat), amt:slatMtr*rSlat});
    if(sys==="pc" && $("#sConn").checked){
      const r=px(g,"PCCONN"); rows.push({t:itemBy(g,"PCCONN").n, s:`${n} connectors at ${num(wM)} m`, q:`${num(n*wM*q)} m`, rt:money(r), amt:n*wM*q*r});
    }
    const sgM=label(g, itemBy(g,$("#sSg").value)), rSg=px(g,$("#sSg").value), sgMtr=2*hM*q;
    rows.push({t:sgM.n, s:`2 lengths at ${num(hM)} m`, q:`${num(sgMtr)} m`, rt:money(rSg), amt:sgMtr*rSg});
    const btM=label(g, itemBy(g,$("#sBtm").value)), rBt=px(g,$("#sBtm").value);
    rows.push({t:btM.n, s:`1 length at ${num(wM)} m`, q:`${num(wM*q)} m`, rt:money(rBt), amt:wM*q*rBt});
    if($("#sCaps").checked){
      const key = sys==="pc"?"PCFL-ENDCAP":"ENDCAP", r=px(g,key), pcs=2*n*q;
      rows.push({t:label(g,itemBy(g,key)).n, s:`2 per ${sys==="pc"?"connector":"slat"}`, q:`${pcs} pc`, rt:money(r), amt:pcs*r});
    }
    if($("#sSeal").checked){ const r=px(g,"BTMSEAL"); rows.push({t:label(g,itemBy(g,"BTMSEAL")).n, s:"Full width", q:`${num(wM*q)} m`, rt:money(r), amt:wM*q*r}); }
    if($("#sVel").checked){ const r=px(g,"VELVET"); rows.push({t:label(g,itemBy(g,"VELVET")).n, s:"Both side guides", q:`${num(2*hM*q)} m`, rt:money(r), amt:2*hM*q*r}); }

    $("#sSpec").innerHTML = [
      ["Opening", `${num(wM)} × ${num(hM)} m`],
      [sys==="pc"?"Connectors":"Slats", `${n} at ${pitch} mm`],
      ["Curtain", `${num(n*wM)} m per shutter`],
      ["Side guide", `${num(2*hM)} m per shutter`]
    ].map(([k,v])=>`<span><b>${k}</b> ${v}</span>`).join("");
    $("#sOut").innerHTML = outBlock(rows, `Slat count is rounded up to a whole slat. Lengths converted at 1 ft = 304.8 mm, as printed on the profile list. Profile only — no motor, fabrication or fitting.`);
    $("#btnAdd").onclick = (ev) => addLines(rows.map(r=>({t:r.t, s:`${wFt}′ × ${hFt}′ shutter${q>1?` × ${q}`:""} — ${r.q} @ ${r.rt}`, amt:r.amt})), ev.currentTarget);
  };
  ["sW","sH","sQ","sCaps","sSeal","sVel"].forEach(id=>$("#"+id).addEventListener("input",calc));
  $("#sSys").addEventListener("change",draw);
  document.addEventListener("change", e=>{ if(e.target.id==="sConn") calc(); });
  draw();
};
