V.history.wire = () => {
  const admin = isAdmin() || !fbConfigured();

  const rowsNow = () => {
    const d = draftRow();
    return (d ? [d] : []).concat(state.quotes);
  };

  const draw = () => {
    const q=($("#hsQ").value||"").toLowerCase().trim();
    const st=$("#hsStatus").value, party=$("#hsParty").value, tier=$("#hsTier").value;
    const from=$("#hsFrom").value?new Date($("#hsFrom").value+"T00:00:00").getTime():0;
    const to  =$("#hsTo").value  ?new Date($("#hsTo").value+"T23:59:59").getTime():Infinity;
    $("#hsClear").hidden=!q;

    const chosen = party ? state.customers.find(c=>c.id===party) : null;

    const rows=rowsNow().filter(x=>{
      if(st && quoteStatus(x)!==st) return false;
      if(tier && x.tier!==tier) return false;
      if((x.at||0)<from || (x.at||0)>to) return false;
      if(chosen){
        const p=x.party||{};
        const same = (x.partyId && x.partyId===chosen.id)
          || (chosen.gstin && norm(p.gstin)===norm(chosen.gstin))
          || (chosen.phone && digits(p.phone).length>=7 && digits(p.phone)===digits(chosen.phone))
          || (chosen.name  && norm(p.name)===norm(chosen.name));
        if(!same) return false;
      }
      if(q && ![x.no, x.party?.name, x.party?.phone, x.party?.site, x.party?.gstin, x.by]
        .some(v=>String(v||"").toLowerCase().includes(q))) return false;
      return true;
    }).sort((a,b)=>(b.at||0)-(a.at||0));

    if(!rows.length){
      $("#hsList").innerHTML=`<div class="empty">${state.quotes.length
        ? "Nothing matches those filters."
        : "<b>No issued quotations yet</b><br>Download, print or share a quotation and it appears here."}</div>`;
      return;
    }
    $("#hsList").innerHTML=`<p class="reshead">${rows.length} quotation${rows.length>1?"s":""}</p>
      <div class="plist">${rows.map(x=>{
      const s = quoteStatus(x);
      const cls = s==="Cancelled" ? "w" : s==="Draft" ? "" : "g";
      return `<div class="prow${s==="Cancelled"?" st-cancelled":""}">
        <div class="nm"><b>${esc(x.no || "Not yet numbered")}</b>
          <span class="tag ${cls}">${esc(s)}</span>
          <span class="tag">${esc((x.tierName||x.tier||"").replace(" rate",""))}</span>
          <span>${esc(x.party?.name||"—")}${x.party?.site?` · ${esc(x.party.site)}`:""}</span>
          <span class="qtyline">${x.lines?.length||0} line${(x.lines?.length||0)===1?"":"s"} · GST ${finitePct(x.gstPct, 18)}% · <b>${money(x.total)}</b></span>
          <span class="meta">${esc(x.by||"unnamed")} · ${stamp(x.at)}${
            x.cancelledAt?` · cancelled by ${esc(x.cancelledBy||"unnamed")}`:""}</span></div>
        <div class="practs">
          <button class="btn gh sm" data-hview="${esc(x.id)}">View</button>
          ${x.draft
            ? `<button class="btn pri sm" data-hopen="${esc(x.id)}">Open</button>`
            : `<button class="btn pri sm" data-hpdf="${esc(x.id)}">PDF</button>
               <button class="btn gh sm" data-hdup="${esc(x.id)}">Duplicate</button>
               ${admin && s!=="Cancelled" ? `<button class="btn gh sm" data-hcancel="${esc(x.id)}">Cancel</button>` : ""}`}
        </div></div>`;
    }).join("")}</div>`;
  };
  V.history.repaint = draw;
  ["hsQ","hsStatus","hsParty","hsTier","hsFrom","hsTo"].forEach(id=>{
    $("#"+id).addEventListener("input",draw); $("#"+id).addEventListener("change",draw);
  });
  $("#hsClear").onclick=()=>{ $("#hsQ").value=""; draw(); };
  $("#hsClearF").onclick=()=>{
    ["hsQ","hsStatus","hsParty","hsTier","hsFrom","hsTo"].forEach(id=>$("#"+id).value="");
    draw(); toast("Filters cleared");
  };

  const findRow = id => rowsNow().find(z=>z.id===id);

  $("#hsList").addEventListener("click", async e=>{
    const b = e.target.closest("[data-hpdf],[data-hdup],[data-hview],[data-hopen],[data-hcancel]");
    if(!b) return;
    const id = b.dataset.hpdf || b.dataset.hdup || b.dataset.hview || b.dataset.hopen || b.dataset.hcancel;
    const x = findRow(id); if(!x) return;

    /* ---- View: exactly what the quotation says, read only ---- */
    if(b.dataset.hview != null){
      const P = x.party || {};
      const rows = (x.lines||[]).map((l,i)=>`<tr>
        <td>${i+1}. ${esc(l.t)}${l.s?`<span class="sub">${esc(l.s)}</span>`:""}</td>
        <td class="n" data-l="Qty">${num(l.qty,2)}${l.u?" "+esc(l.u):""}</td>
        <td class="n" data-l="Rate">${money(l.rate)}</td>
        <td class="n" data-l="Amount">${money(l.amt!=null?l.amt:(l.qty*l.rate))}</td></tr>`).join("");
      openModal(`${x.no || "Draft quotation"}`, `
        <p class="hint" style="margin:0 0 10px">${esc(quoteStatus(x))} · ${esc((x.tierName||x.tier||"").replace(" rate",""))} rate · ${esc(stamp(x.at))}</p>
        <div class="viewmeta">
          ${[["Party",P.name],["Contact",P.contact],["Phone",P.phone],["Email",P.email],
             ["Address",P.address],["Site",P.site],["GSTIN",P.gstin],["Issued by",x.by]]
            .filter(([,v])=>v).map(([k,v])=>`<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("")}
        </div>
        <div class="rows-wrap"><table class="rows">
          <thead><tr><th>Description</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        <div class="frow"><span>Subtotal</span><span class="num">${money(x.subtotal)}</span></div>
        ${x.gst!==false?`<div class="frow"><span>GST ${finitePct(x.gstPct,18)}%</span><span class="num">${money((x.total||0)-(x.subtotal||0))}</span></div>`:""}
        <div class="grand"><span class="lbl">Grand total</span><span class="val">${money(x.total)}</span></div>`,
        {ok:"Close", hideCancel:true, onSave:()=>{}});
      return;
    }

    /* ---- Open: the draft is already on screen ---- */
    if(b.dataset.hopen != null){ showSheet(); return; }

    /* ---- Cancel: admin only, the number stays spent ---- */
    if(b.dataset.hcancel != null){
      if(!admin) return toast("Only an administrator can cancel a quotation");
      if(!confirmAction(`Cancel ${x.no}?\n\nThe record is kept and marked cancelled. The number is never released or re-used.`)) return;
      await cancelQuote(x);
      draw(); toast(`${x.no} cancelled`);
      return;
    }

    /* ---- PDF: re-issue it exactly as it went out ---- */
    if(b.dataset.hpdf != null){
      const FIELDS=["#qClient","#qSite","#qGst","#qContact","#qPhone","#qEmail","#qAddr","#qRef"];
      const keep = {
        lines: state.lines, no: state.quoteNo, tier: state.tier, transport: state.transport,
        gst: state.gst, company: state.company, terms: state.terms, notes: state.notes,
        partyId: state.partyId,
        form: FIELDS.reduce((o,fid)=>{ const el=$(fid); o[fid]= el?el.value:""; return o; }, {})
      };
      const sn = x.snap || {};
      state.lines = x.lines.map(l=>normLine(l));
      state.quoteNo = x.no;
      state.tier = x.tier || state.tier;
      state.transport = {on:false, amt:0, note:""};      // transport is already a line
      state.gst = x.gst !== false;
      state.company = Object.assign({}, state.company, {
        name:sn.name, tagline:sn.tag, address:sn.addr, phone:sn.phones,
        email:sn.email, web:sn.web, gstin:sn.gstin, pan:sn.pan,
        bankName:sn.bank&&sn.bank.name, bankBranch:sn.bank&&sn.bank.branch,
        bankAcc:sn.bank&&sn.bank.acc, bankIfsc:sn.bank&&sn.bank.ifsc, upi:sn.bank&&sn.bank.upi,
        validityDays: finitePct(sn.validityDays, CO("validityDays")),
        payTerms: sn.payTerms || CO("payTerms"),
        warranty: sn.warranty || CO("warranty"),
        pdfFooter: sn.pdfFooter || CO("pdfFooter"),
        defaultGst: finitePct(x.gstPct, finitePct(sn.gstPct, gstPercent()))
      });
      if(Array.isArray(sn.terms) && sn.terms.length) state.terms = sn.terms;
      if(Array.isArray(sn.notes) && sn.notes.length) state.notes = sn.notes;

      fillParty(Object.assign({}, x.party||{}, {city:(x.party&&x.party.site)||"", id:x.partyId}));
      const rEl=$("#qRef"); if(rEl) rEl.value = x.no;

      try{ await downloadQuotePdf(); }
      finally{
        state.lines=keep.lines; state.quoteNo=keep.no; state.tier=keep.tier;
        state.transport=keep.transport; state.gst=keep.gst; state.company=keep.company;
        state.terms=keep.terms; state.notes=keep.notes; state.partyId=keep.partyId;
        FIELDS.forEach(fid=>{ const el=$(fid); if(el) el.value = keep.form[fid]; });
        renderDocket();
      }
      return;
    }

    /* ---- Duplicate: a fresh draft that will take its own number ---- */
    if(b.dataset.hdup != null){
      if(state.lines.length && !confirmAction("Replace the quotation you are working on with a copy of this one?")) return;
      state.lines=x.lines.map(l=>normLine(Object.assign({},l,{k:l.k})));
      state.transport={on:false,amt:0,note:""};
      $("#trOn").checked=false; $("#trAmt").value=""; $("#trNote").value="";
      resetQuoteNo();                       // a copy gets its own number, on finalising
      fillParty(Object.assign({}, x.party||{}, {city:x.party?.site, id:x.partyId}));
      if(x.tier) state.tier=x.tier;
      renderDocket(); showSheet();
      toast("Copied into a new draft — it takes a new number when you download, print or share");
    }
  });
  draw();
};

async function fbSaveCompany(){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  if(!isAdmin()) throw new Error("Only an administrator can change company settings");
  const {doc, setDoc, serverTimestamp} = f.D;
  await setDoc(doc(f.db,"teamSettings","company"),
    Object.assign({}, state.company, {
      terms: state.terms || null,          // null means "use the standard wording"
      notes: state.notes || null,
      updated:Date.now(), serverAt: serverTimestamp(),
      by:state.auth.name, byUid:state.auth.uid
    }), {merge:true});
}
function watchCompany(f){
  const {doc, onSnapshot} = f.D;
  return onSnapshot(doc(f.db,"teamSettings","company"), snap=>{
    if(!snap.exists()) return;
    const v = plainDoc(snap.data());
    state.company = v;
    // wording the team has agreed, applied on every signed-in device
    state.terms = Array.isArray(v.terms) && v.terms.length ? v.terms : null;
    state.notes = Array.isArray(v.notes) && v.notes.length ? v.notes : null;
    // the shared default rate type, but never over a draft already in progress
    if(v.defaultTier && TIERNAME[v.defaultTier] && !state.lines.length && !isFinalised()){
      state.tier = v.defaultTier;
      $$("[data-tier]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tier===state.tier));
    }
    saveSettings();
    refreshAll();
    if(state.view==="settings" && V.settings.repaint) V.settings.repaint();
  }, err=>{});
}
/** Admin numbering changes belong to the team, not to one phone. */
async function fbSaveNumbering(){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  if(!isAdmin()) throw new Error("Only an administrator can change numbering");
  const {doc, runTransaction} = f.D;
  const ref = doc(f.db,"teamSettings","numbering");
  const N = state.numbering;
  await runTransaction(f.db, async tx=>{
    const snap = await tx.get(ref);
    const cur = snap.exists() ? snap.data() : null;
    if(cur && N.fy===cur.fy && N.next < (cur.next||1))
      throw new Error(`The team counter is already at ${cur.next}. A number cannot be re-used.`);
    tx.set(ref, {prefix:N.prefix, fy:N.fy, next:N.next, pad:N.pad,
                 updated:Date.now(), by:state.auth.name}, {merge:true});
  });
}
function watchNumbering(f){
  const {doc, onSnapshot} = f.D;
  return onSnapshot(doc(f.db,"teamSettings","numbering"), snap=>{
    if(!snap.exists()) return;
    const v=snap.data();
    Object.assign(state.numbering, {prefix:v.prefix||state.numbering.prefix,
      fy:v.fy||state.numbering.fy, next:v.next||state.numbering.next, pad:v.pad||state.numbering.pad});
    if(v.lastIssued) state.numbering.lastIssued=v.lastIssued;
    saveSettings();
    const el=$("#qRef"); if(el && !isFinalised()) el.placeholder=nextPreview();
    if(state.view==="settings" && V.settings.repaint) V.settings.repaint();
  }, err=>{});
}

V.settings.wire = () => {
  const admin = isAdmin() || !fbConfigured();
  V.settings.repaint = () => { if(state.view==="settings") render(); };

  $("#stTerms").value = termsList().join("\n");
  $("#stNotes").value = notesList().join("\n");

  /* cache size, honestly reported */
  (async()=>{
    let txt="Offline copy: not stored yet.";
    try{
      if("caches" in window){
        const keys=await caches.keys();
        const mine=keys.filter(k=>k.startsWith("smartie-quote-desk"));
        if(mine.length){
          const c=await caches.open(mine[0]);
          txt=`Offline copy: ${(await c.keys()).length} files cached as ${mine[0]}.`;
        }
      }
    }catch(e){}
    const el=$("#stCache");
    if(el) el.textContent = `Saved using ${storageMode}. ${txt} The app works with no signal; only sync needs one.`;
  })();

  const preview = () => {
    const p=$("#stPrefix").value.trim()||state.numbering.prefix;
    const fy=$("#stFy").value.trim()||state.numbering.fy;
    const n=Math.max(1,+$("#stNext").value||1);
    const pd=Math.min(6,Math.max(1,+$("#stPad").value||3));
    return `${p}/${fy}/${String(n).padStart(pd,"0")}`;
  };
  if(admin) ["stPrefix","stFy","stNext","stPad"].forEach(id=>
    $("#"+id).addEventListener("input",()=>{ $("#stPrev").textContent=preview(); }));

  const paintFy = () => {
    const now=fyNow(), box=$("#stFyBanner"); if(!box) return;
    if(state.numbering.fy===now || !admin){ box.innerHTML=""; return; }
    box.innerHTML=`<div class="note"><b>The financial year is now ${esc(now)}.</b>
      Numbering is still on ${esc(state.numbering.fy)}. Rolling over restarts at 1 — nothing happens until you choose it.
      <div style="margin-top:9px"><button class="btn sm" id="stFyRoll">Start ${esc(now)} at 001</button></div></div>`;
    $("#stFyRoll").onclick = async () => {
      if(!confirm(`Start the ${now} sequence at 001?\n\nNumbers already issued under ${state.numbering.fy} are unaffected.`)) return;
      state.numbering.fy=now; state.numbering.next=1; state.numbering.fyAsked=now;
      $("#stFy").value=now; $("#stNext").value=1;
      try{ if(usingFirebase()) await fbSaveNumbering(); saveSettings(); toast(`Numbering rolled over to ${now}`); render(); }
      catch(e){ toast(friendlyAuthError(e)); }
    };
  };
  paintFy();

  /* device preferences apply at once */
  $("#stFont").onchange = e => {
    state.prefs.font=+e.target.value;
    document.documentElement.style.fontSize=(state.prefs.font/100*16)+"px";
    saveSettings(); toast("Text size updated");
  };
  $("#stCats").onchange = e => {
    state.prefs.openCats = e.target.value==="1";
    BOOK.groups.forEach(g=>state.catOpen[g.id]=state.prefs.openCats);
    saveSettings(); toast(state.prefs.openCats?"Categories open by default":"Categories closed by default");
  };

  /* account */
  if($("#stOut")) $("#stOut").onclick = () => { if(confirm("Sign out of this device?")) fbSignOut(); };
  if($("#stPwd")) $("#stPwd").onclick = async () => {
    if(!state.auth) return;
    if(!confirm(`Send a password reset link to ${state.auth.email}?`)) return;
    try{ await fbReset(state.auth.email); toast("Reset link sent — check the inbox and spam folder"); }
    catch(e){ toast(friendlyAuthError(e)); }
  };

  /* backup */
  $("#stExport").onclick = () => {
    const blob=new Blob([JSON.stringify({
      kind:"smartie-quote-desk-backup", version:APP_VERSION, at:Date.now(),
      rev:state.rev, effective:state.effective, ov:state.ov, custom:state.custom,
      terms:state.terms, notes:state.notes, stock:state.stock, numbering:state.numbering,
      purchase:state.purchase, customers:state.customers, quotes:state.quotes,
      company:state.company, priceReviewed:state.priceReviewed
    },null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`smartie-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast("Backup downloaded");
  };
  $("#stImportBtn").onclick = () => $("#stImport").click();
  $("#stImport").onchange = e => {
    const file=e.target.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload = () => {
      let d;
      try{ d=JSON.parse(rd.result); }catch(err){ return toast("That file is not readable as a backup"); }
      if(d.kind!=="smartie-quote-desk-backup")
        return toast("That does not look like a Quote Desk backup");
      const counts=[`${Object.keys(d.stock||{}).length} stock items`,
                    `${(d.purchase||[]).length} requirements`,
                    `${(d.customers||[]).length} customers`,
                    `${(d.quotes||[]).length} quotations`].join("\n");
      if(!confirm(`Import this backup?\n\nTaken ${d.at?new Date(d.at).toLocaleDateString("en-IN"):"at an unknown date"}, holding:\n${counts}\n\nIt replaces what is on this device. The team's data in Firestore is not touched.`)) return;
      ["ov","custom","stock","numbering","company","priceReviewed"].forEach(k=>{ if(d[k]) state[k]=d[k]; });
      ["purchase","customers","quotes"].forEach(k=>{ if(Array.isArray(d[k])) state[k]=d[k]; });
      if(d.terms) state.terms=d.terms; if(d.notes) state.notes=d.notes;
      saveSettings(); render(); toast("Backup imported");
    };
    rd.readAsText(file); e.target.value="";
  };
  $("#stClearQ").onclick = () => {
    if(!confirm(`Clear ${state.quotes.length} quotation${state.quotes.length===1?"":"s"} from this device's history?\n\nQuotations already saved to the team stay in Firestore and come back on the next sync. Issued numbers are never released.`)) return;
    state.quotes=[]; saveSettings(); render(); toast("Local quotation history cleared");
  };
  $("#stClearCache").onclick = async () => {
    if(!confirm("Clear this device's offline copy?\n\nThe app reloads and downloads itself again. Your prices, stock and settings are not touched.")) return;
    try{
      if("caches" in window){ for(const k of await caches.keys()) await caches.delete(k); }
      if(navigator.serviceWorker){ for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); }
      toast("Cache cleared — reloading");
      setTimeout(()=>location.reload(true), 700);
    }catch(e){ toast("Could not clear the cache: "+e.message); }
  };

  if(!admin) return;

  $("#stReset").onclick = () => {
    if(!confirmAction("Put the standard terms and notes back?\n\nNothing is saved until you press Save shared settings.")) return;
    state.terms=null; state.notes=null;
    $("#stTerms").value=TERMS.join("\n"); $("#stNotes").value=DEFAULT_NOTES.join("\n");
    $("#stPay").value=COMPANY_DEFAULTS.payTerms;
    $("#stWarranty").value=COMPANY_DEFAULTS.warranty;
    $("#stFooter").value=COMPANY_DEFAULTS.pdfFooter;
    toast("Standard wording restored — press Save to keep it");
  };

  /* pictures are stored as data, so they travel with the settings */
  const readImage = (input, key, max) => {
    const file=input.files[0]; if(!file) return;
    if(file.size > 1.5*1024*1024) return toast("Please use an image under 1.5 MB");
    const rd=new FileReader();
    rd.onload = () => {
      const img=new Image();
      img.onload = () => {
        const c=document.createElement("canvas");
        const r=Math.min(1, max/Math.max(img.width,img.height));
        c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        state.company=state.company||{};
        state.company[key]=c.toDataURL("image/png");
        saveSettings(); toast("Image set — press Save shared settings to publish it"); render();
      };
      img.onerror=()=>toast("That image could not be read");
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  };
  if($("#stLogoFile")) $("#stLogoFile").onchange = e => readImage(e.target,"logo",420);
  if($("#stQrFile"))   $("#stQrFile").onchange   = e => readImage(e.target,"qr",420);
  if($("#stLogoClear"))$("#stLogoClear").onclick = () => { state.company=state.company||{}; state.company.logo=""; saveSettings(); render(); };
  if($("#stQrClear"))  $("#stQrClear").onclick   = () => { state.company=state.company||{}; state.company.qr=""; saveSettings(); render(); };

  $("#stSave").onclick = async () => {
    const gst=+$("#stGst").value, valid=+$("#stValid").value;
    const nx=+$("#stNext").value, pd=+$("#stPad").value;
    const pre=$("#stPrefix").value.trim(), fy=$("#stFy").value.trim();
    const minq=+$("#stMin").value;
    const name=$("#stName").value.trim();
    if(!name) return toast("The company name cannot be blank");
    if(!pre) return toast("The quotation prefix cannot be blank");
    if(!/^[A-Za-z0-9][A-Za-z0-9\-]{0,11}$/.test(pre))
      return toast("The prefix can use letters, digits and hyphens only, up to 12 characters");
    if(!fy)  return toast("Set a financial year, for example 2026-27");
    if(!/^\d{4}-\d{2}$/.test(fy)) return toast("The financial year looks like 2026-27");
    if(isNaN(nx)||nx<1) return toast("The next number must be 1 or more");
    if(isNaN(gst)||gst<0||gst>28) return toast("GST must be between 0 and 28");
    if(isNaN(valid)||valid<1) return toast("Validity must be at least one day");
    if(isNaN(minq)||minq<0) return toast("The default reorder level cannot be negative");
    const gp = gstinProblem($("#stGstin").value.trim());
    if(gp) return toast(gp);
    const pp = phoneProblem($("#stPhone").value.trim().split(/[·,/]/)[0]);
    if(pp) return toast("Company phone: "+pp);
    const ep = emailProblem($("#stEmail").value.trim());
    if(ep) return toast("Company email: "+ep);

    const lastNo = state.numbering.lastIssued && String(state.numbering.lastIssued.no);
    if(lastNo && fy===state.numbering.fy){
      const lastSeq=parseInt(lastNo.split("/").pop(),10)||0;
      if(nx<=lastSeq) return toast(`${lastNo} has already been issued — the next number must be above ${lastSeq}`);
    }

    state.company = Object.assign({}, state.company, {
      name:$("#stName").value.trim(), tagline:$("#stTag").value.trim(),
      address:$("#stAddr").value.trim(), gstin:$("#stGstin").value.trim(),
      pan:$("#stPan").value.trim(), phone:$("#stPhone").value.trim(),
      email:$("#stEmail").value.trim(), web:$("#stWeb").value.trim(),
      bankName:$("#stBName").value.trim(), bankBranch:$("#stBBranch").value.trim(),
      bankAcc:$("#stBAcc").value.trim(), bankIfsc:$("#stBIfsc").value.trim(),
      upi:$("#stUpi").value.trim(),
      defaultGst:gst, defaultTier:$("#stTier").value, validityDays:valid,
      payTerms:$("#stPay").value.trim(),
      warranty:$("#stWarranty").value.trim(),
      pdfFooter:$("#stFooter").value.trim(),
      defaultMin:minq
    });
    Object.assign(state.numbering,{prefix:pre, fy, next:nx, pad:Math.min(6,Math.max(1,pd||3))});
    const t=$("#stTerms").value.split("\n").map(x=>x.trim()).filter(Boolean);
    const n=$("#stNotes").value.split("\n").map(x=>x.trim()).filter(Boolean);
    state.terms=t.length?t:null; state.notes=n.length?n:null;
    applyDefaultTier();
    saveSettings();

    const el=$("#qRef"); if(el && !isFinalised()) el.placeholder=nextPreview();
    if(usingFirebase()){
      try{ await fbSaveCompany(); await fbSaveNumbering(); toast("Saved and shared with the team"); }
      catch(e){ toast("Saved here, but not shared: "+friendlyAuthError(e)); }
    } else {
      toast("Settings saved on this device");
    }
    render();
  };
};

/* ========================= categories =========================
   Categories are metadata laid over the existing product keys. A product is
   still identified by "group|model", so stock entries, old quotations and
   history all keep working — only the shelf it sits on changes. */

const DEFAULT_CATEGORIES = [
  {id:"cat-sliding",  name:"Sliding Gate Motors",                  order:10},
  {id:"cat-swing",    name:"Swing Gate Motors",                    order:20},
  {id:"cat-shutter",  name:"Shutter Motors",                       order:30},
  {id:"cat-hsd",      name:"High-Speed Door Motors",               order:40},
  {id:"cat-boom",     name:"Boom Barriers",                        order:50},
  {id:"cat-garage",   name:"Garage Door Motors",                   order:60},
  {id:"cat-glass",    name:"Automatic/Glass Door Systems",         order:70},
  {id:"cat-acc",      name:"Gate Motor Accessories",               order:80},
  {id:"cat-sensor",   name:"Sensors & Safety Devices",             order:90},
  {id:"cat-control",  name:"Control Boards, Receivers & Remotes",  order:100},
  {id:"cat-hardware", name:"Gate Hardware",                        order:110},
  {id:"cat-other",    name:"Other Products",                       order:900}
];

/* Shelves that existed in earlier versions. A product an admin had filed on
   one of them keeps working; it simply lands on its nearest surviving shelf.
   The product id itself never changes, so stock and old quotations hold. */
const CATEGORY_ALIAS = {
  "cat-kits":    "cat-hardware",
  "cat-profile": "cat-hardware",
  "cat-service": "cat-other"
};
const catAlias = id => CATEGORY_ALIAS[id] || id;

/* Which shelf a group falls on when nothing more specific applies. */
const GROUP_CATEGORY = {
  gate:"cat-sliding", swing:"cat-swing", shuttermotor:"cat-shutter",
  directdrive:"cat-shutter", hsdmotor:"cat-hsd", hsdoor:"cat-hsd",
  hsdbuild:"cat-other", garage:"cat-garage", glass:"cat-glass",
  profile:"cat-hardware", kits:"cat-hardware", swingacc:"cat-acc", hsacc:"cat-acc",
  hwWheel:"cat-hardware", hwHinge:"cat-hardware", hwRoll:"cat-hardware",
  hwTrack:"cat-hardware", hwHang:"cat-hardware", hwCant:"cat-hardware"
};

/** Read model, name and description and decide where a product belongs. */
function classifyProduct(gid, model, name, spec){
  // What a product *is* comes from its model and name. The specification
  // describes what is in the box — a pedestrian gate kit that ships with a
  // control board is still a gate motor, so spec is only a weak last hint.
  const s = `${model} ${name}`.toLowerCase();
  const withSpec = `${model} ${name} ${spec||""}`.toLowerCase();

  // most specific first — a boom barrier is never just a gate motor
  if(/boom barrier|boom only|telescopic boom|road blocker/.test(s))            return "cat-boom";
  if(/photocell|radar motion|motion sensor|safety edge|loop detector|loop fence|loop wire|beam sensor|car[- ]?sens|car sensor|warning lamp|flashing lamp|rotary lamp|warning light/.test(s))
                                                                               return "cat-sensor";
  if(/pedestrian gate motor/.test(s))                                          return "cat-swing";
  if(/control board|control unit|control panel|controller|rfid|access control|keypad|fingerprint|password access|card access|gsm module|video door phone|wi-?fi|bluetooth|receiver|transmitter|remote/.test(s))
                                                                               return "cat-control";
  if(/loop 1ch|loop 2ch|push button/.test(s))                                  return "cat-control";
  if(/underground motor|articulated arm|roller drive|swing arm|swing gate motor/.test(s)) return "cat-swing";
  if(/sliding gate motor|brushless sliding|heavy industrial sliding/.test(s))  return "cat-sliding";
  if(/high[- ]speed door|hs series|direct drive rolling shutter/.test(s))      return /direct drive/.test(s) ? "cat-shutter" : "cat-hsd";
  if(/rolling shutter motor|shutter motor|tubular motor/.test(s))              return "cat-shutter";
  if(/garage door|sectional door|vision panel/.test(s))                        return "cat-garage";
  if(/glass door|toughened|frosted film/.test(s))                              return "cat-glass";
  if(/hardware kit|cantilever .*kit|telescopic gate hardware|bi-fold gate hardware/.test(s)) return "cat-hardware";
  if(/gear rack|rack kit|track|wheel|hinge|roller|bracket|stopper|end stop|carriage|trolley|tie rod|guide/.test(s))
                                                                               return "cat-hardware";
  if(/slat|side guide|bottom profile|end cap|velvet|polycarbonate|pc roll|connector|profile/.test(s)) return "cat-hardware";
  if(/installation|transport|curtain|shaft|top cover|packing box/.test(s))     return "cat-other";
  if(/remote|lock|battery|usb|spare|extra wheel|limit board/.test(s))          return "cat-acc";
  // nothing decisive in the name — allow the description one last say
  if(/gear rack|track|wheel|hinge/.test(withSpec))                             return "cat-hardware";

  return GROUP_CATEGORY[gid] || "cat-other";
}

/* ---------- the live list, with an admin's changes on top ---------- */
function categories(){
  const custom = state.categories || {};
  const base = DEFAULT_CATEGORIES.map(c => Object.assign({}, c, custom[c.id] || {}));
  Object.keys(custom).forEach(id => {
    if(!DEFAULT_CATEGORIES.some(c => c.id === id))
      base.push(Object.assign({id, name:id, order:500}, custom[id]));
  });
  return base.filter(c => !c.archived).sort((a,b) => (a.order||0) - (b.order||0) || a.name.localeCompare(b.name));
}
const categoryById = id => categories().find(c => c.id === id)
  || (DEFAULT_CATEGORIES.find(c => c.id === id))
  || {id:"cat-other", name:"Other Products / Needs categorisation", order:900};

/** The category a product sits in: an admin's choice, else the classifier. */
const catLive = id => categories().some(c => c.id === id);
function categoryOf(gid, it){
  const key = pid(gid, it.m);
  const set = catAlias((state.catOf || {})[key]);
  if(set) return catLive(set) ? set : "cat-other";     // archived shelf: fall to Other
  const L = label(gid, it);
  const guess = catAlias(classifyProduct(gid, L.m, L.n, it.spec));
  return catLive(guess) ? guess : "cat-other";
}

/** Re-file everything sitting on a category, and tell the team. */
async function moveCategoryProducts(fromId, toId){
  const moved = [];
  BOOK.groups.forEach(g => itemsOf(g.id).forEach(it => {
    const key = pid(g.id, it.m);
    const cur = catAlias((state.catOf||{})[key]) || catAlias(classifyProduct(g.id, label(g.id,it).m, label(g.id,it).n, it.spec));
    if(cur === fromId){
      state.catOf = state.catOf || {};
      state.catOf[key] = toId;                    // the product id itself never changes
      moved.push([g.id, it.m]);
    }
  }));
  saveSettings();
  if(moved.length && usingFirebase() && isAdmin()){
    try{ for(const [gid,m] of moved) await fbPushProduct(gid,m); }
    catch(e){ toast("Products re-filed here, but not for the team: "+friendlyAuthError(e)); }
  }
  return moved.length;
}
function setCategory(gid, m, catId){
  state.catOf = state.catOf || {};
  if(catId) state.catOf[pid(gid,m)] = catId; else delete state.catOf[pid(gid,m)];
  saveSettings();
  if(usingFirebase() && isAdmin()) fbPushProduct(gid,m).catch(()=>{});
}

/** Add one shelf from any management flow and share it with the team. */
function addCategory(name){
  name=String(name||"").trim();
  if(!name){ toast("Give the category a name"); return null; }
  if(categories().some(c=>norm(c.name)===norm(name))){ toast("A category with that name already exists"); return null; }
  const id="cat-"+norm(name).slice(0,24)+"-"+Date.now().toString(36).slice(-4);
  state.categories=state.categories||{};
  state.categories[id]={id,name,order:(categories().slice(-1)[0]?.order||500)+10};
  saveSettings();
  if(usingFirebase() && isAdmin()) fbPushCategories().catch(e=>toast("Category saved here but NOT shared: "+friendlyAuthError(e)));
  return state.categories[id];
}

/** Every visible product, already shelved. */
function catalogue(){
  const out = new Map();
  categories().forEach(c => out.set(c.id, {cat:c, items:[]}));
  const seen = new Set();
  BOOK.groups.forEach(g => visibleItems(g.id).forEach(it => {
    const key = pid(g.id, it.m);
    const modelKey = norm(label(g.id,it).m);
    if(seen.has(key) || seen.has("m:"+modelKey)) return;   // an exact model appears once
    seen.add(key); seen.add("m:"+modelKey);
    const cid = categoryOf(g.id, it);
    if(!out.has(cid)) out.set(cid, {cat:categoryById(cid), items:[]});
    out.get(cid).items.push({g, it, id:key});
  }));
  return [...out.values()].sort((a,b) => (a.cat.order||0)-(b.cat.order||0));
}

    <div class="card-bd">
      ${admin ? "" : `<div class="note">You are signed in as staff, so this list is read-only.</div>`}
      <p class="hint" style="margin:0 0 14px">Renaming or reordering a category never changes a product's
      identity, so stock figures and past quotations stay attached to it.</p>
      <div id="catList"></div>
      ${admin ? `<div class="grid g2" style="margin-top:14px">
        <label class="f"><span>New category name</span>
          <input type="text" id="catNew" placeholder="e.g. Fire-rated shutters"></label>
        <label class="f"><span>&nbsp;</span><button class="btn pri" id="catAdd">Add category</button></label>
      </div>` : ""}
    </div></div>`;
};

V.categories.wire = () => {
  const admin = isAdmin() || !fbConfigured();
  const counts = () => {
    const m={}; catalogue().forEach(({cat,items})=>m[cat.id]=items.length); return m;
  };
  const drawCats = () => {
    const box=$("#catList"); if(!box) return;
    const n=counts(), all=categories();
    const archived=Object.entries(state.categories||{}).filter(([,v])=>v.archived).map(([id,v])=>({id,...v}));
    box.innerHTML = `<div class="plist">${all.map((c,i)=>`
      <div class="catrow">
        <div class="nm"><b>${esc(c.name)}</b><span class="meta">${n[c.id]||0} product${(n[c.id]||0)===1?"":"s"}</span></div>
        ${admin?`<div class="practs">
          <button class="btn gh sm" data-cmove="${esc(c.id)}" data-d="-1" ${i===0?"disabled":""} aria-label="Move up">&uarr;</button>
          <button class="btn gh sm" data-cmove="${esc(c.id)}" data-d="1" ${i===all.length-1?"disabled":""} aria-label="Move down">&darr;</button>
          <button class="btn gh sm" data-cren="${esc(c.id)}">Rename</button>
          <button class="btn gh sm" data-carch="${esc(c.id)}">Archive</button>
        </div>`:""}
      </div>`).join("")}
      ${archived.map(c=>`<div class="catrow archived">
        <div class="nm"><b>${esc(c.name||c.id)}</b><span class="meta">archived</span></div>
        ${admin?`<div class="practs"><button class="btn gh sm" data-cunarch="${esc(c.id)}">Restore</button></div>`:""}
      </div>`).join("")}</div>`;
  };
  V.categories.repaint = drawCats;

  const saveCats = () => {
    saveSettings();
    if(usingFirebase()){
      if(!isAdmin()) toast("Saved on this device — only an administrator can share category changes");
      else fbPushCategories()
        .catch(e=>toast("Category change saved here but NOT shared: "+friendlyAuthError(e)));
    }
    drawCats();
  };
  drawCats();
  if(!admin) return;

  $("#catAdd").onclick = () => {
    const name=$("#catNew").value.trim();
    if(!addCategory(name)) return;
    $("#catNew").value="";
    drawCats(); toast(`${name} added to Products`);
  };

  $("#catList").addEventListener("click", e=>{
    const mv=e.target.closest("[data-cmove]"), rn=e.target.closest("[data-cren]"),
          ar=e.target.closest("[data-carch]"), un=e.target.closest("[data-cunarch]");
    const id=(mv||rn||ar||un)?.dataset[mv?"cmove":rn?"cren":ar?"carch":"cunarch"]; if(!id) return;
    state.categories=state.categories||{};
    const cur=categoryById(id);
    const patch=(p)=>{ state.categories[id]=Object.assign({id, name:cur.name, order:cur.order}, state.categories[id], p); };

    if(mv){
      const list=categories(), i=list.findIndex(c=>c.id===id), j=i+ +mv.dataset.d;
      if(j<0 || j>=list.length) return;
      const a=list[i], b=list[j];
      patch({order:b.order});
      state.categories[b.id]=Object.assign({id:b.id, name:b.name}, state.categories[b.id], {order:a.order});
      saveCats(); return;
    }
    if(rn){
      openModal("Rename category", `<label class="f"><span>Category name</span>
        <input id="crN" value="${esc(cur.name)}"></label>`, {
        onSave: box => {
          const tt=box.querySelector("#crN").value.trim();
          if(!tt){ toast("The name cannot be blank"); return false; }
          if(categories().some(c=>c.id!==id && norm(c.name)===norm(tt))){ toast("That name is already used"); return false; }
          patch({name:tt}); saveCats(); toast("Category renamed");
        }
      });
      return;
    }
    if(ar){
      const n=counts()[id]||0;
      if(!confirmAction(`Archive ${cur.name}?${n?`\n\nIt still holds ${n} product${n===1?"":"s"}; they move to “Other Products”. Model numbers, stock and past quotations are untouched.`:""}`)) return;
      patch({archived:true});
      moveCategoryProducts(id, "cat-other").then(k=>{
        saveCats();
        toast(k ? `${cur.name} archived · ${k} product${k===1?"":"s"} moved to Other Products` : `${cur.name} archived`);
      });
      return;
    }
    if(un){
      patch({archived:false}); saveCats();
      toast(`${cur.name} restored — re-file products into it above`);
    }
  });
};

V.catalogue = () => `<div class="card">
  <div class="card-hd"><h2>Products</h2>
    <p>Every product, on its own shelf. Search across the lot, or open a category.</p></div>
  <div class="card-bd">
    <div class="searchbar sticky">
      <input type="search" id="catQ" placeholder="Search all products" aria-label="Search all products">
      <button class="clearq" id="catClear" hidden aria-label="Clear search">&times;</button>
    </div>
    <div id="catBody"></div>

    <h3 class="sect">Calculators</h3>
    <p class="hint" style="margin:0 0 12px">For anything priced by size rather than by model.</p>
    <div class="calcgrid">
      ${CALCULATORS.map(([v,n,d])=>`<button class="calccard" data-v="${v}">
        <b>${esc(n)}</b><span>${esc(d)}</span></button>`).join("")}
    </div>
  </div></div>`;

V.catalogue.wire = () => {
  const draw = () => {
    const q=($("#catQ").value||"").toLowerCase().trim();
    $("#catClear").hidden=!q;
    const shelves=catalogue();

    if(q){
      const hits=[];
      shelves.forEach(({cat,items})=>items.forEach(({g,it})=>{
        const L=label(g.id,it);
        if((L.m+" "+L.n+" "+(it.spec||"")+" "+cat.name).toLowerCase().includes(q)) hits.push({cat,g,it});
      }));
      if(!hits.length){
        $("#catBody").innerHTML=`<div class="empty"><b>No products found</b><br>Nothing matches “${esc(q)}”.</div>`;
        return;
      }
      $("#catBody").innerHTML=`<p class="reshead">${hits.length} product${hits.length>1?"s":""} matching “${esc(q)}”</p>
        <div class="plist">${hits.slice(0,300).map(({cat,g,it})=>
          productCard(g,it).replace('<span>','<span class="cat-of">'+esc(cat.name)+'</span><span>')).join("")}</div>`;
      return;
    }

    $("#catBody").innerHTML = shelves.map(({cat,items})=>`
      <details class="cat" data-cat="${esc(cat.id)}"${state.catOpen[cat.id]?" open":""}>
        <summary><span class="cname">${esc(cat.name)}</span><span class="cnt">${items.length}</span></summary>
        <div class="plist">${items.length?items.map(({g,it})=>productCard(g,it)).join(""):
          `<div class="empty compact"><b>No products in this category yet</b><br>Add one from Products &amp; Categories.</div>`}</div>
      </details>`).join("");
  };
  V.catalogue.repaint = draw;

  $("#catQ").addEventListener("input", draw);
  $("#catClear").onclick = () => { $("#catQ").value=""; draw(); $("#catQ").focus(); };

  const host=$("#catBody");
  const flash = card => { card.classList.remove("just"); void card.offsetWidth; card.classList.add("just"); };

  host.addEventListener("click", e=>{
    const add=e.target.closest("[data-padd]");
    if(add){
      const card=add.closest("[data-pk]");
      // Adding an existing product raises its line; it never makes a second one.
      if(qtyInQuote(card.dataset.pk) > 0) toast("Already in the quotation \u2014 quantity raised");
      changeQty(card.dataset.pk, 1);
      flash(card);
      return;
    }
    const step=e.target.closest("[data-pd]");
    if(step){
      const card=step.closest("[data-pk]");
      changeQty(card.dataset.pk, +step.dataset.pd);
      flash(card);
    }
  });
  host.addEventListener("change", e=>{
    const box=e.target.closest("[data-pq]");
    if(box){
      const card=box.closest("[data-pk]"), v=+box.value;
      if(isNaN(v)||v<0){ toast("Quantity cannot be negative"); syncQty(); return; }
      changeQty(card.dataset.pk, 0, v);
    }
  });
  host.addEventListener("toggle", e=>{
    const d=e.target.closest(".cat");
    if(d){ state.catOpen[d.dataset.cat]=d.open; saveSettings(); }
  }, true);

  draw();
};

function navLabel(v){
  const hit=[...NAV_MAIN,...NAV_MORE].find(x=>x[0]===v);
  if(hit) return hit[1];
  const calc=CALCULATORS.find(c=>c[0]===v);
  return calc ? calc[1] : "";
}
/** Which bottom-bar slot should light up for the view we are on. */
function navActive(){
  if(NAV_MORE.some(x=>x[0]===state.view)) return "more";
  if(NAV_MAIN.some(x=>x[0]===state.view)) return state.view;
  return "catalogue";                       // calculators live under Products
}

/* ---------- the drawer ---------- */
function openDrawer(on){
  if(on && typeof sheetOpen==="function" && sheetOpen()) closeSheet();
  const d=$("#drawer"), s=$("#drawerScrim");
  d.classList.toggle("open", on);
  s.classList.toggle("on", on);
  d.setAttribute("aria-hidden", on?"false":"true");
  const btn=$("[data-drawer]"); if(btn) btn.setAttribute("aria-expanded", on?"true":"false");
  if(on){ const f=d.querySelector(".drawitem:not([hidden])"); if(f) f.focus(); }
  document.body.classList.toggle("drawer-open", on);
}

/* ---------- back to top ---------- */
function initBackTop(){
  const b=$("#toTop");
  const onScroll=()=>{ b.classList.toggle("on", (window.scrollY||0) > 420); };
  window.addEventListener("scroll", onScroll, {passive:true});
  b.onclick=()=>{ try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){ window.scrollTo(0,0); } };
  onScroll();
}

    <p>What this app is, what it stores and the terms it is used under.</p></div>
  <div class="card-bd">
    <div class="aboutmark">
      <img src="${BRAND.full}" alt="SMARTIE Quote Desk" width="190">
      <div><b>SMARTIE Quote Desk</b>
        <span>Developed for Smart India Enterprises</span>
        <span><a href="https://smartie.in" target="_blank" rel="noopener">smartie.in</a> · Version ${APP_VERSION}</span></div>
    </div>

    <details class="legal" open><summary>Privacy</summary>
      <p>This app stores your quotations, price book, stock figures and purchase
      requirements <b>on the device you are using</b>. Nothing leaves the device unless
      team sync has been switched on.</p>
      <p>When team sync is configured, the following is shared with your colleagues so
      that shared records make sense: the name you enter, what you changed, and when you
      changed it. That information is used only for signing in, keeping records
      accountable, syncing between devices, and running Smart India Enterprises
      internally. It is not sold, not used for advertising, and not shared outside the
      company.</p>
      <p>Client names, sites and GSTINs typed into a quotation are stored the same way as
      the rest of the quotation and are your responsibility to handle appropriately.</p>
      <p>Stock movements, purchase requirements and quotations record the name and account
      of whoever made the change, together with the time it was made, so the team can see
      who did what.</p>
      <p>To remove everything held on a device, use <b>Clear this device's cache</b> in

      <p>Rates shown are working figures. A quotation becomes an offer only when it is

/* Catalogue first — that is what most quotes are built from. Then the
   size-driven calculators, then the price book. */
const TABS = [
  ["motors","Motors & access"], ["hardware","Gate hardware"], ["search","Find a rate"],
  ["|",""],
  ["shutter","Rolling shutter"], ["hsd","High-speed door"], ["garage","Garage door"], ["glass","Glass door"],
  ["|",""],
  ["stock","Stock"], ["purchase","Purchase"], ["products","Products"],
  ["|",""],
  ["customers","Customers"], ["history","History"],
  ["|",""],
  ["settings","Settings"], ["team","Team"], ["about","About"]
];

function render(){
  updateBack();
  const productHome = state.view === "catalogue";
  document.body.classList.toggle("quote-bar-visible", productHome);
  $("#qbar").setAttribute("aria-hidden", productHome ? "false" : "true");
  renderNav();
  // a calculator is a place inside the catalogue, so the trail says so
  const calc = CALCULATORS.find(c=>c[0]===state.view);
  $("#crumb").innerHTML = calc
    ? `<button class="crumb-up" data-nav="catalogue">Products</button>
       <span class="crumb-sep">/</span><span class="crumb-here">${esc(calc[1])}</span>`
    : `<span class="crumb-here">${esc(navLabel(state.view) || "Quote Desk")}</span>`;
  $("#work").innerHTML = V[state.view]();
  if(V[state.view].wire) V[state.view].wire();
  renderDocket();
  paintChip();
}

document.addEventListener("click", e=>{
  const nv=e.target.closest("[data-nav]");
  if(nv){
    openDrawer(false);
    if(nv.dataset.nav==="quote"){
      if(sheetOpen()) closeSheet(); else showSheet();   // the tab toggles it
      return;
    }
    goView(nv.dataset.nav);
    return;
  }
  if(e.target.closest("[data-drawer]")){ openDrawer(!$("#drawer").classList.contains("open")); return; }
  const t=e.target.closest("[data-v]");
  if(t){ goView(t.dataset.v); return; }
  const qt=e.target.closest("[data-qtier]");
  if(qt){ setTier(qt.dataset.qtier); return; }
  const tier=e.target.closest("[data-tier]");
  if(tier){ setTier(tier.dataset.tier); return; }

  }
});

const PDF_SRC = [
  "jspdf.umd.min.js",                       // shipped alongside the app; works offline
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
  "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",
  "https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"
];
function loadScript(urls, ready){
  return new Promise((resolve,reject)=>{
    if(ready()) return resolve();
    let i=0;
    const next = () => {
      if(i>=urls.length) return reject(new Error("no source reachable"));
      const s=document.createElement("script");
      s.src=urls[i++];
      s.onload=()=> ready() ? resolve() : next();
      s.onerror=()=>{ s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}

/** Manrope is embedded as a subset; map the few marks it doesn't carry. */
function pdfSafe(s){
  return String(s==null?"":s)
    .replace(/[\u2018\u2019\u2032]/g,"'").replace(/[\u201c\u201d\u2033]/g,'"')
    .replace(/\u2713|\u2714/g,"")
    .replace(/\u2264/g,"<=").replace(/\u2265/g,">=")
    .replace(/\u2192/g,"->").replace(/\u2026/g,"...");
}
const rs = v => "\u20b9" + Math.round(v||0).toLocaleString("en-IN");
let FONTS_READY=false;
function useFonts(doc){
  if(!PDF_FONT || !PDF_FONT.reg) return false;
  try{
    doc.addFileToVFS("Manrope-Regular.ttf", PDF_FONT.reg);
    doc.addFont("Manrope-Regular.ttf","Manrope","normal");
    doc.addFileToVFS("Manrope-Bold.ttf", PDF_FONT.bold);
    doc.addFont("Manrope-Bold.ttf","Manrope","bold");
    return true;
  }catch(e){ return false; }
}

function pdfName(){
  const ref=$("#qRef").value.trim(), cl=$("#qClient").value.trim();
  let bit=(ref||cl||"quotation").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  bit=bit.replace(/^SIE-/i,"");
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `SIE-${bit}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.pdf`;
}

function buildPdfDoc(jsPDF, sizes){
  const FIRM = firmNow();                 // whatever Settings currently says
  const doc = new jsPDF({unit:"mm", format:"a4", compress:true});
  const M=12, W=186, PW=210, PH=297, BOT=PH-M-6;
  const FAM = useFonts(doc) ? "Manrope" : "helvetica";
  const F=(w,s)=>{ doc.setFont(FAM, w==="italic"?"normal":w); doc.setFontSize(s); };
  const ink=(g=0)=>doc.setTextColor(g);
  let y=M;

  const need = h => { if(y+h > BOT){ doc.addPage(); y=M; return true; } return false; };

  /* ---------- letterhead ---------- */
  const lw=27, lh=lw*sizes.logo.h/sizes.logo.w;
  doc.addImage(logoNow(),"PNG",M,y,lw,lh);
  const tx=M+lw+6, tw=W-lw-6;
  F("bold",15); ink(15);
  doc.text(pdfSafe(FIRM.name), tx, y+5.4);
  let ly=y+10;
  F("normal",7.4); ink(70);
  [FIRM.tag, FIRM.addr, FIRM.phones, FIRM.email+"  |  "+FIRM.web].forEach(t=>{
    doc.splitTextToSize(pdfSafe(t), tw).forEach(l=>{ doc.text(l,tx,ly); ly+=3.3; });
  });
  F("bold",7.4); ink(25);
  doc.text(pdfSafe("GSTIN  "+FIRM.gstin+"          PAN  "+FIRM.pan), tx, ly); ly+=3.3;
  y=Math.max(y+lh, ly)+1.5;
  doc.setDrawColor(76,29,149); doc.setLineWidth(0.9); doc.line(M,y,M+W,y); y+=6;

  /* ---------- title ---------- */
  F("bold",12.5); doc.setTextColor(76,29,149);
  doc.text("QUOTATION", PW/2, y, {align:"center"}); y+=5;

  /* ---------- detail box ---------- */
  const P = partyFromForm();
  const meta=[
    ["QUOTATION NO", $("#qRef").value.trim() || "Draft \u2014 not yet issued"],
    ["DATE", new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"})],
    ["CLIENT", P.name],
    ["CONTACT", P.contact],
    ["PHONE", P.phone],
    ["EMAIL", P.email],
    ["ADDRESS", P.address],
    ["SITE", P.site],
    ["CLIENT GSTIN", P.gstin],
    ["RATE BASIS", TIERNAME[state.tier].replace(" rate","")+"  |  list "+state.rev]
  ].filter(([k,v])=>v);                    // no empty rows
  const mh=Math.ceil(meta.length/2)*5.2+3.5;
  doc.setLineWidth(0.3); doc.setDrawColor(216,204,245);
  doc.setFillColor(248,247,252); doc.rect(M,y,W,mh,"FD");
  meta.forEach((r,i)=>{
    const col=i%2, row=(i-col)/2;
    const x=M+3.5+col*(W/2), yy=y+5.6+row*5.2;
    F("bold",6.8); ink(90); doc.text(r[0], x, yy);
    F("normal",8.6); ink(10);
    doc.text(doc.splitTextToSize(pdfSafe(r[1]), W/2-32)[0], x+27, yy);
  });
  y+=mh+4.5;

  /* ---------- items ----------
     Four columns, and the header is redrawn at the top of every page the
     table runs on to. Nothing is allowed to straddle a page break. */
  const C=[8,84,20,34,40], CX=[M, M+8, M+92, M+112, M+146];
  const thead=()=>{
    doc.setFillColor(237,233,254); doc.rect(M,y,W,7,"F");     // light purple band
    doc.setDrawColor(76,29,149); doc.setLineWidth(0.5);
    doc.line(M,y,M+W,y); doc.line(M,y+7,M+W,y+7);
    F("bold",6.9); doc.setTextColor(76,29,149);
    doc.text("S.NO", CX[0]+2, y+4.6);
    doc.text("DESCRIPTION", CX[1]+2, y+4.6);
    doc.text("QTY", CX[2]+C[2]-2, y+4.6, {align:"right"});
    doc.text("RATE", CX[3]+C[3]-2, y+4.6, {align:"right"});
    doc.text("AMOUNT", CX[4]+C[4]-2, y+4.6, {align:"right"});
    y+=7;
  };
  thead();

  itemLines().forEach((l,i)=>{
    F("normal",8.8);
    const tt=doc.splitTextToSize(pdfSafe(l.t), C[1]-4);
    F("normal",7.1);
    const ss=l.s ? doc.splitTextToSize(pdfSafe(l.s), C[1]-4) : [];
    const h=Math.max(tt.length*3.9 + ss.length*3.05 + 3.6, 9);
    if(y+h>BOT-4){ doc.addPage(); y=M; thead(); }             // header repeats
    let ty=y+4.4;
    F("normal",8.8); ink(15);
    doc.text(String(i+1), CX[0]+2, ty);
    tt.forEach(line=>{ doc.text(line, CX[1]+2, ty); ty+=3.9; });
    if(ss.length){ F("normal",7.1); ink(80); ss.forEach(line=>{ doc.text(line, CX[1]+2, ty); ty+=3.05; }); }
    F("normal",8.8); ink(15);
    doc.text(pdfSafe(qLabel(l)), CX[2]+C[2]-2, y+4.4, {align:"right"});
    doc.text(rs(l.rate),          CX[3]+C[3]-2, y+4.4, {align:"right"});
    doc.text(rs(amtOf(l)),        CX[4]+C[4]-2, y+4.4, {align:"right"});
    doc.setDrawColor(205); doc.setLineWidth(0.15); doc.line(M,y+h,M+W,y+h);
    y+=h;
  });

  /* ---------- totals ---------- */
  const pctPdf=gstPercent();
  const tr=transportAmt();
  const items=itemLines().reduce((a,l)=>a+amtOf(l),0);
  const sub=items+tr, gst=state.gst?sub*gstRate():0, tot=sub+gst;
  need(40); y+=3;
  const bw=92, bx=M+W-bw;
  const trow=(lbl,val,bold)=>{
    F(bold?"bold":"normal", bold?11:9); ink(bold?0:45);
    doc.text(pdfSafe(lbl), bx+3, y+4.6);
    doc.text(pdfSafe(val), bx+bw-3, y+4.6, {align:"right"});
    y+=bold?7.2:5.6;
  };
  if(tr>0){
    trow("Items total", rs(items));
    trow("Transportation" + (state.transport.note ? " (" + state.transport.note + ")" : ""), rs(tr));
  }
  trow("Subtotal", rs(sub));
  trow(state.gst?`GST ${pctPdf}%`:"GST", state.gst?rs(gst):"Not included");
  doc.setDrawColor(76,29,149); doc.setLineWidth(0.5); doc.line(bx,y,bx+bw,y); y+=1;
  trow("GRAND TOTAL", rs(tot), true);
  doc.setLineWidth(0.7); doc.line(bx,y,bx+bw,y); y+=5;
  F("italic",7.6); ink(60);
  doc.splitTextToSize(pdfSafe(words(tot)), W).forEach(line=>{
    doc.text(line, M+W, y, {align:"right"}); y+=3.6;
  });
  y+=1.6;

  /* ---------- validity, payment terms and warranty ---------- */
  const vLines = [
    ["Validity", `Rates hold for ${CO("validityDays")} days from the date of this quotation.`],
    ["Payment terms", CO("payTerms")],
    ["Warranty", CO("warranty")]
  ].filter(r=>String(r[1]||"").trim());
  if(vLines.length){
    F("normal",7);
    const wrapped = vLines.map(([k,v])=>[k, doc.splitTextToSize(pdfSafe(v), W-36)]);
    const vH = wrapped.reduce((a,[,ls])=>a+Math.max(ls.length*3.2, 3.2), 0) + 8;
    need(vH+2);
    doc.setDrawColor(76,29,149); doc.setLineWidth(0.3); doc.rect(M,y,W,vH);
    let vy = y+5.4;
    wrapped.forEach(([k,ls])=>{
      F("bold",6.8); doc.setTextColor(76,29,149); doc.text(k.toUpperCase(), M+3.5, vy);
      F("normal",7.2); ink(25);
      ls.forEach(line=>{ doc.text(line, M+32, vy); vy+=3.2; });
      vy += 0.9;
    });
    y += vH+3;
  }

  /* ---------- notes & terms ----------
     Two columns when they fit on one page, otherwise a single flowing block
     that breaks cleanly rather than running off the bottom of the sheet. */
  const N=notesList().map(pdfSafe), T=termsList().map(pdfSafe);
  const nW=64, tW=W-nW;
  F("normal",6.5);
  const nLines=[], tLines=[];
  N.forEach(x=>doc.splitTextToSize("- "+x, nW-7).forEach(l=>nLines.push(l)));
  T.forEach((x,i)=>doc.splitTextToSize((i+1)+". "+x, tW-7).forEach(l=>tLines.push(l)));
  const boxH=Math.max(nLines.length, tLines.length)*2.85 + 9;

  if(boxH <= BOT-M){
    need(boxH+2);
    doc.setDrawColor(76,29,149); doc.setLineWidth(0.3);
    doc.rect(M,y,nW,boxH); doc.rect(M+nW,y,tW,boxH);
    F("bold",7); doc.setTextColor(76,29,149);
    doc.text("NOTES", M+3.5, y+5);
    doc.text("TERMS & CONDITIONS", M+nW+3.5, y+5);
    F("normal",6.5); ink(35);
    nLines.forEach((l,i)=>doc.text(l, M+3.5, y+8.6+i*2.85));
    tLines.forEach((l,i)=>doc.text(l, M+nW+3.5, y+8.6+i*2.85));
    y+=boxH+3;
  } else {
    const flow=(heading, lines)=>{
      need(10);
      F("bold",7); doc.setTextColor(76,29,149); doc.text(heading, M, y+4); y+=6;
      F("normal",6.6); ink(35);
      lines.forEach(l=>{ if(need(3.4)){ F("normal",6.6); ink(35); } doc.text(l, M+2, y+2.4); y+=2.95; });
      y+=3;
    };
    flow("NOTES", nLines);
    flow("TERMS & CONDITIONS", tLines);
  }

  /* ---------- bank, QR, signature ---------- */
  const payH=27, qrW=52, bkW=W-qrW;
  // the footer line sits at PH-7, so this block may run closer to the edge
  if(y + payH + 19 + 2 > PH - M - 1){ doc.addPage(); y=M; }
  doc.setLineWidth(0.5); doc.setDrawColor(0);
  doc.rect(M,y,W,payH); doc.line(M+bkW,y,M+bkW,y+payH);
  F("bold",6.9); doc.setTextColor(76,29,149); doc.text("BANK DETAILS", M+3.5, y+5);
  const B=FIRM.bank;
  [["Name",B.name],["Bank",B.branch],["Account no",B.acc],["IFSC code",B.ifsc],["UPI ID",B.upi]]
    .forEach((r,i2)=>{
      const yy=y+9+i2*3.6;
      F("normal",7.2); ink(90); doc.text(r[0], M+3.5, yy);
      F("bold",7.6); ink(10); doc.text(pdfSafe(r[1]), M+26, yy);
    });
  F("bold",6.9); doc.setTextColor(76,29,149);
  doc.text("SCAN TO PAY", M+bkW+3.5, y+5);
  doc.addImage(qrNow(),"PNG", M+bkW+(qrW-16)/2, y+5.8, 16, 16);
  F("normal",5.4); ink(85);
  doc.text("PhonePe / GPay / Paytm / any UPI app", M+bkW+qrW/2, y+payH-1.9, {align:"center"});
  y+=payH;

  const sh=19, sigCell=72, scx=M+W-sigCell;
  doc.setLineWidth(0.5); doc.rect(M,y,W,sh); doc.line(scx,y,scx,y+sh);
  const sw=20, shh=sw*sizes.sig.h/sizes.sig.w;
  doc.addImage(ASSET.sig,"PNG", scx+(sigCell-sw)/2, y+0.8, sw, shh);
  F("normal",7); ink(60);
  doc.text("Authorised signatory for", scx+sigCell/2, y+sh-4.7, {align:"center"});
  F("bold",7.6); ink(10);
  doc.text(pdfSafe(FIRM.name), scx+sigCell/2, y+sh-1.6, {align:"center"});
  F("normal",7); ink(60);
  doc.text("Accepted for " + pdfSafe($("#qClient").value.trim() || "the client"), M+3.5, y+5.5);
  doc.setDrawColor(150); doc.setLineWidth(0.25);
  doc.line(M+3.5, y+sh-5.5, M+3.5+62, y+sh-5.5);
  F("normal",6.4); ink(95);
  doc.text("Signature & date", M+3.5, y+sh-2.2);
  y+=sh+4;

  /* ---------- page numbers and the footer note ---------- */
  const pages=doc.getNumberOfPages();
  const footNote = String(CO("pdfFooter")||"").trim();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);
    doc.setDrawColor(216,204,245); doc.setLineWidth(0.25);
    doc.line(M, PH-10.5, M+W, PH-10.5);
    F("normal",6.6); ink(105);
    const left = pdfSafe((footNote ? footNote + "   |   " : "") + FIRM.web);
    doc.text(doc.splitTextToSize(left, W-26)[0], M, PH-7);
    doc.text(`Page ${p} of ${pages}`, M+W, PH-7, {align:"right"});
  }
  return doc;
}

async function downloadQuotePdf(){
  const b=$("#btnPdf"), was=b.textContent, mask=$("#pdfmask");
  b.disabled=true; b.textContent="Preparing\u2026";
  mask.classList.add("on");
  try{
    await loadScript(PDF_SRC, ()=> window.jspdf && window.jspdf.jsPDF);
    const doc = buildPdfDoc(window.jspdf.jsPDF, ASSET.size);
    doc.save(pdfName());
    closeSheet();
    toast("Quotation saved as PDF");
  }catch(err){
    toast("Could not build the PDF \u2014 use Print and choose Save as PDF", "Print", ()=>{
      buildPrint(); setTimeout(()=>window.print(),60);
    });
  }finally{
    mask.classList.remove("on");
    b.disabled=false; b.textContent=was;
  }
}

/** One gate in front of every action that issues a quotation. */
async function ensureFinalised(){
  if(!quoteLines().length){ toast("Add a line to the quotation first"); return false; }
  if(isFinalised()) return true;                 // same quotation keeps its number
  const blank=state.lines.filter(l=>!(l.rate>0));
  if(blank.length && !confirmAction(
      `${blank.length} line${blank.length>1?"s have":" has"} no rate:\n\n\u2022 ${blank.slice(0,4).map(l=>l.t).join("\n\u2022 ")}`+
      `${blank.length>4?"\n\u2022 …":""}\n\nContinue anyway?`)) return false;
  const P0 = partyFromForm();
  const g0 = gstinProblem(P0.gstin); if(g0){ toast("Client GSTIN: "+g0); return false; }
  const h0 = phoneProblem(P0.phone); if(h0){ toast("Client phone: "+h0); return false; }
  return !!(await finaliseQuote());
}

$("#btnPrint").onclick = async () => {
  if(!await ensureFinalised()) return;
  buildPrint(); closeSheet(); setTimeout(()=>window.print(), 60);
};
$("#btnWa").onclick = async () => {
  if(!await ensureFinalised()) return;
  const ok = await copyText(quoteText());
  if(ok) closeSheet();
  toast(ok ? "Quotation copied — paste it into WhatsApp" : "Copy failed — try Print instead");
};

/* ---------- installing, updating and working offline ----------
   The button only appears when the browser actually offers an install, and
   never inside an already-installed window. Browsers that do not support
   installing (iPhone Safari) simply never fire the event, so it stays hidden. */
let installPrompt=null;
const INSTALLED_FLAG = "smartie.installed";
/** Remembered across restarts, so the option never comes back once installed. */
let installedAlready = (()=>{ try{ return localStorage.getItem(INSTALLED_FLAG)==="1"; }catch(e){ return false; } })();
function markInstalled(){
  installedAlready = true;
  try{ localStorage.setItem(INSTALLED_FLAG,"1"); }catch(e){}
}
const isStandalone = () =>
  (window.matchMedia && ["standalone","fullscreen","minimal-ui"]
     .some(m => window.matchMedia(`(display-mode: ${m})`).matches)) ||
  window.navigator.standalone === true ||
  document.referrer.startsWith("android-app://");

/** The install control lives in the More drawer and nowhere else. */
function showInstall(on){
  const b = $("#drawInstall");
  if(!b) return;
  b.hidden = !on || !installPrompt || isStandalone() || installedAlready;
}
/* Chrome can tell us the app is already installed even when the page is
   opened in a normal tab, which is the case the earlier check missed. */
async function checkInstalled(){
  try{
    if(navigator.getInstalledRelatedApps){
      const apps = await navigator.getInstalledRelatedApps();
      if(apps && apps.length){ installedAlready = true; showInstall(false); }
    }
  }catch(e){ /* not supported — fall back to the display-mode check */ }
}

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  if(isStandalone() || installedAlready) return;
  installPrompt=e; showInstall(true);
}, {once:false});
/** The drawer is rebuilt on every render, so the handler is attached there. */
function wireInstall(){
  const btn=$("#drawInstall"); if(!btn) return;
  btn.onclick = async () => {
    if(!installPrompt){ showInstall(false); return; }
    installPrompt.prompt();
    let outcome="dismissed";
    try{ ({outcome} = await installPrompt.userChoice); }catch(e){}
    installPrompt=null;
    if(outcome==="accepted"){ markInstalled(); toast("Installed — open it from your home screen"); }
    showInstall(false);          // Chrome discards a used prompt either way
    openDrawer(false);
  };
  showInstall(!!installPrompt);
}
window.addEventListener("appinstalled", ()=>{
  installPrompt=null; markInstalled(); showInstall(false);
});
if(window.matchMedia){
  window.matchMedia("(display-mode: standalone)").addEventListener?.("change", ()=>showInstall(!!installPrompt));
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) showInstall(!!installPrompt); });
if(isStandalone()) markInstalled();     // running installed proves it is installed
showInstall(false);
checkInstalled();

/** Is there work on screen that a reload would interrupt? */
function hasUnsavedWork(){
  if(isFinalised()) return false;
  if(state.lines.length) return true;
  if(transportAmt() > 0) return true;
  return Object.values(partyFromForm()).some(Boolean);
}

let waitingWorker = null;
function showUpdateBar(worker){
  waitingWorker = worker || waitingWorker;
  const bar = $("#updbar"); if(!bar) return;
  bar.querySelector("span").textContent = hasUnsavedWork()
    ? "Update available \u2014 finish this quotation first"
    : "Update available";
  bar.classList.add("on");
}
function applyUpdate(){
  if(hasUnsavedWork() && !confirmAction(
      "This quotation has not been finalised yet.\n\nRefreshing keeps the draft on this device, but the page reloads now. Continue?")) return;
  try{ if(waitingWorker) waitingWorker.postMessage("skipWaiting"); }catch(e){}
  setTimeout(()=>location.reload(), 180);
}

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  const later = $("#updLater"), now = $("#updNow");
  if(now)   now.onclick   = applyUpdate;
  if(later) later.onclick = () => { $("#updbar").classList.remove("on"); };

  window.addEventListener("load", ()=>{
    // "sw.js" stays relative, so the app works under /quote-desk/ on GitHub Pages
    navigator.serviceWorker.register("sw.js").then(reg=>{
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg.waiting);
      reg.addEventListener("updatefound", ()=>{
        const nw=reg.installing;
        nw && nw.addEventListener("statechange", ()=>{
          // a first install has no controller: that is not an update, it is the app
          if(nw.state==="installed" && navigator.serviceWorker.controller) showUpdateBar(nw);
        });
      });
      setInterval(()=>{ reg.update().catch(()=>{}); }, 60*60*1000);
    }).catch(()=>{ /* opened as a plain file */ });

    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(reloading) return; reloading = true;      // exactly one reload, ever
    });
  });
}

function netFlag(){
  paintChip();
  let bar=$("#netBar");
  if(navigator.onLine){ if(bar) bar.remove(); return; }
  if(bar) return;
  bar=document.createElement("div");
  bar.id="netBar"; bar.className="offline";
  bar.textContent="No connection — quoting and PDFs still work. Stock and purchase requirements sync when you are back online.";
  document.querySelector("header.mast").after(bar);
}
window.addEventListener("online", ()=>{ netFlag(); if(state.sync.url){ syncStock(true); syncPurchase(true); } });
window.addEventListener("offline", netFlag);

(async function init(){
  const saved = await Store.get(KEY);
  if(saved){ state.ov=saved.ov||{}; state.rev=saved.rev||state.rev; state.effective=saved.effective||state.effective;
    state.custom=saved.custom||{}; state.terms=saved.terms||null; state.notes=saved.notes||null;
    state.stock=saved.stock||{}; if(saved.sync) Object.assign(state.sync, saved.sync);
    state.catOpen=saved.catOpen||{}; state.purchase=Array.isArray(saved.purchase)?saved.purchase:[];
    if(saved.numbering) Object.assign(state.numbering, saved.numbering);
    if(saved.backend) state.backend=saved.backend;
    state.priceReviewed=saved.priceReviewed||{}; state.seeded=!!saved.seeded;
    state.customers=saved.customers||[]; state.quotes=saved.quotes||[];
    state.company=saved.company||null; state.prefs=saved.prefs||{};
    state.categories=saved.categories||{}; state.catOf=saved.catOf||{};
    state.moves=Array.isArray(saved.moves)?saved.moves:[]; }
  const bm=$("#brandMark"); if(bm) bm.src=BRAND.badge;
  if(state.prefs.font) document.documentElement.style.fontSize=(state.prefs.font/100*16)+"px";
  const hadDraft = await restoreDraft();
  if(!hadDraft) applyDefaultTier();       // a restored draft keeps its own rate type
  netFlag();
  $("#revLbl").textContent = "rates "+state.rev;
  if(!state.numbering.fy) state.numbering.fy = fyNow();
  $("#qRef").placeholder = nextPreview();
  checkFinancialYear();
  initAuth();
  $$("[data-tier]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tier===state.tier));
  initBackTop();
  render();
  bootBusy = false;
  paintChip();
  const boot = $("#boot");
  if(boot){ boot.style.opacity = "0"; boot.style.transition = "opacity .18s"; setTimeout(()=>boot.remove(), 200); }
  if(hadDraft) toast("Your unfinished quotation was restored", "Start new", ()=>{
    state.lines=[]; state.transport={on:false,amt:0,note:""};
    ["#qClient","#qSite","#qGst","#qContact","#qPhone","#qEmail","#qAddr","#trAmt","#trNote"]
      .forEach(id=>{ const el=$(id); if(el) el.value=""; });
    const on=$("#trOn"); if(on) on.checked=false;
    resetQuoteNo(); clearDraft(); applyDefaultTier(); render();
    toast("New quotation started");
  });
  if(state.sync.url){
    syncStock(true); syncPurchase(true);
    setInterval(()=>{ if(!document.hidden){ syncStock(true); syncPurchase(true); } }, 120000);
    document.addEventListener("visibilitychange", ()=>{
      if(!document.hidden){ syncStock(true); syncPurchase(true); }
    });
  }
})();
</script>
