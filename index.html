V.hsd.wire = () => {
  const calc = () => {
    const FT=FT_MM;
    const oH=+$("#hH").value||0, oW=+$("#hW").value||0, aH=+$("#hCH").value||0, aW=+$("#hCW").value||0;
    const q=Math.max(1,+$("#hQ").value||1);
    if(!oH||!oW){ $("#hOut").innerHTML=""; $("#hSpec").innerHTML=""; return; }
    const cH=oH+aH, cW=oW+aW;
    const area=(cH/1000)*(cW/1000);
    const sqft=(cH/FT)*(cW/FT);
    const shaftFt=cW/FT;
    const slab = area<=15?"PVC-A" : area<=18?"PVC-B" : area<=25?"PVC-C" : "PVC-D";
    const rows=[];
    const rCur=px("hsdbuild",slab);
    rows.push({t:"PVC curtain, 700–900 GSM EN-standard fabric",
      s:`MS guide with brush seal, rubber bottom seal, middle joint bar in welded pockets · ${num(area)} m² complete`,
      q:`${num(sqft*q)} sq ft`, rt:money(rCur), amt:sqft*q*rCur});
    const rSh=px("hsdbuild","HSD-SHAFT");
    rows.push({t:"MS roller shaft with both-side bearing", s:`Shaft length ${num(shaftFt)} ft`, q:`${num(shaftFt*q)} ft`, rt:money(rSh), amt:shaftFt*q*rSh});
    if($("#hCov").checked){ const r=px("hsdbuild","HSD-COVER");
      rows.push({t:"Top cover for shutter", s:"Motor cover not included", q:`${num(shaftFt*q)} ft`, rt:money(r), amt:shaftFt*q*r}); }
    let mSel=$("#hMotor").value, autoM=null;
    const motors=itemsOf("hsdmotor").filter(i=>i.area).sort((a,b)=>a.area-b.area);
    autoM = motors.find(i=>area<=i.area) || motors[motors.length-1];
    const mm = mSel==="auto" ? autoM : itemBy("hsdmotor",mSel);
    const rM=px("hsdmotor",mm.m);
    rows.push({t:label("hsdmotor",mm).m+" — "+label("hsdmotor",mm).n.replace(/^High-speed door motor — |^Direct drive motor — /,"motor, "), s:"Motor with control unit", q:`${q} no`, rt:money(rM), amt:rM*q});
    const pc=Math.max(0,+$("#hPc").value||0);
    if(pc){ const r=px("gate","PHOTOCELL"); rows.push({t:"Photocell sensor", s:"Wired, 10 m anti-sun", q:`${pc} set`, rt:money(r), amt:pc*r}); }

    $("#hSpec").innerHTML = [
      ["Opening", `${Math.round(oW)} × ${Math.round(oH)} mm`],
      ["Complete", `${Math.round(cW)} × ${Math.round(cH)} mm`],
      ["Area", `${num(area)} m² · ${num(sqft)} sq ft`],
      ["Shaft", `${num(shaftFt)} ft`]
    ].map(([k,v])=>`<span><b>${k}</b> ${v}</span>`).join("");
    let over = area>120 ? `<b>Over 120 m²</b> — outside the listed motor range, check with the works before quoting. ` : "";
    if(aH>oH*0.5 || aW>oW*0.5) over += `<b>Check the clearance figures</b> — adding ${aH} mm to the height and ${aW} mm to the width is unusually large for this opening. `;
    $("#hOut").innerHTML = outBlock(rows, `${over}Motor picked by complete area${mSel==="auto"?` (${autoM.m})`:" — overridden manually"}. Curtain rate slab: ${slab.replace("PVC-","")} at ${money(rCur)}/sq ft. Areas converted at 1 ft = 304.76 mm, as in the calculation sheet. Note: the tabs in that sheet are named after the motor model, not the door area, and several carry a motor below the door size — this desk sizes the motor from the actual complete area instead. Excludes installation, transport and wooden box.`);
    $("#btnAdd").onclick = (ev) => addLines(rows.map(r=>({t:r.t, s:`${Math.round(oW)}×${Math.round(oH)} mm opening${q>1?` × ${q}`:""} — ${r.q} @ ${r.rt}`, amt:r.amt})), ev.currentTarget);
  };
  ["hH","hW","hCH","hCW","hQ","hPc","hCov","hMotor"].forEach(id=>$("#"+id).addEventListener("input",calc));
  $("#hMotor").addEventListener("change",calc);
  calc();
};

/** Keep a card's second line short enough to scan without wrapping forever. */
const shortDesc = (s, n) => {
  s = String(s||"").trim();
  return s.length > (n||88) ? s.slice(0, (n||88)-1).replace(/[\s,;\-]+$/,"") + "\u2026" : s;
};

function productCard(g, it){
  const r=rate(g.id,it.m,state.tier), L=label(g.id,it), k=`${g.id}|${it.m}`;
  const q=qtyInQuote(k);
  return `<div class="pitem${q>0?" inquote":""}" data-pk="${esc(k)}">
    <div class="nm"><b>${esc(L.m)}</b>${stockChip(g.id,it.m)}${it.kg?` <span class="tag">${it.kg} kg</span>`:""}${it.custom?` <span class="tag g">added</span>`:""}${r.edited?` <span class="tag o">edited</span>`:""}
      <span>${esc(shortDesc(L.n))}</span></div>

    <div class="pact">

function mountBrowse(sel, gids, opt={}){
  const host=$(sel);
  host.innerHTML = `${opt.hideFilters?"":`
    <div class="searchbar">
      <input type="search" data-q placeholder="Search products by model, name or description" aria-label="Search products">
      <button class="clearq" data-clear hidden aria-label="Clear search">&times;</button>
    </div>
    <div class="filters slim">
      <label class="f"><span>Minimum load, kg</span><input type="number" data-kg placeholder="any" min="0" step="50"></label>
      <div class="fgrow"></div>
      <button class="btn gh sm" data-openall>Expand all</button>
      <button class="btn gh sm" data-shutall>Collapse all</button>
    </div>`}<div data-list></div>`;

  const list=host.querySelector("[data-list]");

  const render = () => {
    const qEl=host.querySelector("[data-q]");
    const q=(qEl?.value||"").toLowerCase().trim();
    const kg=+(host.querySelector("[data-kg]")?.value||0);
    const cl=host.querySelector("[data-clear]"); if(cl) cl.hidden = !q;

    const match = (g,it) => {
      const L=label(g.id,it);
      if(opt.exclude && opt.exclude.includes(it.m)) return false;
      if(kg && !(it.kg>=kg)) return false;
      if(q && !((L.m+" "+L.n+" "+g.label).toLowerCase().includes(q))) return false;
      return true;
    };

    if(q){
      const hits=[];
      gids.forEach(id=>{ const g=groupById(id);
        visibleItems(id).forEach(it=>{ if(match(g,it)) hits.push([g,it]); }); });
      if(!hits.length){
        list.innerHTML = `<div class="empty"><b>No products found</b><br>Nothing matches “${esc(q)}”. Try a shorter word, or part of the model number.</div>`;
        return;
      }
      list.innerHTML = `<p class="reshead">${hits.length} product${hits.length>1?"s":""} matching “${esc(q)}”</p>
        <div class="plist">${hits.slice(0,300).map(([g,it])=>
          productCard(g,it).replace('<span>','<span class="cat-of">'+esc(g.label)+'</span><span>')).join("")}</div>`;
      return;
    }

    const cats = gids.map(id=>{
      const g=groupById(id);
      const items=visibleItems(id).filter(it=>match(g,it));
      return [g, items];
    }).filter(([,items])=>items.length);

    if(!cats.length){ list.innerHTML='<div class="empty"><b>No products found</b><br>Try clearing the load filter.</div>'; return; }

    list.innerHTML = cats.map(([g,items])=>`
      <details class="cat" data-cat="${esc(g.id)}"${state.catOpen[g.id]?" open":""}>
        <summary><span class="cname">${esc(g.label)}</span><span class="cnt">${items.length}</span></summary>
        <div class="plist">${items.map(it=>productCard(g,it)).join("")}</div>
      </details>`).join("");
  };

  host.addEventListener("input", e=>{
    if(e.target.matches("[data-q],[data-kg]")) render();
  });
  host.addEventListener("click", e=>{
    if(e.target.closest("[data-clear]")){
      host.querySelector("[data-q]").value=""; render();
      host.querySelector("[data-q]").focus(); return;
    }
    if(e.target.closest("[data-openall]")){
      gids.forEach(id=>state.catOpen[id]=true);
      $$(".cat",host).forEach(d=>d.open=true); saveSettings(); return;
    }
    if(e.target.closest("[data-shutall]")){
      gids.forEach(id=>state.catOpen[id]=false);
      $$(".cat",host).forEach(d=>d.open=false); saveSettings(); return;
    }
    const add=e.target.closest("[data-padd]");
    if(add){
      const card=add.closest("[data-pk]");
      if(qtyInQuote(card.dataset.pk) > 0) toast("Already in the quotation \u2014 quantity raised");
      changeQty(card.dataset.pk, 1);
      card.classList.remove("just"); void card.offsetWidth; card.classList.add("just");
      return;
    }
    const step=e.target.closest("[data-pd]");
    if(step){
      const card=step.closest("[data-pk]");
      changeQty(card.dataset.pk, +step.dataset.pd);
      card.classList.remove("just"); void card.offsetWidth; card.classList.add("just");
      return;
    }
  });
  host.addEventListener("change", e=>{
    const box=e.target.closest("[data-pq]");
    if(box){
      const card=box.closest("[data-pk]");
      const v=+box.value;
      if(isNaN(v)||v<0){ syncQty(); return; }
      changeQty(card.dataset.pk, 0, v);
      return;
    }
  });
  host.addEventListener("toggle", e=>{
    const d=e.target.closest(".cat");
    if(d){ state.catOpen[d.dataset.cat]=d.open; saveSettings(); }
  }, true);

  render();
  host._render = render;
}

/* ========================= stock =========================
   Each item can carry a quantity in hand and a reorder level. It all works
   offline on one device; set a team sync address and every change is pushed
   to a shared Google Sheet and pulled back, so the team sees one figure. */

const skey = (gid,m) => gid+"|"+m;
const stockOf = (gid,m) => { const s=state.stock[skey(gid,m)]; return (s && !s.off) ? s : null; };
const pendingStock = new Set();

/** untracked | out | low | ok */
function stockState(s){
  if(!s) return "untracked";
  if(s.q<=0) return "out";
  if(s.min>0 && s.q<=s.min) return "low";
  return "ok";
}
function stockChip(gid,m){
  const s=stockOf(gid,m), st=stockState(s);
  if(st==="untracked") return "";
  if(st==="out") return ` <span class="tag r">Out of stock</span>`;
  if(st==="low") return ` <span class="tag w">Low &middot; ${s.q} left</span>`;
  return ` <span class="tag g">${s.q} in stock</span>`;
}
const MOVE_LABEL = {in:"Stock in", out:"Stock out", set:"Quantity corrected",
                    min:"Reorder level changed", add:"Added to stock", archive:"Archived", pin:"Pinned preference"};

/** Everything that changes a stock figure comes through here, so quantity and
    movement history can never drift apart: on Firebase both are written in a
    single transaction, and locally both are written before anything repaints.
    Returns the movement record, or null when nothing was allowed to happen. */
function applyStock(gid, m, opts){
  const k = skey(gid,m);
  const cur = state.stock[k] || {q:0, min:0};
  const prev = Math.max(0, +cur.q || 0);
  const action = opts.action;                       // in | out | set | min | add | archive
  let next = prev;

  if(action === "in")       next = prev + Math.max(0, +opts.qty || 0);
  else if(action === "out") next = prev - Math.max(0, +opts.qty || 0);
  else if(action === "set" || action === "add") next = Math.max(0, +opts.qty || 0);
  else if(action === "archive") next = 0;

  if(next < 0){                                     // stock never goes below zero
    toast(`Only ${prev} in hand \u2014 you cannot take out more than that`);
    return null;
  }
  const min = opts.min == null ? Math.max(0, +cur.min || 0) : Math.max(0, +opts.min || 0);
  const at  = Date.now();

  const rec = {
    id: "mv_" + at.toString(36) + Math.random().toString(36).slice(2,7),
    key: k, group: gid, model: m,
    name: (()=>{ const it=itemBy(gid,m), meta=Object.assign({},cur,opts.meta||{}); return it ? label(gid,it).m + " \u2014 " + label(gid,it).n
      : `${meta.manualModel||m} \u2014 ${meta.manualName||"Manual stock item"}`; })(),
    action, prev, delta: next - prev, next, min,
    note: (opts.note || "").trim(),
    by: currentUserName(), byUid: currentUserId(), at
  };

  state.stock[k] = Object.assign({}, cur, opts.meta||{}, {q: Math.max(0, next), min: Math.max(0, min), t: at,
                    by: rec.by, byUid: rec.byUid,
                    lastAction: action, off: action === "archive" ? 1 : 0});
  if(action !== "min" || rec.min !== (cur.min||0) || opts.note) state.moves.unshift(rec);
  if(state.moves.length > 600) state.moves.length = 600;

  pendingStock.add(k); queuePush();
  if(usingFirebase()){
    fbCommitStock(k, rec).catch(e => toast("Stock did not reach the team: " + friendlyAuthError(e)));
  }
  saveSettings();            // silent: the caller says what actually happened
  refreshAll();
  paintChip();
  return rec;
}

/** Kept for the older callers (purchase receipts, imports). */
function setStock(gid,m,q,min){
  const k=skey(gid,m), cur=state.stock[k]||{q:0,min:0};
  if(q==null && min!=null) return applyStock(gid,m,{action:"min", min});
  return applyStock(gid,m,{action:"set", qty: q==null?cur.q:q, min: min==null?cur.min:min,
                           note:"adjusted automatically"});
}
function clearStock(gid,m){
  if(!state.stock[skey(gid,m)]) return;
  applyStock(gid,m,{action:"archive", note:"stopped tracking"});
}
const ago = t => {
  if(!t) return "never";
  const s=Math.round((Date.now()-t)/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.round(s/60)+" min ago";
  if(s<86400) return Math.round(s/3600)+" h ago";
  return new Date(t).toLocaleDateString("en-IN",{day:"2-digit",month:"short"});
};

/* ---------- talking to the team sheet ---------- */
async function api(payload){
  if(!state.sync.url) throw new Error("no sync address set");
  const r = await fetch(state.sync.url, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},   // keeps this a simple request
    body: JSON.stringify(Object.assign({key:state.sync.key, by:state.sync.who}, payload))
  });
  if(!r.ok) throw new Error("sheet replied "+r.status);
  const d = await r.json();
  if(d && d.error) throw new Error(d.error);
  return d;
}
let pushTimer=null, syncing=false;
function queuePush(){
  if(state.backend!=="sheets" || !state.sync.url) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>syncStock(true), 1800);
  paintSyncBar();
}
async function syncStock(quiet){
  if(state.backend!=="sheets") return;          // Firebase handles this instead
  if(!state.sync.url || syncing) return;
  syncing=true; state.sync.err=""; paintSyncBar();
  try{
    const changes={};
    pendingStock.forEach(k=>{ if(state.stock[k]) changes[k]=state.stock[k]; });
    const res = await api({action:"stock", changes});
    let pulled=0;
    Object.entries(res.stock||{}).forEach(([k,v])=>{
      const cur=state.stock[k];
      if(!cur || (v.t||0) > (cur.t||0)){ state.stock[k]=v; pulled++; }
    });
    pendingStock.clear();
    state.sync.last=Date.now();
    await Store.set(KEY,{rev:state.rev,effective:state.effective,ov:state.ov,custom:state.custom,
      terms:state.terms,notes:state.notes,stock:state.stock,sync:state.sync,
      catOpen:state.catOpen,purchase:state.purchase,numbering:state.numbering,backend:state.backend,
      priceReviewed:state.priceReviewed,seeded:state.seeded,customers:state.customers,quotes:state.quotes,
      company:state.company,prefs:state.prefs,categories:state.categories,catOf:state.catOf});
    if(state.view==="stock") V.stock.repaint && V.stock.repaint();
    refreshAll();
    if(!quiet) toast(pulled ? `Stock synced — ${pulled} updated from the team` : "Stock synced");
  }catch(e){
    state.sync.err=e.message;
    if(!quiet) toast("Sync failed: "+e.message);
  }finally{
    syncing=false; paintSyncBar();
  }
}
/** The masthead chip. One sentence, and it is never wrong on purpose. */
function paintChip(){
  const el = $("#syncChip"); if(!el) return;
  const dot = el.querySelector("span");
  let cls = "", txt = "";
  if(!navigator.onLine){ cls = "off"; txt = "Offline"; }
  else if(bootBusy || state.fb.state === "loading"){ cls = "busy"; txt = "Loading\u2026"; }
  else if(state.fb.state === "error"){ cls = "bad"; txt = "Sign-in unavailable"; }
  else if(usingFirebase()){
    if(syncing || psyncing || pendingStock.size || pendingPurchase.size){ cls = "busy"; txt = "Syncing\u2026"; }
    else if(state.sync.err || state.psync.err){ cls = "bad"; txt = "Sync problem"; }
    else { cls = "ok"; txt = "Synced"; }
  }
  else if(state.backend === "sheets" && state.sync.url){
    cls = syncing ? "busy" : state.sync.err ? "bad" : "ok";
    txt = syncing ? "Syncing\u2026" : state.sync.err ? "Sync problem" : "Synced";
  }
  else { cls = ""; txt = "This device"; }
  el.className = "chip " + cls;
  el.title = txt;
  if(dot) dot.textContent = txt;
}
let bootBusy = true;
setInterval(paintChip, 4000);

function paintSyncBar(){
  paintChip();
  const el=$("#syncBar"); if(!el) return;
  const s=state.sync, waiting=pendingStock.size;
  let cls, txt;
  if(usingFirebase()){
    el.className="syncbar good";
    el.querySelector("[data-txt]").textContent=`Team synced through Firebase \u00b7 signed in as ${state.auth.name}`;
    const bb=el.querySelector("[data-now]"); if(bb) bb.disabled=true;
    return;
  }
  if(!s.url){ cls="idle"; txt="Saved on this device. Sign in on the Team tab to share it."; }
  else if(syncing){ cls="busy"; txt="Syncing…"; }
  else if(s.err){ cls="bad"; txt="Last sync failed — "+s.err; }
  else { cls="good"; txt=`Synced ${ago(s.last)}${waiting?` · ${waiting} change${waiting>1?"s":""} waiting`:""}${s.who?` · signed in as ${s.who}`:""}`; }
  el.className="syncbar "+cls;
  el.querySelector("[data-txt]").textContent=txt;
  const b=el.querySelector("[data-now]"); if(b) b.disabled=!s.url||syncing;
}

/* ---------- Our Stock ----------
   Every figure in one place: what is in hand, what is running low, what has
   run out. Staff move stock in and out; only an administrator corrects a
   quantity outright or stops tracking an item. Every movement is recorded. */

function stockInfo(gid,m,s){
  const it=itemBy(gid,m);
  if(it){
    const g=groupById(gid);
    return {g,it,L:label(gid,it),cat:categoryById(categoryOf(gid,it)),manual:false};
  }
  return {
    g:{id:gid,label:"Manual stock"}, it:{m}, manual:true,
    L:{m:s.manualModel||m,n:s.manualName||"Manual stock item",u:s.unit||"each"},
    cat:categoryById(s.categoryId||"cat-other")
  };
}
const stockRows = () => Object.entries(state.stock||{}).filter(([,s])=>s&&!s.off).map(([key,s])=>{
  const cut=key.indexOf("|"), gid=cut<0?"manualstock":key.slice(0,cut), m=cut<0?key:key.slice(cut+1);
  const info=stockInfo(gid,m,s);
  return Object.assign({key,s,st:stockState(s)},info);
}).sort((a,b)=>{
  const rank=x=>x.st==="out"?0:x.st==="low"?1:2;
  return rank(a)-rank(b)||String(a.L.m).localeCompare(String(b.L.m));
});

function saveStockMeta(key,patch){
  const cur=state.stock[key]; if(!cur) return;
  state.stock[key]=Object.assign({},cur,patch,{t:Date.now(),by:currentUserName(),byUid:currentUserId(),lastAction:"pin"});
  pendingStock.add(key); queuePush(); saveSettings();
  if(usingFirebase()) fbPushStock([key]).catch(e=>toast("Stock preference did not reach the team: "+friendlyAuthError(e)));
}

  return {

  };
};

          <input type="number" id="mvfMin" value="${s ? (s.min||0) : defaultMin()}" min="0" step="1" inputmode="numeric"></label>
      </div>
      <label class="f" style="margin-top:11px"><span>Reason or note (optional)</span>
        <input type="text" id="mvfNote" placeholder="${action==="out"?"e.g. issued to the Adani site":"e.g. received against PO 214"}"></label>
      <p class="hint">In hand now: <b>${have}</b>${action==="out"?` — you cannot take out more than this.`:""}</p>`,
    {
      ok: titles[action],
      onSave: box => {
        const q = +box.querySelector("#mvfQ").value;
        const min = +box.querySelector("#mvfMin").value;
        const note = box.querySelector("#mvfNote").value;
        if(isNaN(q) || q < 0){ toast("Enter a quantity of zero or more"); return false; }
        if(action !== "set" && action !== "add" && q <= 0){ toast("Quantity must be more than zero"); return false; }
        if(isNaN(min) || min < 0){ toast("The reorder level cannot be negative"); return false; }
        if(action === "out" && q > have){ toast(`Only ${have} in hand — stock cannot go below zero`); return false; }
        if((action === "set") && !confirmAction(`Correct ${L.m} from ${have} to ${q}?\n\nA correction is recorded against your name.`)) return false;
        const rec = applyStock(gid, m, {action, qty:q, min, note});
        if(!rec) return false;
        draw();
        toast(`${MOVE_LABEL[action]} · ${L.m} is now ${rec.next}`);
      }

  /* ---- the list ---- */
  const draw = () => {
    const totals=stockTotals();

    const lowEl=$("[data-stock-summary='low'] .num"); if(lowEl) lowEl.textContent=totals.low;

    const q  = ($("#stQ").value||"").toLowerCase().trim();

    });

    if(!rows.length){
      $("#stList").innerHTML = `<div class="empty">${stockRows().length

    }
    const card = ({g,it,L,s,st,cat,key,manual}, pinned=false) => {

      const isPinned=!!s.pinned;

      const next=!cur.pinned;

    if(link) link.onclick=()=>{
      box.querySelector("[data-mcancel]").click();

        const copy=Object.assign({},state.stock[old],{manual:false,manualName:"",manualModel:"",categoryId:"",linkedKey:nk,
          t:Date.now(),by:currentUserName(),byUid:currentUserId(),lastAction:"add",off:0});
        applyStock(gid,m,{action:"archive",note:`linked to ${nk}`});
        state.stock[nk]=copy; pendingStock.add(nk); saveSettings();
        if(usingFirebase()) fbPushStock([nk]).catch(e=>toast("Link saved here but NOT shared: "+friendlyAuthError(e)));
        draw(); toast("Manual stock linked to product");
      }),30);

    const arch = box && box.querySelector("#seArch");
    if(arch) arch.onclick = () => {
      if(!confirmAction(`Stop tracking ${L.m} in stock?\n\nIts movement history is kept. Nothing is deleted.`)) return;

  $("#syOff").onclick = async () => {
    state.sync.url=""; state.sync.err=""; $("#syUrl").value="";
    await save(); paintSyncBar(); toast("Disconnected — stock stays on this device");

  $("[data-now]").onclick = () => syncStock();

  draw();
  paintSyncBar();
};

/* ========================= purchase requirements =========================
   What the team needs to order. Works entirely on this device; if the stock
   sheet is configured later, the same records ride the existing sync with
   per-record timestamps, so an older offline edit cannot overwrite a newer
   team update. */

const URGENCY = {
  normal:  {label:"Needed later",     dot:"\u{1F7E2}", hint:"Required, but not now", cls:"u-normal",  rank:0},
  urgent:  {label:"Can wait 1–2 days",dot:"\u{1F7E1}", hint:"Order within a couple of days", cls:"u-urgent", rank:1},
  critical:{label:"Very urgent",      dot:"\u{1F534}", hint:"Needed immediately", cls:"u-critical", rank:2}
};
const PSTATUS = ["Needed","Ordered","Received","Cancelled"];

/** Whose name is recorded on a change. Firebase, when configured, will
    supply this instead of the typed name. */
function currentUserName(){
  if(state.auth && state.auth.name) return state.auth.name;   // never a typed name when signed in
  return state.sync.who || "unnamed";
}
const currentUserId = () => (state.auth && state.auth.uid) || null;
const newId = () => "pr_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const activeReqs   = () => state.purchase.filter(p=>!p.del && !p.received && p.status!=="Cancelled");
const receivedReqs = () => state.purchase.filter(p=>!p.del && (p.received || p.status==="Cancelled"));

function activeReqFor(name, key){
  return state.purchase.find(p => !p.del && !p.received &&
    ((key && p.key===key) || (!key && p.name.toLowerCase()===String(name||"").toLowerCase())));
}
function sortReqs(list){
  return list.slice().sort((a,b)=>{
    const ur=(URGENCY[b.urgency]?.rank||0)-(URGENCY[a.urgency]?.rank||0);
    if(ur) return ur;                               // very urgent, then 1-2 days, then later
    const sr=PSTATUS.indexOf(a.status)-PSTATUS.indexOf(b.status);
    if(sr) return sr;
    return (b.t||0)-(a.t||0);
  });
}
const stamp = t => t ? new Date(t).toLocaleString("en-IN",
  {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
function touchReq(p){
  p.updated = Date.now();
  p.upBy = p.upBy || currentUserName();
  p.upUid = currentUserId() || p.upUid || null;
  p.by = p.by || currentUserName();
  p.byUid = p.byUid || currentUserId() || null;
  pendingPurchase.add(p.id);
  saveSettings();
  paintBadges();
  queuePurchasePush();
  if(usingFirebase()) fbPushPurchase([p.id]).catch(e=>toast("Requirement did not reach the team: "+friendlyAuthError(e)));
}

/* ---------- sync, once the sheet is configured ---------- */
const pendingPurchase = new Set();
let pTimer=null, psyncing=false;
function queuePurchasePush(){
  if(state.backend!=="sheets" || !state.sync.url) return;   // nothing to complain about yet
  clearTimeout(pTimer);
  pTimer=setTimeout(()=>syncPurchase(true), 1800);
}
async function syncPurchase(quiet){
  if(state.backend!=="sheets") return;            // Firebase handles this instead
  if(!state.sync.url || psyncing) return;         // silent when sync is not set up
  psyncing=true; state.psync.err=""; paintPBar();
  try{
    const changes={};
    pendingPurchase.forEach(id=>{ const p=state.purchase.find(x=>x.id===id); if(p) changes[id]=p; });
    const res = await api({action:"purchase", changes});
    let pulled=0;
    Object.entries(res.purchase||{}).forEach(([id,v])=>{
      const i=state.purchase.findIndex(x=>x.id===id);
      if(i<0){ state.purchase.push(v); pulled++; }
      else if((v.updated||0) > (state.purchase[i].updated||0)){ state.purchase[i]=v; pulled++; }
    });
    state.purchase = state.purchase.filter(p=>!p.del);
    pendingPurchase.clear();
    state.psync.last=Date.now();
    saveSettings();
    if(state.view==="purchase" && V.purchase.repaint) V.purchase.repaint();
    if(!quiet) toast(pulled ? `Requirements synced — ${pulled} updated` : "Requirements synced");
  }catch(e){
    state.psync.err=e.message;
    if(!quiet) toast("Sync failed: "+e.message);
  }finally{ psyncing=false; paintPBar(); }
}
function paintPBar(){
  paintChip();
  const el=$("#pBar"); if(!el) return;
  const on=!!state.sync.url;
  el.className="syncbar "+(psyncing?"busy":state.psync.err?"bad":on?"good":"idle");
  el.querySelector("[data-txt]").textContent =
    usingFirebase() ? `Team synced through Firebase \u00b7 signed in as ${state.auth.name}`
    : !on ? "Saved on this device. Sign in on the Team tab to share these with the team."
    : psyncing ? "Syncing…"
    : state.psync.err ? "Last sync failed — "+state.psync.err
    : `Team synced · ${ago(state.psync.last)}`;
  const b=el.querySelector("[data-pnow]"); if(b) b.hidden=!on;
}

/* ========================= quotation numbering =========================
   A number is spent only when a quotation is actually issued — downloaded,
   printed or copied for WhatsApp. Opening, editing or abandoning a draft
   costs nothing. Once a draft has a number it keeps it, so hitting Download
   twice never burns two numbers. */

function fyOf(d){                       // Indian financial year, April to March
  const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear()-1;
  return `${y}-${String(y+1).slice(2)}`;
}
const fyNow = () => fyOf(new Date());

function fmtNo(n){
  const N=state.numbering;
  return `${N.prefix}/${N.fy}/${String(Math.max(1,n)).padStart(N.pad||3,"0")}`;
}
const nextPreview = () => fmtNo(state.numbering.next);

/** Replaced by a Firestore transaction once a shared backend is configured.
    Returning null means "no shared counter — use the local one". */
async function reserveSharedNumber(){
  if(usingFirebase()){
    // Deliberately no local fallback: a fallback is exactly how two people
    // end up holding the same number.
    try{ return await fbReserveNumber(); }
    catch(e){ toast("Could not reach the shared counter. Nothing was issued."); throw e; }
  }
  /* With Firebase this becomes a single transaction on a counter document,
     so two people pressing Download at the same moment cannot be handed the
     same number:

       const ref = doc(db, "teamSettings", "numbering");
       const no  = await runTransaction(db, async tx => {
         const snap = await tx.get(ref);
         const cur  = snap.data();
         if (cur.fy !== state.numbering.fy) throw new Error("financial year mismatch");
         tx.update(ref, { next: cur.next + 1 });
         return cur.next;
       });
       return fmtNo(no);
  */
  return null;
}

let assignInFlight = null;

/** Give this quotation its number. Safe to call repeatedly and safe to call
    twice at once — every caller waits on the same assignment and gets the
    same number back, so one quotation can never eat two. */
function assignQuoteNo(){
  if(state.quoteNo) return Promise.resolve(state.quoteNo);   // this draft already has one

  // The number always comes from the counter. There is no manual override —
  // a typed number is exactly how two quotations end up sharing one.
  if(assignInFlight) return assignInFlight;                  // a second click, mid-assignment

  assignInFlight = (async () => {
    let no = null;
    try{ no = await reserveSharedNumber(); }
    catch(e){ assignInFlight=null; throw e; }
    if(!no && usingFirebase()){ assignInFlight=null; return null; }
    if(!no){
      no = fmtNo(state.numbering.next);
      state.numbering.next = Math.max(1, state.numbering.next) + 1;
    }
    state.numbering.lastIssued = {no, at:Date.now(), by:currentUserName()};
    state.quoteNo = no;
    $("#qRef").value = no;
    $("#qRef").placeholder = nextPreview();
    saveSettings();
    return no;
  })();
  assignInFlight.finally(()=>{ assignInFlight = null; });
  return assignInFlight;
}

/** Start a fresh quotation: the next number becomes the suggestion again. */
/** A brand new quotation starts on the team's default rate type. */
function applyDefaultTier(){
  const t = state.company && state.company.defaultTier;
  if(t && TIERNAME[t] && t!==state.tier && !state.lines.length && !isFinalised()){
    state.tier = t;
    $$("[data-tier]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tier===state.tier));
    return true;
  }
  return false;
}
const newDraftId = () => "q_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function resetQuoteNo(){
  state.quoteNo = null; assignInFlight = null; state.partyId = null;
  state.draftId = newDraftId();        // a new quotation, so a new record id
  const el=$("#qRef");
  if(el){ el.value=""; el.placeholder = nextPreview(); }
}

/** On 1 April the year rolls over. Never reset the sequence without asking. */
function checkFinancialYear(){
  const now = fyNow();
  if(state.numbering.fy === now || state.numbering.fyAsked === now) return;
  toast(`Financial year is now ${now} \u2014 open Settings to roll the numbering over`, "Open Settings", ()=>goView("settings"));
  state.numbering.fyAsked = now;
  saveSettings();
}

   Authentication and shared data. Everything here degrades quietly: if the
   config is blank, the network is down, or the SDK cannot load, the app
   carries on working on this device alone.

   ── YOUR FIREBASE CONFIGURATION ──────────────────────────────────────────

   ───────────────────────────────────────────────────────────────────────── */
const FIREBASE_CONFIG = {

const FB_SDK = "https://www.gstatic.com/firebasejs/12.18.0/";
const fbConfigured = () => !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);

let FB = null;                 // {app, auth, db, A, D} once loaded
let fbLoading = null;
let fbUnsub = [];

async function loadFirebase(){
  if(FB) return FB;
  if(!fbConfigured()) return null;
  if(fbLoading) return fbLoading;
  fbLoading = (async () => {
    const [appMod, authMod, dbMod] = await Promise.all([
      import(FB_SDK+"firebase-app.js"),
      import(FB_SDK+"firebase-auth.js"),
      import(FB_SDK+"firebase-firestore.js")
    ]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    const auth = authMod.getAuth(app);
    try{ await authMod.setPersistence(auth, authMod.browserLocalPersistence); }catch(e){}
    let db;
    try{
      // keeps working offline and replays writes when the signal returns
      db = dbMod.initializeFirestore(app, {
        localCache: dbMod.persistentLocalCache({tabManager: dbMod.persistentMultipleTabManager()})
      });
    }catch(e){ db = dbMod.getFirestore(app); }
    FB = {appMod, app, auth, db, A:authMod, D:dbMod};
    return FB;
  })();
  try{ return await fbLoading; }
  catch(e){ fbLoading=null; state.fb.err = "Could not load Firebase: "+e.message; return null; }
}

const isSignedIn = () => !!(state.auth && state.auth.uid);
const isAdmin    = () => !!(state.auth && state.auth.role === "admin");
const usingFirebase = () => state.backend === "firebase" && isSignedIn();

function friendlyAuthError(e){
  const c = (e && e.code) || "";
  if(c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found"))
    return "That email and password do not match an account.";
  if(c.includes("invalid-email"))      return "That does not look like an email address.";
  if(c.includes("user-disabled"))      return "This account has been switched off. Ask your administrator.";
  if(c.includes("too-many-requests"))  return "Too many attempts. Wait a few minutes and try again.";
  if(c.includes("network-request-failed")) return "No connection. Check the internet and try again.";
  if(c.includes("missing-password"))   return "Enter your password.";
  if(c.includes("permission-denied"))  return "Your account is not allowed to do that.";
  return (e && e.message) ? e.message.replace(/^Firebase:\s*/,"") : "Something went wrong.";
}

async function fbSignIn(email, pass){
  const f = await loadFirebase();
  if(!f) throw new Error("Firebase is not available right now.");
  const cred = await f.A.signInWithEmailAndPassword(f.auth, email.trim(), pass);
  return cred.user;
}
async function fbSignOut(){
  const f = await loadFirebase(); if(!f) return;
  fbUnsub.forEach(u=>{ try{u();}catch(e){} }); fbUnsub=[];
  await f.A.signOut(f.auth);
  state.auth=null; state.backend="local";
  saveSettings(); render();
  toast("Signed out");
}
async function fbReset(email){
  const f = await loadFirebase();
  if(!f) throw new Error("Firebase is not available right now.");
  await f.A.sendPasswordResetEmail(f.auth, email.trim());
}

/** Load the profile document that carries name, role and active flag. */
async function loadProfile(user){
  const f = await loadFirebase(); if(!f) return null;
  const {doc, getDoc} = f.D;
  const snap = await getDoc(doc(f.db, "users", user.uid));
  if(!snap.exists()){
    return {uid:user.uid, email:user.email, name:user.email, role:"staff", active:false, missing:true};
  }
  const d = snap.data();
  return {uid:user.uid, email:user.email, name:d.name||user.email,
          role:d.role||"staff", active:d.active!==false};
}

/** A snapshot's data, minus the server timestamp object, so what we keep on
    the device stays plain JSON that survives IndexedDB and a backup file. */
function plainDoc(v){
  if(!v || typeof v !== "object") return v;
  const o = Object.assign({}, v);
  delete o.serverAt;
  return o;
}

/* ---------- shared stock ---------- */
/** Movements a member of staff is allowed to record. An older figure carried
    over from V8A has no action recorded against it, so it is uploaded as an
    ordinary addition — which is what a migration is. */
const STAFF_ACTIONS = ["in","out","min","add","pin"];
const uploadAction = a => STAFF_ACTIONS.includes(a) ? a : "add";

async function fbPushStock(keys){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, runTransaction, serverTimestamp} = f.D;
  for(const k of keys){
    const local = state.stock[k]; if(!local) continue;
    const ref = doc(f.db, "stock", k.replace(/\//g,"_"));
    // a transaction so a stale phone cannot overwrite a fresher figure
    await runTransaction(f.db, async tx => {
      const snap = await tx.get(ref);
      const cur = snap.exists() ? snap.data() : null;
      if(cur && (cur.t||0) > (local.t||0)) return;      // theirs is newer, leave it
      const [group, model] = k.split("|");
      tx.set(ref, {
        key:k, group, model,
        // a quantity is clamped here as well as in the rules: an upload can
        // never introduce a negative figure, whatever is on the device
        q:   Math.max(0, +local.q   || 0),
        min: Math.max(0, +local.min || 0),
        off: local.off ? 1 : 0,
        t: local.t || Date.now(),
        // the rules require an action a member of staff may record, so a
        // V8A figure with none uploads cleanly rather than being refused
        lastAction: uploadAction(local.lastAction),
        pinned: !!local.pinned, pinOrder: Math.max(0,+local.pinOrder||0),
        manual: !!local.manual, manualName: local.manualName||"",
        manualModel: local.manualModel||"", categoryId: local.categoryId||"",
        unit: local.unit||"each", linkedKey: local.linkedKey||"",
        by: state.auth.name, byUid: state.auth.uid,
        serverAt: serverTimestamp()
      }, {merge:true});
    });
  }
}
/** One transaction: the quantity document and its movement record together.
    Either both land or neither does, so the ledger always adds up. */
async function fbCommitStock(k, rec){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, runTransaction, serverTimestamp} = f.D;
  const local = state.stock[k]; if(!local) return;
  const sRef = doc(f.db, "stock", k.replace(/\//g,"_"));
  const mRef = doc(f.db, "stockMoves", rec.id);
  await runTransaction(f.db, async tx => {
    const snap = await tx.get(sRef);
    const cur = snap.exists() ? snap.data() : null;
    if(cur && (cur.t||0) > (local.t||0)) return;        // a fresher figure already there
    const [group, model] = k.split("|");
    tx.set(sRef, {
      key:k, group, model,
      q:+local.q||0, min:+local.min||0, off: local.off?1:0,
      t: local.t||Date.now(), lastAction: local.lastAction || "set",
      pinned: !!local.pinned, pinOrder: Math.max(0,+local.pinOrder||0),
      manual: !!local.manual, manualName: local.manualName||"",
      manualModel: local.manualModel||"", categoryId: local.categoryId||"",
      unit: local.unit||"each", linkedKey: local.linkedKey||"",
      by: state.auth.name, byUid: state.auth.uid, serverAt: serverTimestamp()
    }, {merge:true});
    tx.set(mRef, Object.assign({}, rec, {
      by: state.auth.name, byUid: state.auth.uid, serverAt: serverTimestamp()
    }));
  });
}

function watchMoves(f){
  const {collection, onSnapshot, query, orderBy, limit} = f.D;
  return onSnapshot(query(collection(f.db,"stockMoves"), orderBy("at","desc"), limit(400)), snap=>{
    let n=0;
    snap.forEach(d=>{
      const v=plainDoc(d.data()); if(!v || !v.id) return;
      if(!state.moves.some(x=>x.id===v.id)){ state.moves.push(v); n++; }
    });
    if(n){
      state.moves.sort((a,b)=>(b.at||0)-(a.at||0));
      if(state.moves.length>600) state.moves.length=600;
      saveSettings();
      if(state.view==="stockmoves" && V.stockmoves.repaint) V.stockmoves.repaint();
    }
  }, err=>{ /* the ledger is not worth an alarm if it cannot be read */ });
}

function watchStock(f){
  const {collection, onSnapshot} = f.D;
  return onSnapshot(collection(f.db,"stock"), snap=>{
    let changed=0;
    snap.forEach(d=>{
      const v=d.data(); if(!v || !v.key) return;
      const cur=state.stock[v.key];
      if(!cur || (v.t||0) > (cur.t||0)){
        state.stock[v.key]={q:Math.max(0,+v.q||0), min:Math.max(0,+v.min||0),
                            t:v.t||0, by:v.by||"", byUid:v.byUid||"",
                            lastAction:v.lastAction||"", off:v.off?1:0,
                            pinned:!!v.pinned, pinOrder:Math.max(0,+v.pinOrder||0),
                            manual:!!v.manual, manualName:v.manualName||"",
                            manualModel:v.manualModel||"", categoryId:v.categoryId||"",
                            unit:v.unit||"each", linkedKey:v.linkedKey||""};
        changed++;
      }
    });
    if(changed){
      state.sync.last=Date.now(); saveSettings();
      if(state.view==="stock" && V.stock.repaint) V.stock.repaint(); else refreshAll();
    }
    paintSyncBar();
  }, err=>{ state.sync.err=friendlyAuthError(err); paintSyncBar(); });
}

/* ---------- shared purchase requirements ---------- */
async function fbPushPurchase(ids){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, runTransaction, serverTimestamp} = f.D;
  for(const id of ids){
    const local = state.purchase.find(p=>p.id===id); if(!local) continue;
    const ref = doc(f.db, "purchase", id);
    await runTransaction(f.db, async tx => {
      const snap = await tx.get(ref);
      const cur = snap.exists() ? snap.data() : null;
      if(cur && (cur.updated||0) > (local.updated||0)) return;
      tx.set(ref, Object.assign({}, local, {
        upBy: state.auth.name, upUid: state.auth.uid, serverAt: serverTimestamp()
      }), {merge:true});
    });
  }
}
function watchPurchase(f){
  const {collection, onSnapshot} = f.D;
  return onSnapshot(collection(f.db,"purchase"), snap=>{
    let changed=0;
    snap.forEach(d=>{
      const v=plainDoc(d.data()); if(!v || !v.id) return;
      const i=state.purchase.findIndex(p=>p.id===v.id);
      if(i<0){ state.purchase.push(v); changed++; }
      else if((v.updated||0) > (state.purchase[i].updated||0)){ state.purchase[i]=v; changed++; }
    });
    if(changed){
      state.purchase = state.purchase.filter(p=>!p.del);
      state.psync.last=Date.now(); saveSettings();
      if(state.view==="purchase" && V.purchase.repaint) V.purchase.repaint();
      paintBadges();
    }
    paintPBar();
  }, err=>{ state.psync.err=friendlyAuthError(err); paintPBar(); });
}

/* ---------- one shared quotation number ---------- */
/** Replaces the local counter when signed in. A Firestore transaction hands
    out exactly one number even if two people press Download together. */
/** Reserve the number and write the quotation in a single transaction.
    Either both happen or neither does, so a number can never be spent
    without a record, and a record can never exist without its number. */
async function fbFinaliseAtomic(draft){
  const f = await loadFirebase();
  if(!f || !usingFirebase()) return null;
  const {doc, runTransaction, serverTimestamp} = f.D;
  const numRef = doc(f.db, "teamSettings", "numbering");
  const qRef   = doc(f.db, "quotations", draft.id);   // the draft keeps this id across retries
  const N = state.numbering;

  return runTransaction(f.db, async tx => {
    // Read both first. Firestore requires every read before any write.
    const qSnap   = await tx.get(qRef);
    const numSnap = await tx.get(numRef);

    // A retry after the network dropped mid-commit: the quotation is already
    // there, so hand back its number rather than taking a second one.
    if(qSnap.exists()){
      const prev = qSnap.data();
      // the commit did land last time; hand back the whole record untouched
      return {no: prev.no, doc: prev, counter: null, lastIssued: null, reused: true};
    }

    const cur = numSnap.exists() ? numSnap.data() : null;

    if(!cur && !isAdmin())
      throw new Error("Numbering has not been set up yet. An administrator must open Settings and press Save shared settings once.");

    if(cur && cur.fy && N.fy && cur.fy !== N.fy)
      throw new Error(`The team is on financial year ${cur.fy}; this device is on ${N.fy}. Reload before finalising.`);

    const prefix = cur ? (cur.prefix || N.prefix) : N.prefix;
    const fy     = cur ? (cur.fy     || N.fy)     : N.fy;
    const pad    = cur ? (cur.pad    || N.pad || 3) : (N.pad || 3);
    const n      = Math.max(1, cur ? (+cur.next || 1) : (+N.next || 1));
    const no     = `${prefix}/${fy}/${String(n).padStart(pad,"0")}`;
    const lastIssued = {no, at:Date.now(), by:state.auth.name, uid:state.auth.uid};

    // One write to the counter, never a set followed by an update on a
    // document that did not exist when we read it.
    if(cur) tx.update(numRef, {next: n+1, lastIssued});
    else    tx.set(numRef, {prefix, fy, pad, next: n+1, lastIssued, serverAt: serverTimestamp()});

    // The number, the record and the server's own clock, all in one commit.
    tx.set(qRef, Object.assign({}, draft, {no, serverAt: serverTimestamp()}));

    return {no, counter:{prefix, fy, pad, next:n+1}, lastIssued};
  });
}

async function fbReserveNumber(){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return null;
  const {doc, runTransaction} = f.D;
  const ref = doc(f.db, "teamSettings", "numbering");
  const N = state.numbering;
  const out = await runTransaction(f.db, async tx => {
    const snap = await tx.get(ref);
    let cur = snap.exists() ? snap.data() : null;
    if(!cur){                                    // first ever use, seed from this device
      cur = {prefix:N.prefix, fy:N.fy, next:N.next, pad:N.pad||3};
      tx.set(ref, cur);
    }
    const n   = Math.max(1, +cur.next || 1);
    const no  = `${cur.prefix||N.prefix}/${cur.fy||N.fy}/${String(n).padStart(cur.pad||N.pad||3,"0")}`;
    tx.update(ref, {next: n+1, lastIssued:{no, at:Date.now(), by:state.auth.name, uid:state.auth.uid}});
    return {no, cur:{prefix:cur.prefix, fy:cur.fy, pad:cur.pad, next:n+1}};
  });
  if(out){
    Object.assign(state.numbering, out.cur);     // keep the local view in step
    return out.no;
  }
  return null;
}

/* ---------- moving what is already on this device into the team ---------- */
async function fbMigrateLocal(){
  if(!usingFirebase()) return toast("Sign in first");
  const stockKeys = Object.keys(state.stock);
  const reqIds    = state.purchase.filter(p=>!p.del).map(p=>p.id);
  if(!stockKeys.length && !reqIds.length) return toast("Nothing on this device to upload");
  if(!confirmAction(`Upload this device's records to the team?\n\n${stockKeys.length} stock item${stockKeys.length===1?"":"s"} and ${reqIds.length} purchase requirement${reqIds.length===1?"":"s"}.\n\nRecords keep their own identity, so anything already in the team list is updated rather than duplicated. A newer team figure is never overwritten by an older one from here, and no quantity can go below zero.`)) return;
  try{
    toast("Uploading…");
    await fbPushStock(stockKeys);
    await fbPushPurchase(reqIds);
    toast("Uploaded to the team");
  }catch(e){ toast("Upload failed: "+friendlyAuthError(e)); }
}

/* ---------- start listening once someone is signed in ---------- */
async function startTeam(){
  const f = await loadFirebase(); if(!f) return;
  fbUnsub.forEach(u=>{ try{u();}catch(e){} }); fbUnsub=[];
  fbUnsub.push(watchStock(f));
  fbUnsub.push(watchMoves(f));
  fbUnsub.push(watchPurchase(f));
  fbUnsub.push(watchProducts(f));
  fbUnsub.push(watchCustomers(f));
  fbUnsub.push(watchQuotes(f));
  fbUnsub.push(watchCompany(f));
  fbUnsub.push(watchNumbering(f));
  fbUnsub.push(watchCategories(f));
}

/* ---------- watch the sign-in state ---------- */
async function initAuth(){
  if(!fbConfigured()){ state.fb.state="unconfigured"; return; }
  state.fb.state="loading";
  const f = await loadFirebase();
  if(!f){ state.fb.state="error"; render(); return; }
  f.A.onAuthStateChanged(f.auth, async user => {
    if(!user){
      state.auth=null;
      if(state.backend==="firebase") state.backend="local";
      state.fb.state="signedout";
      render(); return;
    }
    try{
      const p = await loadProfile(user);
      if(p.missing){
        state.fb.state="noprofile"; state.auth=null;
        await f.A.signOut(f.auth);
        render(); return;
      }
      if(!p.active){
        state.fb.state="inactive"; state.auth=null;
        await f.A.signOut(f.auth);
        render(); return;
      }
      state.auth=p; state.backend="firebase"; state.fb.state="signedin"; state.fb.err="";
      saveSettings();
      await startTeam();
      render();
      toast(`Signed in as ${p.name}${p.role==="admin"?" (admin)":""}`);
    }catch(e){
      state.fb.err=friendlyAuthError(e); state.fb.state="error"; render();
    }
  });
}

/* ========================= products =========================
   The catalogue is seeded from the file, then Firestore becomes the source of
   truth once an admin runs the one-time initialisation. Seed data never
   overwrites a later edit: initialisation only writes a product document that
   does not already exist, so running it twice changes nothing. */

/* Fold the 2026 catalogue into the book. Existing groups keep their ids so
   stock keys and past quotation lines stay connected. */
(function mergeCatalogue(){
  const gate = BOOK.groups.find(g=>g.id==="gate");
  if(gate) SLIDING2026_NEW.forEach(it=>{ if(!gate.items.some(x=>x.m===it.m)) gate.items.push(it); });
  CAT2026.forEach(g=>{ if(!BOOK.groups.some(x=>x.id===g.id)) BOOK.groups.push(g); });
})();

const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const pid  = (gid,m) => `${gid}|${m}`;

/** Every product, flattened, with its group. */
function allProducts(){
  const out=[];
  BOOK.groups.forEach(g=>itemsOf(g.id).forEach(it=>out.push({g, it, id:pid(g.id,it.m)})));
  return out;
}
/** Guard against a second product with the same model or name in a category. */
/** Only an identical model number is a duplicate. Two products with similar
    descriptions but different model numbers are two products. */
function findClash(gid, model, name, exceptModel){
  const nm=norm(model);
  for(const {g,it} of allProducts()){
    if(g.id===gid && it.m===exceptModel) continue;
    if(norm(label(g.id,it).m)===nm || norm(it.m)===nm) return {it, g, why:"model"};
  }
  return null;
}

/* ---------- prices that may legitimately be missing ---------- */
const hasPrice = (gid,m,tier) => rate(gid,m,tier).v != null;
const priceText = v => v==null ? "Price not set" : money(v);

/** Products where a source conflict left the price unset, or that need review. */
function conflictList(){
  const out=[];
  allProducts().forEach(({g,it,id})=>{ if(it.conflict) out.push({kind:"conflict", g, it, id, c:it.conflict}); });
  PRICE_REVIEW_2026.forEach(([gid,m,newCl,srcNote])=>{
    const it=itemBy(gid,m); if(!it) return;
    const cur=rate(gid,m,"client").v;
    const done=(state.priceReviewed||{})[pid(gid,m)];
    if(done || (cur!=null && Math.abs(cur-newCl)<1)) return;
    out.push({kind:"review", g:groupById(gid), it, id:pid(gid,m), cur, proposed:newCl, srcNote});
  });
  return out;
}
const conflictCount = () => conflictList().length;

/* ---------- Firestore products ---------- */
/** Document id is the seed key, so a rename never orphans stock or history. */
const docId = (gid,m) => `${gid}__${String(m).replace(/[\/\.#$\[\]]/g,"_")}`;

async function fbPushProduct(gid, m){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  if(!isAdmin()) throw new Error("Only an administrator can change products");
  const {doc, setDoc, serverTimestamp} = f.D;
  const it = itemBy(gid,m); if(!it) return;
  const L  = label(gid,it), ov = ovOf(gid,m);
  await setDoc(doc(f.db,"products",docId(gid,m)), {
    id: pid(gid,m), key: pid(gid,m), group: gid, seedModel: m,
    model: L.m, name: L.n, unit: L.u,
    spec: it.spec || "", gst: (ov.gst!=null?ov.gst:(groupById(gid).gst||18)),
    dealer:     rate(gid,m,"dealer").v,
    contractor: rate(gid,m,"contractor").v,
    client:     rate(gid,m,"client").v,
    conflictResolved: !it.conflict,
    categoryId: categoryOf(gid, it),
    active: !L.hidden,
    updated: Date.now(), serverAt: serverTimestamp(),
    by: state.auth.name, byUid: state.auth.uid
  }, {merge:true});
}
async function fbDeleteProduct(gid, m){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, deleteDoc} = f.D;
  await deleteDoc(doc(f.db,"products",docId(gid,m)));
}
function applyProductDoc(v){
  if(!v || !v.group) return false;
  const gid=v.group, m=v.seedModel || v.model;     // the seed key, not the display model
  if(!m) return false;
  let it=itemBy(gid,m);
  if(!it){                                   // a product created on another device
    state.custom[gid]=state.custom[gid]||[];
    state.custom[gid].push({m, n:v.name||m, u:v.unit, d:null, c:null, cl:null, spec:v.spec||"", custom:true});
    it=itemBy(gid,m);
  }
  if(v.model && v.model!==m) setOv(gid,m,"md", v.model);
  setOv(gid,m,"nm", v.name||null);
  setOv(gid,m,"u",  v.unit||null);
  // Firestore is the source of truth once seeded, so an explicitly empty price
  // is recorded as empty rather than falling back to the seed figure.
  setOv(gid,m,"d",  v.dealer==null     ? NULLP : v.dealer);
  setOv(gid,m,"c",  v.contractor==null ? NULLP : v.contractor);
  setOv(gid,m,"cl", v.client==null     ? NULLP : v.client);
  setOv(gid,m,"gst",v.gst==null?null:v.gst);
  setOv(gid,m,"x",  v.active===false?1:null);
  if(v.spec!=null) it.spec = v.spec;
  if(v.categoryId){ state.catOf = state.catOf||{}; state.catOf[pid(gid,m)] = v.categoryId; }
  if(v.conflictResolved && it.conflict){          // a decision made on another device
    delete it.conflict;
    state.priceReviewed=state.priceReviewed||{};
    state.priceReviewed[pid(gid,m)]=v.updated||Date.now();
  }
  return true;
}
async function fbPushCategories(){
  const f=await loadFirebase(); if(!f || !usingFirebase()) return;
  if(!isAdmin()) throw new Error("Only an administrator can change categories");
  const {doc, setDoc} = f.D;
  await setDoc(doc(f.db,"teamSettings","categories"),
    {map: state.categories||{}, updated:Date.now(), by:state.auth.name}, {merge:true});
}
function watchCategories(f){
  const {doc, onSnapshot} = f.D;
  return onSnapshot(doc(f.db,"teamSettings","categories"), snap=>{
    if(!snap.exists()) return;
    const v=snap.data();
    if(v && v.map && typeof v.map==="object"){
      state.categories = v.map; saveSettings();
      if(["catalogue","products"].includes(state.view)) render();
    }
  }, err=>{ toast("Categories are not syncing: "+friendlyAuthError(err)); });
}

function watchProducts(f){
  const {collection, onSnapshot} = f.D;
  return onSnapshot(collection(f.db,"products"), snap=>{
    let n=0;
    snap.forEach(d=>{ if(applyProductDoc(d.data())) n++; });
    state.fsProducts = snap.size;                 // the real initialisation state
    state.seeded = snap.size > 0;
    if(n || snap.size){ saveSettings(); refreshAll();
      if(state.view==="products" && V.products.repaint) V.products.repaint(); }
  }, err=>{ toast("Products sync: "+friendlyAuthError(err)); });
}

/** One-time, idempotent. Writes only products Firestore does not already hold. */
async function fbInitProducts(){
  if(!usingFirebase()) return toast("Sign in first");
  if(!isAdmin())       return toast("Only an administrator can initialise shared products");
  const f = await loadFirebase(); if(!f) return;
  const {collection, getDocs, doc, writeBatch} = f.D;

  const list = allProducts();
  const existing = new Set();
  try{
    const snap = await getDocs(collection(f.db,"products"));
    snap.forEach(d=>existing.add(d.id));
  }catch(e){ return toast("Could not read the product list: "+friendlyAuthError(e)); }

  const todo = list.filter(p=>!existing.has(p.id.replace(/\//g,"_")));
  if(!todo.length){
    return toast(`Products already initialised — ${existing.size} products in Firestore, nothing to add`);
  }
  if(!confirm(`Initialise shared products?\n\n${todo.length} product${todo.length===1?"":"s"} will be written to Firestore.\n${existing.size} already there and will not be touched.\n\nThis is safe to run twice — existing products are never overwritten.`)) return;

  const btn=$("#pInit"); if(btn){ btn.disabled=true; btn.textContent="Writing…"; }
  try{
    for(let i=0;i<todo.length;i+=400){
      const batch = writeBatch(f.db);
      todo.slice(i,i+400).forEach(({g,it,id})=>{
        const L=label(g.id,it), ov=ovOf(g.id,it.m);
        batch.set(doc(f.db,"products",id.replace(/\//g,"_")), {
          id, group:g.id, seedModel:it.m, categoryId:categoryOf(g.id,it),
          model:L.m, name:L.n, unit:L.u, spec:it.spec||"",
          gst: ov.gst!=null?ov.gst:(g.gst||18),
          dealer:     rate(g.id,it.m,"dealer").v,
          contractor: rate(g.id,it.m,"contractor").v,
          client:     rate(g.id,it.m,"client").v,
          active: !L.hidden, seeded:true,
          updated: Date.now(), by: state.auth.name, byUid: state.auth.uid
        });
      });
      await batch.commit();
    }
    state.seeded = true; saveSettings();
    toast(`Products initialised — ${todo.length} products added`);
    if(V.products.repaint) V.products.repaint();
  }catch(e){
    toast("Initialisation failed: "+friendlyAuthError(e));
  }finally{ if(btn){ btn.disabled=false; btn.textContent="Initialise shared products"; } }
}

      state.custom[gid]=(state.custom[gid]||[]).filter(x=>x.m!==m);
      if(state.ov[gid]) delete state.ov[gid][m];
      saveSettings();
      if(usingFirebase()) fbDeleteProduct(gid,m)
        .then(()=>toast(`${m} deleted everywhere`))

      render(); return;
    }
    form(`Edit ${L.m}`, {
      m:L.m, gid, catId:categoryOf(gid,it), n:L.n, spec:it.spec||"", u:L.u,

    }, out=>{

        if(clash){ toast(`Already exists — ${clash.it.m}`); return false; }
      }
      const moving = out.gid !== gid;
      if(moving && !it.custom){
        toast("Only a product you added can move category. Archive this one and add it in the other category.");
        return false;
      }
      setOv(gid,m,"md", out.m!==m ? out.m : null);
      setOv(gid,m,"nm", out.n);
      setOv(gid,m,"u",  out.u);
      setOv(gid,m,"gst", out.gst);
      setOv(gid,m,"d",  out.d==null ? NULLP : out.d);
      setOv(gid,m,"c",  out.c==null ? NULLP : out.c);
      setOv(gid,m,"cl", out.cl==null ? NULLP : out.cl);
      it.spec = out.spec;
      if(out.catId) setCategory(gid, m, out.catId);
      if(it.conflict && out.cl!=null){

      if(moving){
        // rebuild in the new category and take the old document with it
        const carried=Object.assign({}, it, {m:out.m, n:out.n, spec:out.spec, u:out.u,
          d:out.d, c:out.c, cl:out.cl, custom:true});
        state.custom[gid]=(state.custom[gid]||[]).filter(x=>x.m!==m);
        if(state.ov[gid]) delete state.ov[gid][m];
        state.custom[out.gid]=state.custom[out.gid]||[];
        state.custom[out.gid].push(carried);
        saveSettings();
        if(usingFirebase()){
          fbDeleteProduct(gid,m).catch(()=>{});
          fbPushProduct(out.gid,out.m).catch(e=>toast(friendlyAuthError(e)));
        }
      } else {
        saveSettings();
        if(usingFirebase()) fbPushProduct(gid,m).catch(e=>toast(friendlyAuthError(e)));
      }
      render(); toast(`${out.m} saved`);
    });

  draw();
  const st=$("#pState2");
  if(st) st.textContent = usingFirebase()
    ? (state.fsProducts>0

        : "Not initialised yet — press Initialise shared products")
    : "Saved on this device";
};

/* ========================= finalising a quotation =========================
   A number is spent only on finalise. Drafts, previews and edits cost nothing.
   With Firebase selected the number comes from a Firestore transaction, so two
   people finalising at the same moment cannot be handed the same one — and
   there is deliberately no local fallback, because a fallback is exactly how
   duplicates happen. */

const isFinalised = () => !!state.quoteNo;

function partyFromForm(){
  const g = id => { const el=$(id); return el ? el.value.trim() : ""; };
  return {
    name: g("#qClient"), site: g("#qSite"), gstin: g("#qGst"),
    contact: g("#qContact"), phone: g("#qPhone"),
    email: g("#qEmail"), address: g("#qAddr")
  };
}
function fillParty(c){
  const set=(id,v)=>{ const el=$(id); if(el) el.value=v||""; };
  set("#qClient",c.name); set("#qSite",c.city||c.site); set("#qGst",c.gstin);
  set("#qContact",c.contact); set("#qPhone",c.phone);
  set("#qEmail",c.email); set("#qAddr",c.address);
  state.partyId = c.id || null;
  saveDraft();
}

async function finaliseQuote(){
  if(!quoteLines().length){ toast("Add a line to the quotation first"); return null; }
  if(isFinalised()) return state.quoteNo;

  if(usingFirebase() && !navigator.onLine){
    toast("Finalising needs an internet connection — the number is shared with the team");
    return null;
  }
  const btn=$("#btnFinal"); if(btn){ btn.disabled=true; btn.textContent="Finalising…"; }
  try{
    // The whole record is built first, so the transaction has everything it needs.
    if(!state.draftId) state.draftId = newDraftId();   // survives a failed attempt
    // The link is worked out again from what is on the form right now, so a
    // party that was picked and then typed over cannot be carried into the
    // record. Nothing new is created here: an unsaved customer simply has no
    // party id, and the quotation keeps its own copy of the details either way.
    state.partyId = resolvePartyId();
    const F0 = firmNow();
    const draft = {
      id: state.draftId,
      at: Date.now(),
      by: currentUserName(), byUid: currentUserId(),
      tier: state.tier, tierName: TIERNAME[state.tier],
      partyId: state.partyId || null,
      party: partyFromForm(),
      lines: quoteLines().map(l=>({t:l.t, s:l.s, u:l.u, qty:l.qty, rate:l.rate, origRate:l.origRate,
                                   k:l.k||null, manual:!!l.manual, amt:amtOf(l)})),
      gst: state.gst, gstPct: gstPercent(),
      subtotal: subtotal(), total: grandTotal(),
      status: "Finalised",
      // what the quotation said on the day. Text only — the logo and QR are
      // not copied into every record, the current images are used.
      snap: {
        name:F0.name, tag:F0.tag, addr:F0.addr, phones:F0.phones,
        email:F0.email, web:F0.web, gstin:F0.gstin, pan:F0.pan,
        bank:{name:F0.bank.name, branch:F0.bank.branch, acc:F0.bank.acc,
              ifsc:F0.bank.ifsc, upi:F0.bank.upi},
        terms: termsList(), notes: notesList(),
        validityDays: CO("validityDays"), gstPct: gstPercent(),
        payTerms: CO("payTerms"), warranty: CO("warranty"), pdfFooter: CO("pdfFooter")
      }
    };

    let no;
    if(usingFirebase()){
      const out = await fbFinaliseAtomic(draft);          // number and record together
      if(!out || !out.no) throw new Error("The shared counter did not respond");
      no = out.no;
      if(out.reused){
        // nothing was taken this time, so the counter and lastIssued stand
        if(out.doc) Object.assign(draft, out.doc);
      }else if(out.counter){
        Object.assign(state.numbering, out.counter, {lastIssued: out.lastIssued});
      }
    } else {
      no = await assignQuoteNo();                         // this device only
      if(!no) throw new Error("Could not take the next number");
    }

    // Only now is the quotation finalised. Until this line it is still a draft.
    draft.no = no;
    state.quoteNo = no;
    state.draftId = null;                 // this record is closed
    upsertQuote(draft);                   // the listener may have beaten us to it
    clearDraft();
    const el=$("#qRef"); if(el){ el.value = no; el.placeholder = nextPreview(); }
    saveSettings();

    /* No party is created here. A party joins the Parties list only when the
       user presses "Save this customer", or picks one that is already saved —
       and in that case its stable id is on the draft above, before the
       transaction runs. Either way the quotation keeps its own snapshot of the
       details in draft.party, so editing the party later never rewrites it. */
    renderDocket();
    toast(`Finalised as ${no}`);
    return no;
  }catch(e){
    // nothing was consumed and nothing is marked finalised
    state.quoteNo = null;
    renderDocket();
    toast("Not finalised — "+friendlyAuthError(e)+" Your quotation is untouched.");
    return null;
  }finally{
    if(btn){ btn.disabled=false; btn.textContent = isFinalised()?`Finalised · ${state.quoteNo}`:"Finalise quotation"; }
  }
}

async function fbSaveQuote(snap){
  const f=await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, setDoc} = f.D;
  // a generated id, never the number itself — a number contains slashes
  await setDoc(doc(f.db,"quotations",snap.id), snap);
}
/** One record per quotation id, whichever arrives first. */
function upsertQuote(q){
  if(!q || !q.id) return;
  const i = state.quotes.findIndex(x => x.id === q.id);
  if(i < 0){ state.quotes.push(q); }
  else {
    const merged = Object.assign({}, state.quotes[i], q);
    // a record that has come back cancelled stays cancelled, and one that has
    // not been cancelled must not inherit a stale cancellation
    if(!q.cancelledAt && q.status && q.status !== "Cancelled"){
      delete merged.cancelledBy; delete merged.cancelledAt;
    }
    state.quotes[i] = merged;
  }
  state.quotes.sort((a,b) => (b.at||0) - (a.at||0));
}

function watchQuotes(f){
  const {collection, onSnapshot, query, orderBy, limit} = f.D;
  return onSnapshot(query(collection(f.db,"quotations"), orderBy("at","desc"), limit(200)), snap=>{
    let n = 0;
    // Firestore tells us exactly which documents changed. Cancelling a
    // quotation touches only status, cancelledBy and cancelledAt — it never
    // moves `at` — so comparing timestamps would miss it on every other
    // device. Every added or modified document is merged, whatever changed.
    snap.docChanges().forEach(ch => {
      if(ch.type === "removed") return;          // a quotation is never deleted
      const v = plainDoc(ch.doc.data());
      if(!v || !v.id) return;
      upsertQuote(v);
      n++;
    });
    if(n){
      saveSettings();
      // the History screen shows the cancellation the moment it arrives
      if(state.view === "history" && V.history.repaint) V.history.repaint();
    }
  }, err=>{ /* history is not critical enough to shout about */ });
}

/* ========================= parties =========================
   Clients, dealers and contractors, saved once and reused. A party has a
   stable id; a finalised quotation keeps its own copy of the details, so
   editing a party later never rewrites history. */

const custId = () => "c_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const digits = s => String(s||"").replace(/\D/g,"");

const PARTY_TYPES = [["client","Client"],["dealer","Dealer"],["contractor","Contractor"]];
const partyTypeName = v => (PARTY_TYPES.find(x=>x[0]===v) || PARTY_TYPES[0])[1];

/* ---- validation, friendly rather than fussy ---- */
const GSTIN_RE = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/;
/** "" is fine. Anything else must look like a real GSTIN. */
function gstinProblem(v){
  const s = String(v||"").trim().toUpperCase();
  if(!s) return null;
  if(s.length !== 15) return "A GSTIN is 15 characters, for example 27FXJPK9635L1ZM";
  if(!GSTIN_RE.test(s)) return "That GSTIN does not look right — check it against the certificate";
  return null;
}
/** "" is fine. Otherwise 10 digits, optionally with a country code. */
function phoneProblem(v){
  const s = String(v||"").trim();
  if(!s) return null;
  const d = digits(s);
  if(d.length < 10) return "A phone number needs at least 10 digits";
  if(d.length > 13) return "That phone number has too many digits";
  return null;
}
const emailProblem = v => (!String(v||"").trim() || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim()))
  ? null : "That does not look like an email address";

/** Do these typed details still describe this saved party? GSTIN first, then
    phone, then company name — the order of reliability. */
function sameParty(p, c){
  if(!p || !c) return false;
  const g=norm(p.gstin), ph=digits(p.phone), nm=norm(p.name);
  return !!((g  && norm(c.gstin)===g) ||
            (ph && ph.length>=7 && digits(c.phone)===ph) ||
            (nm && norm(c.name)===nm));
}
/** Match on GSTIN first, then phone, then name — the order of reliability. */
function findCustomer(p, exceptId){
  return state.customers.find(c=> c.id!==exceptId && !c.archived && sameParty(p, c));
}

/** Which saved party the details currently on the quotation belong to.
    Returns its id, or null. A link that no longer matches what is typed is
    never kept — that is how a quotation ends up on the wrong party. */
function resolvePartyId(){
  const onForm = partyFromForm();
  if(!onForm.name && !onForm.gstin && !onForm.phone) return null;
  // the party that was picked keeps the link, but only while it still fits
  const held = state.partyId ? state.customers.find(c => c.id === state.partyId) : null;
  if(held && sameParty(onForm, held)) return held.id;
  const found = findCustomer(onForm);
  return found ? found.id : null;
}
/** Why we think two records are the same party — said in plain words. */
function matchReason(a, b){
  if(a.gstin && norm(a.gstin)===norm(b.gstin)) return "the same GSTIN";
  if(a.phone && digits(a.phone).length>=7 && digits(a.phone)===digits(b.phone)) return "the same phone number";
  return "the same company name";
}
/** Every finalised quotation that belongs to this party. */
function quotesForParty(c){
  const g=norm(c.gstin), ph=digits(c.phone), nm=norm(c.name);
  return state.quotes.filter(q=>{
    if(q.partyId && q.partyId===c.id) return true;
    const p=q.party||{};
    return (g && norm(p.gstin)===g) || (ph && ph.length>=7 && digits(p.phone)===ph) || (nm && norm(p.name)===nm);
  }).sort((a,b)=>(b.at||0)-(a.at||0));
}
function saveParty(p, quiet){
  if(!p || !p.name) return null;
  const now=Date.now(), who=currentUserName();
  let c=findCustomer(p);
  if(c){
    // fill gaps and take genuine changes — never blank a detail already held
    if(p.site) c.city=p.site;
    ["gstin","contact","phone","email","address"].forEach(k=>{ if(p[k]) c[k]=p[k]; });
    if(p.type) c.type=p.type;
    c.updated=now; c.upBy=who; c.upUid=currentUserId();
  }else{
    c={id:custId(), name:p.name, type:p.type || state.tier || "client",
       city:p.site||"", gstin:p.gstin||"", contact:p.contact||"",
       phone:p.phone||"", email:p.email||"", address:p.address||"", notes:"",
       t:now, by:who, byUid:currentUserId(), updated:now, upBy:who, upUid:currentUserId()};
    state.customers.push(c);
  }
  saveSettings();
  if(usingFirebase()) fbPushCustomer(c).catch(()=>{});
  if(!quiet) toast(`${c.name} saved`);
  return c;
}
async function fbDeleteCustomer(id){
  const f=await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, deleteDoc} = f.D;
  await deleteDoc(doc(f.db,"customers",id));
}
async function fbPushCustomer(c){
  const f=await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, setDoc, serverTimestamp} = f.D;
  await setDoc(doc(f.db,"customers",c.id),
    Object.assign({}, c, {upUid:currentUserId(), serverAt: serverTimestamp()}), {merge:true});
}
function watchCustomers(f){
  const {collection, onSnapshot} = f.D;
  return onSnapshot(collection(f.db,"customers"), snap=>{
    let n=0;
    snap.docChanges().forEach(ch=>{
      const v=plainDoc(ch.doc.data()); if(!v||!v.id) return;
      if(ch.type==="removed"){
        // an administrator deleted it, so it goes from this device as well
        const before=state.customers.length;
        state.customers=state.customers.filter(c=>c.id!==v.id);
        if(state.customers.length!==before) n++;
        return;
      }
      const i=state.customers.findIndex(c=>c.id===v.id);
      if(i<0){ state.customers.push(v); n++; }
      // archiving changes `updated`, so an archive or a restore lands here too
      else if((v.updated||0)>=(state.customers[i].updated||0)){ state.customers[i]=v; n++; }
    });
    if(n){
      saveSettings();
      if(state.view==="customers" && V.customers.repaint) V.customers.repaint();
      else if(state.view==="history" && V.history.repaint) V.history.repaint();
    }
  }, err=>{});
}

          email: box.querySelector("#xE").value.trim(),
          gstin: box.querySelector("#xG").value.trim().toUpperCase(),
          city: box.querySelector("#xCity").value.trim(),
          address: box.querySelector("#xA").value.trim(),
          notes: box.querySelector("#xNo").value.trim()
        };
        if(!v.name){ toast("Enter the company or party name"); return false; }
        const bad = gstinProblem(v.gstin) || phoneProblem(v.phone) || emailProblem(v.email);
        if(bad){ toast(bad); return false; }
        return onSave(v);
      }
    });
  }

  $("#cuAdd").onclick = () => partyForm({}, "Add party", v => {
    const dup = findCustomer(v);
    if(dup){
      const ok = confirmAction(
        `“${dup.name}” is already saved with ${matchReason(v, dup)}.\n\n` +
        `OK — update that party with these details.\n` +
        `Cancel — keep them as two separate parties.`);
      if(ok){
        Object.assign(dup, v, {updated:Date.now(), upBy:currentUserName(), upUid:currentUserId()});
        saveSettings();
        if(usingFirebase()) fbPushCustomer(dup).catch(()=>{});
        draw(); toast(`${dup.name} updated`);
        return;
      }
    }
    const c = Object.assign({id:custId(), t:Date.now(), by:currentUserName(), byUid:currentUserId(),
                             updated:Date.now(), upBy:currentUserName()}, v);
    state.customers.push(c);
    saveSettings();
    if(usingFirebase()) fbPushCustomer(c).catch(()=>{});
    draw(); toast(`${c.name} saved`);
  });

  $("#cuList").addEventListener("click", e=>{
    const b = e.target.closest("[data-cuse],[data-cued],[data-cuarch],[data-cures],[data-cudel],[data-cuq]");
    if(!b) return;
    const id = b.dataset.cuse || b.dataset.cued || b.dataset.cuarch || b.dataset.cures || b.dataset.cudel || b.dataset.cuq;
    const c = state.customers.find(x=>x.id===id); if(!c) return;

    if(b.dataset.cuse != null){
      fillParty(c);
      state.partyId = c.id;                       // the quotation remembers which party
      if(c.type && TIERNAME[c.type] && !state.lines.length) setTier(c.type);
      toast(`${c.name} filled into the quotation`);
      showSheet(); return;
    }
    if(b.dataset.cuq != null){
      const qs = quotesForParty(c);
      openModal(`Quotations for ${c.name}`,
        `<div class="plist">${qs.map(x=>`<div class="prow"><div class="nm">
            <b>${esc(x.no||"Draft")}</b>
            <span class="tag ${x.status==="Cancelled"?"w":"g"}">${esc(x.status||"Finalised")}</span>
            <span class="qtyline">${(x.lines||[]).length} line${(x.lines||[]).length===1?"":"s"} · <b>${money(x.total)}</b></span>
            <span class="meta">${esc(x.by||"unnamed")} · ${stamp(x.at)}</span></div></div>`).join("")}</div>`,
        {ok:"Close", hideCancel:true, onSave:()=>{}});
      return;
    }
    if(b.dataset.cuarch != null){
      if(!confirmAction(`Archive ${c.name}?\n\nIt is hidden from the list but nothing is deleted, and past quotations keep their own copy of the details.`)) return;
      c.archived = 1; c.updated = Date.now(); c.upBy = currentUserName();
      saveSettings(); if(usingFirebase()) fbPushCustomer(c).catch(()=>{});
      draw(); toast(`${c.name} archived`); return;
    }
    if(b.dataset.cures != null){
      c.archived = 0; c.updated = Date.now(); c.upBy = currentUserName();
      saveSettings(); if(usingFirebase()) fbPushCustomer(c).catch(()=>{});
      draw(); toast(`${c.name} restored`); return;
    }
    if(b.dataset.cudel != null){
      if(!admin) return toast("Only an administrator can delete a party");
      if(!confirmAction(`Delete ${c.name} permanently?\n\nArchiving is usually the better choice — it keeps the record. This cannot be undone.`)) return;
      state.customers = state.customers.filter(x=>x.id!==c.id);
      saveSettings();
      if(usingFirebase()) fbDeleteCustomer(c.id)
        .then(()=>toast(`${c.name} deleted`))
        .catch(err=>toast("Deleted here, but not for the team: "+friendlyAuthError(err)));
      else toast(`${c.name} deleted`);
      draw(); return;
    }
    // edit
    if(!admin && c.archived) return toast("Only an administrator can change an archived party");
    partyForm(c, `Edit ${c.name}`, v => {
      const dup = findCustomer(v, c.id);
      if(dup && !confirmAction(`“${dup.name}” already has ${matchReason(v, dup)}.\n\nSave these details anyway?`)) return false;
      Object.assign(c, v, {updated:Date.now(), upBy:currentUserName(), upUid:currentUserId()});
      saveSettings(); if(usingFirebase()) fbPushCustomer(c).catch(()=>{});
      draw(); toast(`${c.name} updated`);
    });
  });
  draw();
};

/* ========================= quotation history =========================
   Everything that has been issued, plus the draft still on this device. A
   finalised record is a snapshot: editing a product or a party afterwards
   never changes what an old quotation says. */

/** The unfinished quotation on this device, shown alongside the issued ones. */
function draftRow(){
  if(isFinalised() || !state.lines.length) return null;
  const sub = subtotal(), gst = state.gst ? sub*gstRate() : 0;
  return {
    id: state.draftId || "draft",
    draft: true,
    no: null,
    at: Date.now(),
    by: currentUserName(),
    tier: state.tier, tierName: TIERNAME[state.tier],
    partyId: state.partyId || null,
    party: partyFromForm(),
    lines: quoteLines().map(l=>({t:l.t, s:l.s, u:l.u, qty:l.qty, rate:l.rate, amt:amtOf(l)})),
    gst: state.gst, gstPct: gstPercent(),
    subtotal: sub, total: sub+gst,
    status: "Draft"
  };
}
const quoteStatus = q => q.draft ? "Draft" : (q.status || "Finalised");

async function cancelQuote(q){
  q.status = "Cancelled";
  q.cancelledBy = currentUserName();
  q.cancelledAt = Date.now();
  upsertQuote(q);
  saveSettings();
  if(usingFirebase()){
    try{
      const f = await loadFirebase();
      const {doc, updateDoc} = f.D;
      await updateDoc(doc(f.db,"quotations",q.id),
        {status:"Cancelled", cancelledBy:q.cancelledBy, cancelledAt:q.cancelledAt});
      // status, cancelledBy and cancelledAt are the only fields the rules allow
    }catch(e){ toast("Cancelled here, but not for the team: "+friendlyAuthError(e)); }
  }
}
