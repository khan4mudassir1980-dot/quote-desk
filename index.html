      return;
    }
    $("#prList").innerHTML = `<div class="plist">${rows.map(p=>{
      const U=URGENCY[p.urgency]||URGENCY.normal;
      const changed = p.updated && p.updated - (p.t||0) > 60000;
      return `<div class="prow ${U.cls}">
        <div class="nm">
          <b>${esc(p.name)}</b>
          <span class="tag ${U.cls}">${U.dot} ${esc(U.label)}</span>
          <span class="tag${p.status==="Ordered"?" o":""}">${esc(p.status)}</span>
          <span class="qtyline">Quantity needed: <b>${num(p.qty,0)}</b></span>
          ${p.note?`<span>${esc(p.note)}</span>`:""}
          <span class="meta">Added by ${esc(p.by||"unnamed")} · ${stamp(p.t)}</span>
          ${changed?`<span class="meta">Updated by ${esc(p.upBy||p.by||"unnamed")} · ${stamp(p.updated)}</span>`:""}
        </div>
        <div class="practs">
          <select data-pstat="${p.id}" aria-label="Status">
            <option${p.status==="Needed"?" selected":""}>Needed</option>
            <option${p.status==="Ordered"?" selected":""}>Ordered</option>
            <option${p.status==="Cancelled"?" selected":""}>Cancelled</option></select>
          <button class="btn pri sm" data-prcv="${p.id}">Mark received</button>
          <button class="btn gh sm" data-pedit="${p.id}">Edit</button>
          <button class="btn gh sm" data-pdel="${p.id}">Delete</button>
        </div>
      </div>`;
    }).join("")}</div>`;
  };

  const drawHistory = () => {
    const q=($("#hQ").value||"").toLowerCase().trim();
    const from=$("#hFrom").value ? new Date($("#hFrom").value+"T00:00:00").getTime() : 0;
    const to  =$("#hTo").value   ? new Date($("#hTo").value+"T23:59:59").getTime()   : Infinity;
    const all=receivedReqs();
    $("#prHistN").textContent=all.length;
    const rows=all.filter(p=>{
      const t=p.rcvAt||p.updated||p.t||0;
      if(t<from || t>to) return false;
      if(q && !((p.name+" "+(p.by||"")+" "+(p.rcvBy||"")).toLowerCase().includes(q))) return false;
      return true;
    }).sort((a,b)=>(b.rcvAt||0)-(a.rcvAt||0));
    if(!rows.length){
      $("#prHist").innerHTML=`<div class="empty">${all.length?"Nothing matches those filters.":"Nothing received yet."}</div>`;
      return;
    }
    $("#prHist").innerHTML = `<div class="plist">${rows.map(p=>{
      const U=URGENCY[p.urgency]||URGENCY.normal;
      const short = p.rcvQty!=null && p.rcvQty<p.qty;
      return `<div class="prow st-received">
        <div class="nm">
          <b>${esc(p.name)}</b>
          <span class="tag ${U.cls}">${U.dot} ${esc(U.label)}</span>
          ${p.stocked?`<span class="tag g">added to stock</span>`:""}
          <span class="qtyline">Requested <b>${num(p.qty,0)}</b> · received <b>${num(p.rcvQty!=null?p.rcvQty:p.qty,0)}</b>${short?` <span class="short">short by ${num(p.qty-p.rcvQty,0)}</span>`:""}</span>
          ${p.note?`<span>${esc(p.note)}</span>`:""}
          <span class="meta">Requested by ${esc(p.by||"unnamed")} · ${stamp(p.t)}</span>
          <span class="meta">Received by ${esc(p.rcvBy||"unnamed")} · ${stamp(p.rcvAt)}</span>
        </div>
        <div class="practs"><button class="btn gh sm" data-pundo="${p.id}">Undo / restore</button></div>
      </div>`;
    }).join("")}</div>`;
  };

  const draw = () => { drawActive(); drawHistory(); };
  V.purchase.repaint = draw;

  ["prQ","prFU","prFS"].forEach(id=>{ $("#"+id).addEventListener("input",drawActive); $("#"+id).addEventListener("change",drawActive); });
  ["hQ","hFrom","hTo"].forEach(id=>{ $("#"+id).addEventListener("input",drawHistory); $("#"+id).addEventListener("change",drawHistory); });

    const qty=+$("#prQty").value;
    if(isNaN(qty) || qty<=0) return toast("Quantity must be more than zero");

    const dup=activeReqFor(name,key);
    if(dup){
      if(confirm(`“${dup.name}” already has an open requirement for ${dup.qty}.\n\nOK — add ${qty} to that one.\nCancel — keep them as two separate entries.`)){

      if(!p || p.received) return;
      rcv.disabled=true;                                   // guards a double tap
      try{
        if(!confirm(`Mark “${p.name}” as received?\n\nIt moves out of the active list into purchase history.`)) return;
        const ans=prompt(`How many were actually received?\n(Requested ${p.qty})`, p.qty);
        if(ans===null) return;
        const got=+ans;
        if(isNaN(got) || got<0) return toast("Enter a valid received quantity");

        p.rcvQty=got; p.rcvBy=currentUserName(); p.rcvAt=Date.now();
        p.received=1; p.status="Received";

        if(p.key && got>0 && !p.stocked){

          }

          toast("Moved to purchase history");
        }
        p.upBy=p.rcvBy; touchReq(p); draw();
        $("#prHistBox").open=true;

      return;
    }
    /* ---- delete ---- */
    const del=e.target.closest("[data-pdel]");
    if(del){
      const p=state.purchase.find(x=>x.id===del.dataset.pdel); if(!p) return;
      if(!confirm(`Delete the requirement for “${p.name}”?\n\nThis cannot be undone.`)) return;
      p.del=1; p.upBy=currentUserName(); touchReq(p);
      if(!state.sync.url) state.purchase=state.purchase.filter(x=>x.id!==p.id);
      saveSettings(); draw(); toast("Requirement deleted"); return;
    }
    /* ---- edit ---- */
    const ed=e.target.closest("[data-pedit]");
    if(ed){
      const p=state.purchase.find(x=>x.id===ed.dataset.pedit); if(!p) return;
      const q=prompt(`Quantity needed for “${p.name}”`, p.qty);
      if(q===null) return;
      const n=+q;
      if(isNaN(n) || n<=0) return toast("Quantity must be more than zero");
      const u=prompt("Urgency — type 1 for very urgent, 2 for can wait 1–2 days, 3 for needed later",
        p.urgency==="critical"?"1":p.urgency==="urgent"?"2":"3");
      if(u!==null){ const map={"1":"critical","2":"urgent","3":"normal"}; if(map[String(u).trim()]) p.urgency=map[String(u).trim()]; }
      const nt=prompt("Note (leave blank to clear)", p.note||"");
      if(nt!==null) p.note=nt.trim();
      p.qty=n; p.upBy=currentUserName(); touchReq(p); draw(); toast("Requirement updated");
    }
  });

  /* ---- undo a received item ---- */
  $("#prHist").addEventListener("click", e=>{
    const u=e.target.closest("[data-pundo]"); if(!u) return;
    const p=state.purchase.find(x=>x.id===u.dataset.pundo); if(!p) return;
    const tookStock = p.stocked && p.stockedQty>0;
    const msg = tookStock
      ? `Restore “${p.name}” to the active list?\n\n${p.stockedQty} was added to stock when it was received. OK will also take that back out.`
      : `Restore “${p.name}” to the active list?`;
    if(!confirm(msg)) return;
    if(tookStock && p.key){
      const [gid,m]=p.key.split("|");
      const cur=stockOf(gid,m);
      setStock(gid,m, Math.max(0,(cur?cur.q:0) - p.stockedQty), null);
    }
    p.received=0; p.status="Needed"; p.stocked=0; p.stockedQty=0;
    delete p.rcvQty; delete p.rcvBy; delete p.rcvAt;
    p.upBy=currentUserName(); touchReq(p); draw();
    toast("Restored to the active list");
  });

  $("[data-pnow]").onclick = () => syncPurchase();
  draw(); paintPBar();
};


/* ========================= quotation numbering =========================
   A number is spent only when a quotation is actually issued — downloaded,
   printed or copied for WhatsApp. Opening, editing or abandoning a draft
   costs nothing. Once a draft has a number it keeps it, so hitting Download
   twice never burns two numbers. */

function fyOf(d){                       // Indian financial year, April to March
  const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear()-1;
  return `${y}-${String(y+1).slice(2)}`;
}
const fyNow = () => fyOf(new Date());

function fmtNo(n){
  const N=state.numbering;
  return `${N.prefix}/${N.fy}/${String(Math.max(1,n)).padStart(N.pad||3,"0")}`;
}
const nextPreview = () => fmtNo(state.numbering.next);

/** Replaced by a Firestore transaction once a shared backend is configured.
    Returning null means "no shared counter — use the local one". */
async function reserveSharedNumber(){
  if(usingFirebase()){
    // Deliberately no local fallback: a fallback is exactly how two people
    // end up holding the same number.
    try{ return await fbReserveNumber(); }
    catch(e){ toast("Could not reach the shared counter. Nothing was issued."); throw e; }
  }
  /* With Firebase this becomes a single transaction on a counter document,
     so two people pressing Download at the same moment cannot be handed the
     same number:

       const ref = doc(db, "teamSettings", "numbering");
       const no  = await runTransaction(db, async tx => {
         const snap = await tx.get(ref);
         const cur  = snap.data();
         if (cur.fy !== state.numbering.fy) throw new Error("financial year mismatch");
         tx.update(ref, { next: cur.next + 1 });
         return cur.next;
       });
       return fmtNo(no);
  */
  return null;
}

let assignInFlight = null;

/** Give this quotation its number. Safe to call repeatedly and safe to call
    twice at once — every caller waits on the same assignment and gets the
    same number back, so one quotation can never eat two. */
function assignQuoteNo(){
  if(state.quoteNo) return Promise.resolve(state.quoteNo);   // this draft already has one

  // The number always comes from the counter. There is no manual override —
  // a typed number is exactly how two quotations end up sharing one.
  if(assignInFlight) return assignInFlight;                  // a second click, mid-assignment

  assignInFlight = (async () => {
    let no = null;
    try{ no = await reserveSharedNumber(); }
    catch(e){ assignInFlight=null; throw e; }
    if(!no && usingFirebase()){ assignInFlight=null; return null; }
    if(!no){
      no = fmtNo(state.numbering.next);
      state.numbering.next = Math.max(1, state.numbering.next) + 1;
    }
    state.numbering.lastIssued = {no, at:Date.now(), by:currentUserName()};
    state.quoteNo = no;
    $("#qRef").value = no;
    $("#qRef").placeholder = nextPreview();
    saveSettings();
    return no;
  })();
  assignInFlight.finally(()=>{ assignInFlight = null; });
  return assignInFlight;
}

/** Start a fresh quotation: the next number becomes the suggestion again. */
/** A brand new quotation starts on the team's default rate type. */
function applyDefaultTier(){
  const t = state.company && state.company.defaultTier;
  if(t && TIERNAME[t] && t!==state.tier && !state.lines.length && !isFinalised()){
    state.tier = t;
    $$("[data-tier]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tier===state.tier));
    return true;
  }
  return false;
}
const newDraftId = () => "q_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function resetQuoteNo(){
  state.quoteNo = null; assignInFlight = null;
  state.draftId = newDraftId();        // a new quotation, so a new record id
  const el=$("#qRef");
  if(el){ el.value=""; el.placeholder = nextPreview(); }
}

/** On 1 April the year rolls over. Never reset the sequence without asking. */
function checkFinancialYear(){
  const now = fyNow();
  if(state.numbering.fy === now || state.numbering.fyAsked === now) return;
  toast(`Financial year is now ${now} \u2014 open Settings to roll the numbering over`, "Open Settings", ()=>goView("settings"));
  state.numbering.fyAsked = now;
  saveSettings();
}

   Authentication and shared data. Everything here degrades quietly: if the
   config is blank, the network is down, or the SDK cannot load, the app
   carries on working on this device alone.

   ── YOUR FIREBASE CONFIGURATION ──────────────────────────────────────────
   Paste the object from Firebase console → Project settings → Your apps.
   A web config is public by design; it identifies the project, it does not
   grant access. Access is controlled by firestore.rules. Never put a
   service-account key here.
   ───────────────────────────────────────────────────────────────────────── */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDaFQhRgmWBctskz_0NOR2SzrNb0hC5oao",
  authDomain: "smartie-quote-desk.firebaseapp.com",

const FB_SDK = "https://www.gstatic.com/firebasejs/12.18.0/";
const fbConfigured = () => !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);

let FB = null;                 // {app, auth, db, A, D} once loaded
let fbLoading = null;
let fbUnsub = [];

async function loadFirebase(){
  if(FB) return FB;
  if(!fbConfigured()) return null;
  if(fbLoading) return fbLoading;
  fbLoading = (async () => {
    const [appMod, authMod, dbMod] = await Promise.all([
      import(FB_SDK+"firebase-app.js"),
      import(FB_SDK+"firebase-auth.js"),
      import(FB_SDK+"firebase-firestore.js")
    ]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    const auth = authMod.getAuth(app);
    try{ await authMod.setPersistence(auth, authMod.browserLocalPersistence); }catch(e){}
    let db;
    try{
      // keeps working offline and replays writes when the signal returns
      db = dbMod.initializeFirestore(app, {
        localCache: dbMod.persistentLocalCache({tabManager: dbMod.persistentMultipleTabManager()})
      });
    }catch(e){ db = dbMod.getFirestore(app); }
    FB = {appMod, app, auth, db, A:authMod, D:dbMod};
    return FB;
  })();
  try{ return await fbLoading; }
  catch(e){ fbLoading=null; state.fb.err = "Could not load Firebase: "+e.message; return null; }
}

function friendlyAuthError(e){
  const c = (e && e.code) || "";
  if(c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found"))
    return "That email and password do not match an account.";
  if(c.includes("invalid-email"))      return "That does not look like an email address.";
  if(c.includes("user-disabled"))      return "This account has been switched off. Ask your administrator.";
  if(c.includes("too-many-requests"))  return "Too many attempts. Wait a few minutes and try again.";
  if(c.includes("network-request-failed")) return "No connection. Check the internet and try again.";
  if(c.includes("missing-password"))   return "Enter your password.";
  if(c.includes("permission-denied"))  return "Your account is not allowed to do that.";
  return (e && e.message) ? e.message.replace(/^Firebase:\s*/,"") : "Something went wrong.";
}

/* ---------- shared stock ---------- */
async function fbPushStock(keys){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, runTransaction} = f.D;
  for(const k of keys){
    const local = state.stock[k]; if(!local) continue;
    const ref = doc(f.db, "stock", k.replace(/\//g,"_"));
    // a transaction so a stale phone cannot overwrite a fresher figure
    await runTransaction(f.db, async tx => {
      const snap = await tx.get(ref);
      const cur = snap.exists() ? snap.data() : null;
      if(cur && (cur.t||0) > (local.t||0)) return;      // theirs is newer, leave it
      const [group, model] = k.split("|");
      tx.set(ref, {
        key:k, group, model,
        q: +local.q||0, min: +local.min||0, off: local.off?1:0,
        t: local.t||Date.now(),
        by: state.auth.name, byUid: state.auth.uid
      }, {merge:true});
    });
  }
}
function watchStock(f){
  const {collection, onSnapshot} = f.D;
  return onSnapshot(collection(f.db,"stock"), snap=>{
    let changed=0;
    snap.forEach(d=>{
      const v=d.data(); if(!v || !v.key) return;
      const cur=state.stock[v.key];
      if(!cur || (v.t||0) > (cur.t||0)){
        state.stock[v.key]={q:+v.q||0, min:+v.min||0, t:v.t||0, by:v.by||"", off:v.off?1:0};
        changed++;
      }
    });
    if(changed){
      state.sync.last=Date.now(); saveSettings();
      if(state.view==="stock" && V.stock.repaint) V.stock.repaint(); else refreshAll();
    }
    paintSyncBar();
  }, err=>{ state.sync.err=friendlyAuthError(err); paintSyncBar(); });
}

/* ---------- shared purchase requirements ---------- */
async function fbPushPurchase(ids){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, runTransaction} = f.D;
  for(const id of ids){
    const local = state.purchase.find(p=>p.id===id); if(!local) continue;
    const ref = doc(f.db, "purchase", id);
    await runTransaction(f.db, async tx => {
      const snap = await tx.get(ref);
      const cur = snap.exists() ? snap.data() : null;
      if(cur && (cur.updated||0) > (local.updated||0)) return;
      tx.set(ref, Object.assign({}, local, {
        upBy: state.auth.name, upUid: state.auth.uid
      }), {merge:true});
    });
  }
}
function watchPurchase(f){
  const {collection, onSnapshot} = f.D;
  return onSnapshot(collection(f.db,"purchase"), snap=>{
    let changed=0;
    snap.forEach(d=>{
      const v=d.data(); if(!v || !v.id) return;
      const i=state.purchase.findIndex(p=>p.id===v.id);
      if(i<0){ state.purchase.push(v); changed++; }
      else if((v.updated||0) > (state.purchase[i].updated||0)){ state.purchase[i]=v; changed++; }
    });
    if(changed){
      state.purchase = state.purchase.filter(p=>!p.del);
      state.psync.last=Date.now(); saveSettings();
      if(state.view==="purchase" && V.purchase.repaint) V.purchase.repaint();
      paintBadges();
    }
    paintPBar();
  }, err=>{ state.psync.err=friendlyAuthError(err); paintPBar(); });
}

/* ---------- one shared quotation number ---------- */
/** Replaces the local counter when signed in. A Firestore transaction hands
    out exactly one number even if two people press Download together. */
/** Reserve the number and write the quotation in a single transaction.
    Either both happen or neither does, so a number can never be spent
    without a record, and a record can never exist without its number. */
async function fbFinaliseAtomic(draft){
  const f = await loadFirebase();
  if(!f || !usingFirebase()) return null;
  const {doc, runTransaction} = f.D;
  const numRef = doc(f.db, "teamSettings", "numbering");
  const qRef   = doc(f.db, "quotations", draft.id);   // the draft keeps this id across retries
  const N = state.numbering;

  return runTransaction(f.db, async tx => {
    // Read both first. Firestore requires every read before any write.
    const qSnap   = await tx.get(qRef);
    const numSnap = await tx.get(numRef);

    // A retry after the network dropped mid-commit: the quotation is already
    // there, so hand back its number rather than taking a second one.
    if(qSnap.exists()){
      const prev = qSnap.data();
      // the commit did land last time; hand back the whole record untouched
      return {no: prev.no, doc: prev, counter: null, lastIssued: null, reused: true};
    }

    const cur = numSnap.exists() ? numSnap.data() : null;

    if(!cur && !isAdmin())
      throw new Error("Numbering has not been set up yet. An administrator must open Settings and press Save shared settings once.");

    if(cur && cur.fy && N.fy && cur.fy !== N.fy)
      throw new Error(`The team is on financial year ${cur.fy}; this device is on ${N.fy}. Reload before finalising.`);

    const prefix = cur ? (cur.prefix || N.prefix) : N.prefix;
    const fy     = cur ? (cur.fy     || N.fy)     : N.fy;
    const pad    = cur ? (cur.pad    || N.pad || 3) : (N.pad || 3);
    const n      = Math.max(1, cur ? (+cur.next || 1) : (+N.next || 1));
    const no     = `${prefix}/${fy}/${String(n).padStart(pad,"0")}`;
    const lastIssued = {no, at:Date.now(), by:state.auth.name, uid:state.auth.uid};

    // One write to the counter, never a set followed by an update on a
    // document that did not exist when we read it.
    if(cur) tx.update(numRef, {next: n+1, lastIssued});
    else    tx.set(numRef, {prefix, fy, pad, next: n+1, lastIssued});

    tx.set(qRef, Object.assign({}, draft, {no}));      // same transaction, same number

    return {no, counter:{prefix, fy, pad, next:n+1}, lastIssued};
  });
}

async function fbReserveNumber(){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return null;
  const {doc, runTransaction} = f.D;
  const ref = doc(f.db, "teamSettings", "numbering");
  const N = state.numbering;
  const out = await runTransaction(f.db, async tx => {
    const snap = await tx.get(ref);
    let cur = snap.exists() ? snap.data() : null;
    if(!cur){                                    // first ever use, seed from this device
      cur = {prefix:N.prefix, fy:N.fy, next:N.next, pad:N.pad||3};
      tx.set(ref, cur);
    }
    const n   = Math.max(1, +cur.next || 1);
    const no  = `${cur.prefix||N.prefix}/${cur.fy||N.fy}/${String(n).padStart(cur.pad||N.pad||3,"0")}`;
    tx.update(ref, {next: n+1, lastIssued:{no, at:Date.now(), by:state.auth.name, uid:state.auth.uid}});
    return {no, cur:{prefix:cur.prefix, fy:cur.fy, pad:cur.pad, next:n+1}};
  });
  if(out){
    Object.assign(state.numbering, out.cur);     // keep the local view in step
    return out.no;
  }
  return null;
}

  state.fb.state="loading";
  const f = await loadFirebase();
  if(!f){ state.fb.state="error"; render(); return; }
  f.A.onAuthStateChanged(f.auth, async user => {
    if(!user){
      state.auth=null;
      if(state.backend==="firebase") state.backend="local";
      state.fb.state="signedout";
      render(); return;
    }
    try{
      const p = await loadProfile(user);
      if(p.missing){
        state.fb.state="noprofile"; state.auth=null;
        await f.A.signOut(f.auth);
        render(); return;
      }
      if(!p.active){
        state.fb.state="inactive"; state.auth=null;
        await f.A.signOut(f.auth);
        render(); return;
      }
      state.auth=p; state.backend="firebase"; state.fb.state="signedin"; state.fb.err="";
      saveSettings();
      await startTeam();
      render();
      toast(`Signed in as ${p.name}${p.role==="admin"?" (admin)":""}`);
    }catch(e){
      state.fb.err=friendlyAuthError(e); state.fb.state="error"; render();
    }
  });
}

/* ========================= products =========================
   The catalogue is seeded from the file, then Firestore becomes the source of
   truth once an admin runs the one-time initialisation. Seed data never
   overwrites a later edit: initialisation only writes a product document that
   does not already exist, so running it twice changes nothing. */

/* Fold the 2026 catalogue into the book. Existing groups keep their ids so
   stock keys and past quotation lines stay connected. */
(function mergeCatalogue(){
  const gate = BOOK.groups.find(g=>g.id==="gate");
  if(gate) SLIDING2026_NEW.forEach(it=>{ if(!gate.items.some(x=>x.m===it.m)) gate.items.push(it); });
  CAT2026.forEach(g=>{ if(!BOOK.groups.some(x=>x.id===g.id)) BOOK.groups.push(g); });
})();

const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const pid  = (gid,m) => `${gid}|${m}`;

/** Every product, flattened, with its group. */
function allProducts(){
  const out=[];
  BOOK.groups.forEach(g=>itemsOf(g.id).forEach(it=>out.push({g, it, id:pid(g.id,it.m)})));
  return out;
}
/** Guard against a second product with the same model or name in a category. */
function findClash(gid, model, name, exceptModel){
  const nm=norm(model), nn=norm(name);
  for(const {g,it} of allProducts()){
    if(g.id===gid && it.m===exceptModel) continue;
    if(norm(it.m)===nm) return {it, g, why:"model"};
    if(g.id===gid && norm(label(g.id,it).n)===nn) return {it, g, why:"name"};
  }
  return null;
}

/* ---------- prices that may legitimately be missing ---------- */
const hasPrice = (gid,m,tier) => rate(gid,m,tier).v != null;
const priceText = v => v==null ? "Price not set" : money(v);

/** Products where a source conflict left the price unset, or that need review. */
function conflictList(){
  const out=[];
  allProducts().forEach(({g,it,id})=>{ if(it.conflict) out.push({kind:"conflict", g, it, id, c:it.conflict}); });
  PRICE_REVIEW_2026.forEach(([gid,m,newCl,srcNote])=>{
    const it=itemBy(gid,m); if(!it) return;
    const cur=rate(gid,m,"client").v;
    const done=(state.priceReviewed||{})[pid(gid,m)];
    if(done || (cur!=null && Math.abs(cur-newCl)<1)) return;
    out.push({kind:"review", g:groupById(gid), it, id:pid(gid,m), cur, proposed:newCl, srcNote});
  });
  return out;
}
const conflictCount = () => conflictList().length;

/* ---------- Firestore products ---------- */
/** Document id is the seed key, so a rename never orphans stock or history. */
const docId = (gid,m) => `${gid}__${String(m).replace(/[\/\.#$\[\]]/g,"_")}`;

async function fbPushProduct(gid, m){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  if(!isAdmin()) throw new Error("Only an administrator can change products");
  const {doc, setDoc} = f.D;
  const it = itemBy(gid,m); if(!it) return;
  const L  = label(gid,it), ov = ovOf(gid,m);
  await setDoc(doc(f.db,"products",docId(gid,m)), {
    id: pid(gid,m), key: pid(gid,m), group: gid, seedModel: m,
    model: L.m, name: L.n, unit: L.u,
    spec: it.spec || "", gst: (ov.gst!=null?ov.gst:(groupById(gid).gst||18)),
    dealer:     rate(gid,m,"dealer").v,
    contractor: rate(gid,m,"contractor").v,
    client:     rate(gid,m,"client").v,
    conflictResolved: !it.conflict,
    active: !L.hidden,
    updated: Date.now(), by: state.auth.name, byUid: state.auth.uid
  }, {merge:true});
}
async function fbDeleteProduct(gid, m){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, deleteDoc} = f.D;
  await deleteDoc(doc(f.db,"products",docId(gid,m)));
}
function applyProductDoc(v){
  if(!v || !v.group) return false;
  const gid=v.group, m=v.seedModel || v.model;     // the seed key, not the display model
  if(!m) return false;
  let it=itemBy(gid,m);
  if(!it){                                   // a product created on another device
    state.custom[gid]=state.custom[gid]||[];
    state.custom[gid].push({m, n:v.name||m, u:v.unit, d:null, c:null, cl:null, spec:v.spec||"", custom:true});
    it=itemBy(gid,m);
  }
  if(v.model && v.model!==m) setOv(gid,m,"md", v.model);
  setOv(gid,m,"nm", v.name||null);
  setOv(gid,m,"u",  v.unit||null);
  // Firestore is the source of truth once seeded, so an explicitly empty price
  // is recorded as empty rather than falling back to the seed figure.
  setOv(gid,m,"d",  v.dealer==null     ? NULLP : v.dealer);
  setOv(gid,m,"c",  v.contractor==null ? NULLP : v.contractor);
  setOv(gid,m,"cl", v.client==null     ? NULLP : v.client);
  setOv(gid,m,"gst",v.gst==null?null:v.gst);
  setOv(gid,m,"x",  v.active===false?1:null);
  if(v.spec!=null) it.spec = v.spec;
  if(v.conflictResolved && it.conflict){          // a decision made on another device
    delete it.conflict;
    state.priceReviewed=state.priceReviewed||{};
    state.priceReviewed[pid(gid,m)]=v.updated||Date.now();
  }
  return true;
}
function watchProducts(f){
  const {collection, onSnapshot} = f.D;
  return onSnapshot(collection(f.db,"products"), snap=>{
    let n=0;
    snap.forEach(d=>{ if(applyProductDoc(d.data())) n++; });
    state.fsProducts = snap.size;                 // the real initialisation state
    state.seeded = snap.size > 0;
    if(n || snap.size){ saveSettings(); refreshAll();
      if(state.view==="products" && V.products.repaint) V.products.repaint(); }
  }, err=>{ toast("Products sync: "+friendlyAuthError(err)); });
}

/** One-time, idempotent. Writes only products Firestore does not already hold. */
async function fbInitProducts(){
  if(!usingFirebase()) return toast("Sign in first");
  if(!isAdmin())       return toast("Only an administrator can initialise the catalogue");
  const f = await loadFirebase(); if(!f) return;
  const {collection, getDocs, doc, writeBatch} = f.D;

  const list = allProducts();
  const existing = new Set();
  try{
    const snap = await getDocs(collection(f.db,"products"));
    snap.forEach(d=>existing.add(d.id));
  }catch(e){ return toast("Could not read the catalogue: "+friendlyAuthError(e)); }

  const todo = list.filter(p=>!existing.has(p.id.replace(/\//g,"_")));
  if(!todo.length){
    return toast(`Catalogue already initialised — ${existing.size} products in Firestore, nothing to add`);
  }
  if(!confirm(`Initialise the shared catalogue?\n\n${todo.length} product${todo.length===1?"":"s"} will be written to Firestore.\n${existing.size} already there and will not be touched.\n\nThis is safe to run twice — existing products are never overwritten.`)) return;

  const btn=$("#pInit"); if(btn){ btn.disabled=true; btn.textContent="Writing…"; }
  try{
    for(let i=0;i<todo.length;i+=400){
      const batch = writeBatch(f.db);
      todo.slice(i,i+400).forEach(({g,it,id})=>{
        const L=label(g.id,it), ov=ovOf(g.id,it.m);
        batch.set(doc(f.db,"products",id.replace(/\//g,"_")), {
          id, group:g.id, model:L.m, name:L.n, unit:L.u, spec:it.spec||"",
          gst: ov.gst!=null?ov.gst:(g.gst||18),
          dealer:     rate(g.id,it.m,"dealer").v,
          contractor: rate(g.id,it.m,"contractor").v,
          client:     rate(g.id,it.m,"client").v,
          active: !L.hidden, seeded:true,
          updated: Date.now(), by: state.auth.name, byUid: state.auth.uid
        });
      });
      await batch.commit();
    }
    state.seeded = true; saveSettings();
    toast(`Catalogue initialised — ${todo.length} products added`);
    if(V.products.repaint) V.products.repaint();
  }catch(e){
    toast("Initialisation failed: "+friendlyAuthError(e));
  }finally{ if(btn){ btn.disabled=false; btn.textContent="Initialise shared catalogue"; } }
}

    const id=(ed||ar||dl)?.dataset[ed?"pedit2":ar?"parch":"pdel2"]; if(!id) return;
    const [gid,m]=id.split("|"), it=itemBy(gid,m); if(!it) return;

      if(usingFirebase()) fbPushProduct(gid,m).catch(()=>{});
      draw(); toast(L.hidden?`${m} restored`:`${m} archived`); return;
    }
    if(dl){
      if(!confirm(`Delete ${m}?\n\nIt is removed for the whole team. Archive it instead if you may need it again.`)) return;
      state.custom[gid]=(state.custom[gid]||[]).filter(x=>x.m!==m);
      if(state.ov[gid]) delete state.ov[gid][m];
      saveSettings();
      if(usingFirebase()) fbDeleteProduct(gid,m)

    form(`Edit ${L.m}`, {
      m:L.m, gid, n:L.n, spec:it.spec||"", u:L.u,
      gst: ov.gst!=null?ov.gst:(groupById(gid).gst||18),
      d: rate(gid,m,"dealer").v, c: rate(gid,m,"contractor").v, cl: rate(gid,m,"client").v

        const clash=findClash(out.gid, out.m, out.n, m);
        if(clash){ toast(`Already exists — ${clash.it.m}`); return false; }
      }
      const moving = out.gid !== gid;
      if(moving && !it.custom){
        toast("Only a product you added can move category. Archive this one and add it in the other category.");
        return false;
      }
      setOv(gid,m,"md", out.m!==m ? out.m : null);
      setOv(gid,m,"nm", out.n);
      setOv(gid,m,"u",  out.u);
      setOv(gid,m,"gst", out.gst);
      setOv(gid,m,"d",  out.d==null ? NULLP : out.d);
      setOv(gid,m,"c",  out.c==null ? NULLP : out.c);
      setOv(gid,m,"cl", out.cl==null ? NULLP : out.cl);
      it.spec = out.spec;
      if(it.conflict && out.cl!=null){
        delete it.conflict;
        state.priceReviewed=state.priceReviewed||{};
        state.priceReviewed[pid(gid,m)]=Date.now();
      }
      if(moving){
        // rebuild in the new category and take the old document with it
        const carried=Object.assign({}, it, {m:out.m, n:out.n, spec:out.spec, u:out.u,
          d:out.d, c:out.c, cl:out.cl, custom:true});
        state.custom[gid]=(state.custom[gid]||[]).filter(x=>x.m!==m);
        if(state.ov[gid]) delete state.ov[gid][m];
        state.custom[out.gid]=state.custom[out.gid]||[];
        state.custom[out.gid].push(carried);
        saveSettings();
        if(usingFirebase()){
          fbDeleteProduct(gid,m).catch(()=>{});
          fbPushProduct(out.gid,out.m).catch(e=>toast(friendlyAuthError(e)));
        }
      } else {
        saveSettings();
        if(usingFirebase()) fbPushProduct(gid,m).catch(e=>toast(friendlyAuthError(e)));
      }
      render(); toast(`${out.m} saved`);
    });
  });

  draw();

    ? (state.fsProducts>0
        ? `Firestore is the source of truth · ${state.fsProducts} products shared`
        : "Not initialised yet — press Initialise shared catalogue")
    : "Saved on this device";
};

/* ========================= finalising a quotation =========================
   A number is spent only on finalise. Drafts, previews and edits cost nothing.
   With Firebase selected the number comes from a Firestore transaction, so two
   people finalising at the same moment cannot be handed the same one — and
   there is deliberately no local fallback, because a fallback is exactly how
   duplicates happen. */

const isFinalised = () => !!state.quoteNo;

function partyFromForm(){
  const g = id => { const el=$(id); return el ? el.value.trim() : ""; };
  return {
    name: g("#qClient"), site: g("#qSite"), gstin: g("#qGst"),
    contact: g("#qContact"), phone: g("#qPhone"),
    email: g("#qEmail"), address: g("#qAddr")
  };
}
function fillParty(c){
  const set=(id,v)=>{ const el=$(id); if(el) el.value=v||""; };
  set("#qClient",c.name); set("#qSite",c.city||c.site); set("#qGst",c.gstin);
  set("#qContact",c.contact); set("#qPhone",c.phone);
  set("#qEmail",c.email); set("#qAddr",c.address);
}

async function finaliseQuote(){
  if(!quoteLines().length){ toast("Add a line to the quotation first"); return null; }
  if(isFinalised()) return state.quoteNo;

  if(usingFirebase() && !navigator.onLine){
    toast("Finalising needs an internet connection — the number is shared with the team");
    return null;
  }
  const btn=$("#btnFinal"); if(btn){ btn.disabled=true; btn.textContent="Finalising…"; }
  try{
    // The whole record is built first, so the transaction has everything it needs.
    if(!state.draftId) state.draftId = newDraftId();   // survives a failed attempt
    const F0 = firmNow();
    const draft = {
      id: state.draftId,
      at: Date.now(),
      by: currentUserName(), byUid: currentUserId(),
      tier: state.tier, tierName: TIERNAME[state.tier],
      party: partyFromForm(),
      lines: quoteLines().map(l=>({t:l.t, s:l.s, u:l.u, qty:l.qty, rate:l.rate, origRate:l.origRate,
                                   k:l.k||null, manual:!!l.manual, amt:amtOf(l)})),
      gst: state.gst, gstPct: gstPercent(),
      subtotal: subtotal(), total: grandTotal(),
      status: "Finalised",
      // what the quotation said on the day. Text only — the logo and QR are
      // not copied into every record, the current images are used.
      snap: {
        name:F0.name, tag:F0.tag, addr:F0.addr, phones:F0.phones,
        email:F0.email, web:F0.web, gstin:F0.gstin, pan:F0.pan,
        bank:{name:F0.bank.name, branch:F0.bank.branch, acc:F0.bank.acc,
              ifsc:F0.bank.ifsc, upi:F0.bank.upi},
        terms: termsList(), notes: notesList(),
        validityDays: CO("validityDays"), gstPct: gstPercent()
      }
    };

    let no;
    if(usingFirebase()){
      const out = await fbFinaliseAtomic(draft);          // number and record together
      if(!out || !out.no) throw new Error("The shared counter did not respond");
      no = out.no;
      if(out.reused){
        // nothing was taken this time, so the counter and lastIssued stand
        if(out.doc) Object.assign(draft, out.doc);
      }else if(out.counter){
        Object.assign(state.numbering, out.counter, {lastIssued: out.lastIssued});
      }
    } else {
      no = await assignQuoteNo();                         // this device only
      if(!no) throw new Error("Could not take the next number");
    }

    // Only now is the quotation finalised. Until this line it is still a draft.
    draft.no = no;
    state.quoteNo = no;
    state.draftId = null;                 // this record is closed
    upsertQuote(draft);                   // the listener may have beaten us to it
    clearDraft();
    const el=$("#qRef"); if(el){ el.value = no; el.placeholder = nextPreview(); }
    saveSettings();

    try{ await saveParty(partyFromForm(), true); }catch(e){}
    renderDocket();
    toast(`Finalised as ${no}`);
    return no;
  }catch(e){
    // nothing was consumed and nothing is marked finalised
    state.quoteNo = null;
    renderDocket();
    toast("Not finalised — "+friendlyAuthError(e)+" Your quotation is untouched.");
    return null;
  }finally{
    if(btn){ btn.disabled=false; btn.textContent = isFinalised()?`Finalised · ${state.quoteNo}`:"Finalise quotation"; }
  }
}

async function fbSaveQuote(snap){
  const f=await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, setDoc} = f.D;
  // a generated id, never the number itself — a number contains slashes
  await setDoc(doc(f.db,"quotations",snap.id), snap);
}
/** One record per quotation id, whichever arrives first. */
function upsertQuote(q){
  if(!q || !q.id) return;
  const i = state.quotes.findIndex(x => x.id === q.id);
  if(i < 0) state.quotes.push(q);
  else state.quotes[i] = Object.assign({}, state.quotes[i], q);
  state.quotes.sort((a,b) => (b.at||0) - (a.at||0));
}

function watchQuotes(f){
  const {collection, onSnapshot, query, orderBy, limit} = f.D;
  return onSnapshot(query(collection(f.db,"quotations"), orderBy("at","desc"), limit(200)), snap=>{
    let n=0;
    snap.forEach(d=>{
      const v=d.data(); if(!v||!v.id) return;
      const i=state.quotes.findIndex(q=>q.id===v.id);
      if(i<0 || (v.at||0)!==(state.quotes[i].at||0)){ upsertQuote(v); n++; }
    });
    if(n){ saveSettings();
           if(state.view==="history" && V.history.repaint) V.history.repaint(); }
  }, err=>{ /* history is not critical enough to shout about */ });
}

/* ========================= customers ========================= */
const custId = () => "c_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const digits = s => String(s||"").replace(/\D/g,"");

/** Match on GSTIN first, then phone, then name — the order of reliability. */
function findCustomer(p){
  const g=norm(p.gstin), ph=digits(p.phone), nm=norm(p.name);
  return state.customers.find(c=>!c.archived && (
    (g  && norm(c.gstin)===g) ||
    (ph && ph.length>=7 && digits(c.phone)===ph) ||
    (nm && norm(c.name)===nm)));
}
function saveParty(p, quiet){
  if(!p || !p.name) return null;
  const now=Date.now(), who=currentUserName();
  let c=findCustomer(p);
  if(c){
    // fill gaps and take genuine changes — never blank a detail already held
    if(p.site) c.city=p.site;
    ["gstin","contact","phone","email","address"].forEach(k=>{ if(p[k]) c[k]=p[k]; });
    c.updated=now; c.upBy=who;
  }else{
    c={id:custId(), name:p.name, city:p.site||"", gstin:p.gstin||"", contact:p.contact||"",
       phone:p.phone||"", email:p.email||"", address:p.address||"", notes:"",
       t:now, by:who, updated:now, upBy:who};
    state.customers.push(c);
  }
  saveSettings();
  if(usingFirebase()) fbPushCustomer(c).catch(()=>{});
  if(!quiet) toast(`${c.name} saved`);
  return c;
}
async function fbPushCustomer(c){
  const f=await loadFirebase(); if(!f || !usingFirebase()) return;
  const {doc, setDoc} = f.D;
  await setDoc(doc(f.db,"customers",c.id), Object.assign({}, c, {upUid:currentUserId()}), {merge:true});
}
function watchCustomers(f){
  const {collection, onSnapshot} = f.D;
  return onSnapshot(collection(f.db,"customers"), snap=>{
    let n=0;
    snap.forEach(d=>{
      const v=d.data(); if(!v||!v.id) return;
      const i=state.customers.findIndex(c=>c.id===v.id);
      if(i<0){ state.customers.push(v); n++; }
      else if((v.updated||0)>(state.customers[i].updated||0)){ state.customers[i]=v; n++; }
    });
    if(n){ saveSettings(); if(state.view==="customers" && V.customers.repaint) V.customers.repaint(); }
  }, err=>{});
}

          <span class="tag ${x.status==="Cancelled"?"w":"g"}">${esc(x.status||"Finalised")}</span>
          <span class="tag">${esc((x.tierName||x.tier||"").replace(" rate",""))}</span>
          <span>${esc(x.party?.name||"—")}${x.party?.site?` · ${esc(x.party.site)}`:""}</span>
          <span class="qtyline">${x.lines?.length||0} line${(x.lines?.length||0)===1?"":"s"} · GST ${finitePct(x.gstPct, 18)}% · <b>${money(x.total)}</b></span>
          <span class="meta">${esc(x.by||"unnamed")} · ${stamp(x.at)}</span></div>
        <div class="practs">
          <button class="btn pri sm" data-hpdf="${esc(x.id)}">PDF</button>
          <button class="btn gh sm" data-hdup="${esc(x.id)}">Duplicate</button>
        </div></div>`).join("")}</div>`;
  };
  V.history.repaint = draw;
  ["hsQ","hsTier","hsFrom","hsTo"].forEach(id=>{
    $("#"+id).addEventListener("input",draw); $("#"+id).addEventListener("change",draw);
  });
  $("#hsClear").onclick=()=>{ $("#hsQ").value=""; draw(); };

  $("#hsList").addEventListener("click", async e=>{
    const p=e.target.closest("[data-hpdf]"), d=e.target.closest("[data-hdup]");
    const id=(p||d)?.dataset[p?"hpdf":"hdup"]; if(!id) return;
    const x=state.quotes.find(z=>z.id===id); if(!x) return;

    if(p){
      /* Re-issue it exactly as it went out: its own number, its own rate, its
         own party details and the company wording of the day. Everything the
         user currently has on screen is put back afterwards. */
      const FIELDS=["#qClient","#qSite","#qGst","#qContact","#qPhone","#qEmail","#qAddr","#qRef"];
      const keep = {
        lines: state.lines, no: state.quoteNo, tier: state.tier, transport: state.transport,
        gst: state.gst, company: state.company, terms: state.terms, notes: state.notes,
        form: FIELDS.reduce((o,id)=>{ const el=$(id); o[id]= el?el.value:""; return o; }, {})
      };
      const sn = x.snap || {};
      state.lines = x.lines.map(l=>normLine(l));
      state.quoteNo = x.no;
      state.tier = x.tier || state.tier;
      state.transport = {on:false, amt:0, note:""};      // transport is already a line
      state.gst = x.gst !== false;
      // the company block, wording and GST rate as saved on the day
      state.company = Object.assign({}, state.company, {
        name:sn.name, tagline:sn.tag, address:sn.addr, phone:sn.phones,
        email:sn.email, web:sn.web, gstin:sn.gstin, pan:sn.pan,
        bankName:sn.bank&&sn.bank.name, bankBranch:sn.bank&&sn.bank.branch,
        bankAcc:sn.bank&&sn.bank.acc, bankIfsc:sn.bank&&sn.bank.ifsc, upi:sn.bank&&sn.bank.upi,
        validityDays: finitePct(sn.validityDays, CO("validityDays")),
        defaultGst: finitePct(x.gstPct, finitePct(sn.gstPct, gstPercent()))
      });
      if(Array.isArray(sn.terms) && sn.terms.length) state.terms = sn.terms;
      if(Array.isArray(sn.notes) && sn.notes.length) state.notes = sn.notes;

      fillParty(Object.assign({}, x.party||{}, {city:(x.party&&x.party.site)||""}));
      const rEl=$("#qRef"); if(rEl) rEl.value = x.no;

      try{ await downloadQuotePdf(); }
      finally{
        state.lines=keep.lines; state.quoteNo=keep.no; state.tier=keep.tier;
        state.transport=keep.transport; state.gst=keep.gst; state.company=keep.company;
        state.terms=keep.terms; state.notes=keep.notes;
        FIELDS.forEach(id=>{ const el=$(id); if(el) el.value = keep.form[id]; });
        renderDocket();
      }
      return;
    }
    if(d){
      if(state.lines.length && !confirm("Replace the quotation you are working on with a copy of this one?")) return;
      state.lines=x.lines.map(l=>normLine(Object.assign({},l,{k:l.k})));
      state.transport={on:false,amt:0,note:""};
      $("#trOn").checked=false; $("#trAmt").value=""; $("#trNote").value="";
      resetQuoteNo();                       // a copy gets its own number, on finalising
      fillParty(Object.assign({}, x.party||{}, {city:x.party?.site}));
      if(x.tier) state.tier=x.tier;
      renderDocket(); showSheet();
      toast("Copied into a new draft — it takes a new number when you finalise");
    }
  });
  draw();
};

const COMPANY_DEFAULTS = {
  name: FIRM.name, tagline: FIRM.tag, address: FIRM.addr,
  gstin: FIRM.gstin, pan: FIRM.pan,
  phone: FIRM.phones, email: FIRM.email, web: FIRM.web,

  logo: "", qr: "",                        // blank means use the built-in image
  defaultGst: 18, defaultTier: "client", validityDays: 15
};
const CO = k => {
  const v = state.company && state.company[k];
  return (v===undefined || v===null || v==="") ? COMPANY_DEFAULTS[k] : v;
};
/** The company block the PDF and WhatsApp copy actually use. */
function firmNow(){
  return {
    name: CO("name"), tag: CO("tagline"), addr: CO("address"),
    phones: CO("phone"), email: CO("email"), web: CO("web"),
    gstin: CO("gstin"), pan: CO("pan"),
    bank: { name: CO("bankName"), branch: CO("bankBranch"),
            acc: CO("bankAcc"), ifsc: CO("bankIfsc"), upi: CO("upi") }
  };
}
const logoNow = () => CO("logo") || ASSET.logo;
const qrNow   = () => CO("qr")   || ASSET.qr;

async function fbSaveCompany(){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  if(!isAdmin()) throw new Error("Only an administrator can change company settings");
  const {doc, setDoc} = f.D;
  await setDoc(doc(f.db,"teamSettings","company"),
    Object.assign({}, state.company, {
      terms: state.terms || null,          // null means "use the standard wording"
      notes: state.notes || null,
      updated:Date.now(), by:state.auth.name, byUid:state.auth.uid
    }), {merge:true});
}
function watchCompany(f){
  const {doc, onSnapshot} = f.D;
  return onSnapshot(doc(f.db,"teamSettings","company"), snap=>{
    if(!snap.exists()) return;
    const v = snap.data();
    state.company = v;
    // wording the team has agreed, applied on every signed-in device
    state.terms = Array.isArray(v.terms) && v.terms.length ? v.terms : null;
    state.notes = Array.isArray(v.notes) && v.notes.length ? v.notes : null;
    // the shared default rate type, but never over a draft already in progress
    if(v.defaultTier && TIERNAME[v.defaultTier] && !state.lines.length && !isFinalised()){
      state.tier = v.defaultTier;
      $$("[data-tier]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tier===state.tier));
    }
    saveSettings();
    refreshAll();
    if(state.view==="settings" && V.settings.repaint) V.settings.repaint();
  }, err=>{});
}
/** Admin numbering changes belong to the team, not to one phone. */
async function fbSaveNumbering(){
  const f = await loadFirebase(); if(!f || !usingFirebase()) return;
  if(!isAdmin()) throw new Error("Only an administrator can change numbering");
  const {doc, runTransaction} = f.D;
  const ref = doc(f.db,"teamSettings","numbering");
  const N = state.numbering;
  await runTransaction(f.db, async tx=>{
    const snap = await tx.get(ref);
    const cur = snap.exists() ? snap.data() : null;
    if(cur && N.fy===cur.fy && N.next < (cur.next||1))
      throw new Error(`The team counter is already at ${cur.next}. A number cannot be re-used.`);
    tx.set(ref, {prefix:N.prefix, fy:N.fy, next:N.next, pad:N.pad,
                 updated:Date.now(), by:state.auth.name}, {merge:true});
  });
}
function watchNumbering(f){
  const {doc, onSnapshot} = f.D;
  return onSnapshot(doc(f.db,"teamSettings","numbering"), snap=>{
    if(!snap.exists()) return;
    const v=snap.data();
    Object.assign(state.numbering, {prefix:v.prefix||state.numbering.prefix,
      fy:v.fy||state.numbering.fy, next:v.next||state.numbering.next, pad:v.pad||state.numbering.pad});
    if(v.lastIssued) state.numbering.lastIssued=v.lastIssued;
    saveSettings();
    const el=$("#qRef"); if(el && !isFinalised()) el.placeholder=nextPreview();
    if(state.view==="settings" && V.settings.repaint) V.settings.repaint();
  }, err=>{});
}

V.settings.wire = () => {
  const admin = isAdmin() || !fbConfigured();
  V.settings.repaint = () => { if(state.view==="settings") render(); };

  $("#stTerms").value = termsList().join("\n");
  $("#stNotes").value = notesList().join("\n");

  /* cache size, honestly reported */
  (async()=>{
    let txt="Offline copy: not stored yet.";
    try{
      if("caches" in window){
        const keys=await caches.keys();
        const mine=keys.filter(k=>k.startsWith("smartie-quote-desk"));
        if(mine.length){
          const c=await caches.open(mine[0]);
          txt=`Offline copy: ${(await c.keys()).length} files cached as ${mine[0]}.`;
        }
      }
    }catch(e){}
    const el=$("#stCache");
    if(el) el.textContent = `Saved using ${storageMode}. ${txt} The app works with no signal; only sync needs one.`;
  })();

  const preview = () => {
    const p=$("#stPrefix").value.trim()||state.numbering.prefix;
    const fy=$("#stFy").value.trim()||state.numbering.fy;
    const n=Math.max(1,+$("#stNext").value||1);
    const pd=Math.min(6,Math.max(1,+$("#stPad").value||3));
    return `${p}/${fy}/${String(n).padStart(pd,"0")}`;
  };
  if(admin) ["stPrefix","stFy","stNext","stPad"].forEach(id=>
    $("#"+id).addEventListener("input",()=>{ $("#stPrev").textContent=preview(); }));

  const paintFy = () => {
    const now=fyNow(), box=$("#stFyBanner"); if(!box) return;
    if(state.numbering.fy===now || !admin){ box.innerHTML=""; return; }
    box.innerHTML=`<div class="note"><b>The financial year is now ${esc(now)}.</b>
      Numbering is still on ${esc(state.numbering.fy)}. Rolling over restarts at 1 — nothing happens until you choose it.
      <div style="margin-top:9px"><button class="btn sm" id="stFyRoll">Start ${esc(now)} at 001</button></div></div>`;
    $("#stFyRoll").onclick = async () => {
      if(!confirm(`Start the ${now} sequence at 001?\n\nNumbers already issued under ${state.numbering.fy} are unaffected.`)) return;
      state.numbering.fy=now; state.numbering.next=1; state.numbering.fyAsked=now;
      $("#stFy").value=now; $("#stNext").value=1;
      try{ if(usingFirebase()) await fbSaveNumbering(); saveSettings(); toast(`Numbering rolled over to ${now}`); render(); }
      catch(e){ toast(friendlyAuthError(e)); }
    };
  };
  paintFy();

  /* device preferences apply at once */
  $("#stFont").onchange = e => {
    state.prefs.font=+e.target.value;
    document.documentElement.style.fontSize=(state.prefs.font/100*16)+"px";
    saveSettings(); toast("Text size updated");
  };
  $("#stCats").onchange = e => {
    state.prefs.openCats = e.target.value==="1";
    BOOK.groups.forEach(g=>state.catOpen[g.id]=state.prefs.openCats);
    saveSettings(); toast(state.prefs.openCats?"Categories open by default":"Categories closed by default");
  };

  /* account */
  if($("#stOut")) $("#stOut").onclick = () => { if(confirm("Sign out of this device?")) fbSignOut(); };
  if($("#stPwd")) $("#stPwd").onclick = async () => {
    if(!state.auth) return;
    if(!confirm(`Send a password reset link to ${state.auth.email}?`)) return;
    try{ await fbReset(state.auth.email); toast("Reset link sent — check the inbox and spam folder"); }
    catch(e){ toast(friendlyAuthError(e)); }
  };

  /* backup */
  $("#stExport").onclick = () => {
    const blob=new Blob([JSON.stringify({
      kind:"smartie-quote-desk-backup", version:APP_VERSION, at:Date.now(),
      rev:state.rev, effective:state.effective, ov:state.ov, custom:state.custom,
      terms:state.terms, notes:state.notes, stock:state.stock, numbering:state.numbering,
      purchase:state.purchase, customers:state.customers, quotes:state.quotes,
      company:state.company, priceReviewed:state.priceReviewed
    },null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`smartie-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast("Backup downloaded");
  };
  $("#stImportBtn").onclick = () => $("#stImport").click();
  $("#stImport").onchange = e => {
    const file=e.target.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload = () => {
      let d;
      try{ d=JSON.parse(rd.result); }catch(err){ return toast("That file is not readable as a backup"); }
      if(d.kind!=="smartie-quote-desk-backup")
        return toast("That does not look like a Quote Desk backup");
      const counts=[`${Object.keys(d.stock||{}).length} stock items`,
                    `${(d.purchase||[]).length} requirements`,
                    `${(d.customers||[]).length} customers`,
                    `${(d.quotes||[]).length} quotations`].join("\n");
      if(!confirm(`Import this backup?\n\nTaken ${d.at?new Date(d.at).toLocaleDateString("en-IN"):"at an unknown date"}, holding:\n${counts}\n\nIt replaces what is on this device. The team's data in Firestore is not touched.`)) return;
      ["ov","custom","stock","numbering","company","priceReviewed"].forEach(k=>{ if(d[k]) state[k]=d[k]; });
      ["purchase","customers","quotes"].forEach(k=>{ if(Array.isArray(d[k])) state[k]=d[k]; });
      if(d.terms) state.terms=d.terms; if(d.notes) state.notes=d.notes;
      saveSettings(); render(); toast("Backup imported");
    };
    rd.readAsText(file); e.target.value="";
  };
  $("#stClearQ").onclick = () => {
    if(!confirm(`Clear ${state.quotes.length} quotation${state.quotes.length===1?"":"s"} from this device's history?\n\nQuotations already saved to the team stay in Firestore and come back on the next sync. Issued numbers are never released.`)) return;
    state.quotes=[]; saveSettings(); render(); toast("Local quotation history cleared");
  };
  $("#stClearCache").onclick = async () => {
    if(!confirm("Clear this device's offline copy?\n\nThe app reloads and downloads itself again. Your prices, stock and settings are not touched.")) return;
    try{
      if("caches" in window){ for(const k of await caches.keys()) await caches.delete(k); }
      if(navigator.serviceWorker){ for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); }
      toast("Cache cleared — reloading");
      setTimeout(()=>location.reload(true), 700);
    }catch(e){ toast("Could not clear the cache: "+e.message); }
  };

  if(!admin) return;

  $("#stReset").onclick = () => {
    state.terms=null; state.notes=null;
    $("#stTerms").value=TERMS.join("\n"); $("#stNotes").value=DEFAULT_NOTES.join("\n");
    toast("Standard wording restored — press Save to keep it");
  };

  /* pictures are stored as data, so they travel with the settings */
  const readImage = (input, key, max) => {
    const file=input.files[0]; if(!file) return;
    if(file.size > 1.5*1024*1024) return toast("Please use an image under 1.5 MB");
    const rd=new FileReader();
    rd.onload = () => {
      const img=new Image();
      img.onload = () => {
        const c=document.createElement("canvas");
        const r=Math.min(1, max/Math.max(img.width,img.height));
        c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        state.company=state.company||{};
        state.company[key]=c.toDataURL("image/png");
        saveSettings(); toast("Image set — press Save shared settings to publish it"); render();
      };
      img.onerror=()=>toast("That image could not be read");
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  };
  if($("#stLogoFile")) $("#stLogoFile").onchange = e => readImage(e.target,"logo",420);
  if($("#stQrFile"))   $("#stQrFile").onchange   = e => readImage(e.target,"qr",420);
  if($("#stLogoClear"))$("#stLogoClear").onclick = () => { state.company=state.company||{}; state.company.logo=""; saveSettings(); render(); };
  if($("#stQrClear"))  $("#stQrClear").onclick   = () => { state.company=state.company||{}; state.company.qr=""; saveSettings(); render(); };

  $("#stSave").onclick = async () => {
    const gst=+$("#stGst").value, valid=+$("#stValid").value;
    const nx=+$("#stNext").value, pd=+$("#stPad").value;
    const pre=$("#stPrefix").value.trim(), fy=$("#stFy").value.trim();
    if(!pre) return toast("The quotation prefix cannot be blank");
    if(!fy)  return toast("Set a financial year, for example 2026-27");
    if(isNaN(nx)||nx<1) return toast("The next number must be 1 or more");
    if(isNaN(gst)||gst<0||gst>28) return toast("GST must be between 0 and 28");
    if(isNaN(valid)||valid<1) return toast("Validity must be at least one day");

    const lastNo = state.numbering.lastIssued && String(state.numbering.lastIssued.no);
    if(lastNo && fy===state.numbering.fy){
      const lastSeq=parseInt(lastNo.split("/").pop(),10)||0;
      if(nx<=lastSeq) return toast(`${lastNo} has already been issued — the next number must be above ${lastSeq}`);
    }

    state.company = Object.assign({}, state.company, {
      name:$("#stName").value.trim(), tagline:$("#stTag").value.trim(),
      address:$("#stAddr").value.trim(), gstin:$("#stGstin").value.trim(),
      pan:$("#stPan").value.trim(), phone:$("#stPhone").value.trim(),
      email:$("#stEmail").value.trim(), web:$("#stWeb").value.trim(),
      bankName:$("#stBName").value.trim(), bankBranch:$("#stBBranch").value.trim(),
      bankAcc:$("#stBAcc").value.trim(), bankIfsc:$("#stBIfsc").value.trim(),
      upi:$("#stUpi").value.trim(),
      defaultGst:gst, defaultTier:$("#stTier").value, validityDays:valid
    });
    Object.assign(state.numbering,{prefix:pre, fy, next:nx, pad:Math.min(6,Math.max(1,pd||3))});
    const t=$("#stTerms").value.split("\n").map(x=>x.trim()).filter(Boolean);
    const n=$("#stNotes").value.split("\n").map(x=>x.trim()).filter(Boolean);
    state.terms=t.length?t:null; state.notes=n.length?n:null;
    applyDefaultTier();
    saveSettings();

    const el=$("#qRef"); if(el && !isFinalised()) el.placeholder=nextPreview();
    if(usingFirebase()){
      try{ await fbSaveCompany(); await fbSaveNumbering(); toast("Saved and shared with the team"); }
      catch(e){ toast("Saved here, but not shared: "+friendlyAuthError(e)); }
    } else {
      toast("Settings saved on this device");
    }
    render();
  };
};

function render(){

    ? `<span class="tabsep" aria-hidden="true"></span>`
    : `<button role="tab" data-v="${id}" aria-selected="${id===state.view}">${esc(l)}${

}

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-v]");
  if(t){ goView(t.dataset.v); return; }
  const qt=e.target.closest("[data-qtier]");
  if(qt){ setTier(qt.dataset.qtier); return; }
  const tier=e.target.closest("[data-tier]");
  if(tier){ setTier(tier.dataset.tier); return; }
  const rm=e.target.closest("[data-rm]");
  if(rm){ state.lines.splice(+rm.dataset.rm,1); renderDocket(); }
});

function drawPartyPicker(){
  const q=($("#qPickQ").value||"").toLowerCase().trim();
  const rows=state.customers.filter(c=>!c.archived).filter(c=>!q ||
    [c.name,c.contact,c.phone,c.gstin,c.city].some(x=>String(x||"").toLowerCase().includes(q)))
    .sort((a,b)=>String(a.name).localeCompare(String(b.name))).slice(0,60);
  $("#qPickList").innerHTML = rows.length
    ? rows.map(c=>`<button type="button" class="pickrow" data-pickc="${esc(c.id)}">
        <b>${esc(c.name)}</b><span>${[c.contact,c.phone,c.city,c.gstin].filter(Boolean).map(esc).join(" \u00b7 ")||"&nbsp;"}</span>
      </button>`).join("")
    : `<div class="empty">${state.customers.length?"Nothing matches.":"No saved customers yet."}</div>`;
}

function syncTransport(){

  state.transport.on   = $("#trOn").checked;
  renderDocket();
}

  state.lines=[];

  toast(`New quotation \u2014 next number ${nextPreview()}${moved?` \u00b7 ${TIERNAME[state.tier]}`:""}`);
};

function loadScript(urls, ready){
  return new Promise((resolve,reject)=>{
    if(ready()) return resolve();
    let i=0;
    const next = () => {
      if(i>=urls.length) return reject(new Error("no source reachable"));
      const s=document.createElement("script");
      s.src=urls[i++];
      s.onload=()=> ready() ? resolve() : next();
      s.onerror=()=>{ s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}

/** Manrope is embedded as a subset; map the few marks it doesn't carry. */
function pdfSafe(s){
  return String(s==null?"":s)
    .replace(/[\u2018\u2019\u2032]/g,"'").replace(/[\u201c\u201d\u2033]/g,'"')
    .replace(/\u2713|\u2714/g,"")
    .replace(/\u2264/g,"<=").replace(/\u2265/g,">=")
    .replace(/\u2192/g,"->").replace(/\u2026/g,"...");
}

function useFonts(doc){
  if(!PDF_FONT || !PDF_FONT.reg) return false;
  try{
    doc.addFileToVFS("Manrope-Regular.ttf", PDF_FONT.reg);
    doc.addFont("Manrope-Regular.ttf","Manrope","normal");
    doc.addFileToVFS("Manrope-Bold.ttf", PDF_FONT.bold);
    doc.addFont("Manrope-Bold.ttf","Manrope","bold");
    return true;
  }catch(e){ return false; }
}

function pdfName(){
  const ref=$("#qRef").value.trim(), cl=$("#qClient").value.trim();
  let bit=(ref||cl||"quotation").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  bit=bit.replace(/^SIE-/i,"");
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `SIE-${bit}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.pdf`;
}

function buildPdfDoc(jsPDF, sizes){
  const FIRM = firmNow();                 // whatever Settings currently says
  const doc = new jsPDF({unit:"mm", format:"a4", compress:true});
  const M=12, W=186, PW=210, PH=297, BOT=PH-M-6;
  const FAM = useFonts(doc) ? "Manrope" : "helvetica";
  const F=(w,s)=>{ doc.setFont(FAM, w==="italic"?"normal":w); doc.setFontSize(s); };
  const ink=(g=0)=>doc.setTextColor(g);
  let y=M;

  const need = h => { if(y+h > BOT){ doc.addPage(); y=M; return true; } return false; };

  /* ---------- letterhead ---------- */
  const lw=27, lh=lw*sizes.logo.h/sizes.logo.w;
  doc.addImage(logoNow(),"PNG",M,y,lw,lh);
  const tx=M+lw+6, tw=W-lw-6;
  F("bold",15); ink(15);
  doc.text(pdfSafe(FIRM.name), tx, y+5.4);
  let ly=y+10;
  F("normal",7.4); ink(95);
  [FIRM.tag, FIRM.addr, FIRM.phones, FIRM.email+"  |  "+FIRM.web].forEach(t=>{
    doc.splitTextToSize(pdfSafe(t), tw).forEach(l=>{ doc.text(l,tx,ly); ly+=3.3; });
  });
  F("bold",7.4); ink(40);
  doc.text(pdfSafe("GSTIN  "+FIRM.gstin+"          PAN  "+FIRM.pan), tx, ly); ly+=3.3;
  y=Math.max(y+lh, ly)+1.5;
  doc.setDrawColor(0); doc.setLineWidth(0.7); doc.line(M,y,M+W,y); y+=6;

  /* ---------- title ---------- */
  F("bold",12.5); ink(0);
  doc.text("QUOTATION", PW/2, y, {align:"center"}); y+=5;

  /* ---------- detail box ---------- */
  const P = partyFromForm();
  const meta=[
    ["QUOTATION NO", $("#qRef").value.trim() || $("#qRef").placeholder || "-"],
    ["DATE", new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"})],
    ["CLIENT", P.name],
    ["CONTACT", P.contact],
    ["PHONE", P.phone],
    ["EMAIL", P.email],
    ["ADDRESS", P.address],
    ["SITE", P.site],
    ["CLIENT GSTIN", P.gstin],
    ["RATE BASIS", TIERNAME[state.tier].replace(" rate","")+"  |  list "+state.rev]
  ].filter(([k,v])=>v);                    // no empty rows
  const mh=Math.ceil(meta.length/2)*5.2+3.5;
  doc.setLineWidth(0.3); doc.setDrawColor(0); doc.rect(M,y,W,mh);
  meta.forEach((r,i)=>{
    const col=i%2, row=(i-col)/2;
    const x=M+3.5+col*(W/2), yy=y+5.6+row*5.2;
    F("bold",6.8); ink(105); doc.text(r[0], x, yy);
    F("normal",8.6); ink(0);
    doc.text(doc.splitTextToSize(pdfSafe(r[1]), W/2-32)[0], x+27, yy);
  });
  y+=mh+4.5;

  /* ---------- items ---------- */
  const C=[8,100,34,44], CX=[M, M+8, M+108, M+142];
  const thead=()=>{
    doc.setFillColor(238,240,238); doc.rect(M,y,W,7,"F");
    doc.setDrawColor(0); doc.setLineWidth(0.5);
    doc.line(M,y,M+W,y); doc.line(M,y+7,M+W,y+7);
    F("bold",6.9); ink(70);
    doc.text("S.NO", CX[0]+2, y+4.6);
    doc.text("ITEMS / SERVICES", CX[1]+2, y+4.6);
    doc.text("QTY / BASIS", CX[2]+C[2]-2, y+4.6, {align:"right"});
    doc.text("AMOUNT", CX[3]+C[3]-2, y+4.6, {align:"right"});
    y+=7;
  };
  thead();

  quoteLines().forEach((l,i)=>{
    F("normal",8.8);
    const t=doc.splitTextToSize(pdfSafe(l.t), C[1]-4);
    F("normal",7.1);
    const s=l.s ? doc.splitTextToSize(pdfSafe(l.s), C[1]-4) : [];
    const h=Math.max(t.length*3.9 + s.length*3.05 + 3.6, 9);
    if(y+h>BOT-4){ doc.addPage(); y=M; thead(); }
    let ty=y+4.4;
    F("normal",8.8); ink(0);
    doc.text(String(i+1), CX[0]+2, ty);
    t.forEach(line=>{ doc.text(line, CX[1]+2, ty); ty+=3.9; });
    if(s.length){ F("normal",7.1); ink(110); s.forEach(line=>{ doc.text(line, CX[1]+2, ty); ty+=3.05; }); }
    F("normal",8.8); ink(0);
    doc.text(pdfSafe(qLabel(l)), CX[2]+C[2]-2, y+4.4, {align:"right"});
    doc.text(rs(amtOf(l)), CX[3]+C[3]-2, y+4.4, {align:"right"});
    doc.setDrawColor(195); doc.setLineWidth(0.15); doc.line(M,y+h,M+W,y+h);
    y+=h;
  });

  /* ---------- totals ---------- */
  const pctPdf=gstPercent();
  const sub=subtotal(), gst=state.gst?sub*gstRate():0, tot=sub+gst;
  need(34); y+=3;
  const bw=88, bx=M+W-bw;
  const trow=(lbl,val,bold)=>{
    F(bold?"bold":"normal", bold?11:9); ink(bold?0:40);
    doc.text(pdfSafe(lbl), bx+3, y+4.6);
    doc.text(pdfSafe(val), bx+bw-3, y+4.6, {align:"right"});
    y+=bold?7.2:5.6;
  };
  trow("Subtotal", rs(sub));
  trow(state.gst?`GST ${pctPdf}%`:"GST", state.gst?rs(gst):"Not included");
  doc.setDrawColor(0); doc.setLineWidth(0.5); doc.line(bx,y,bx+bw,y); y+=1;
  trow("GRAND TOTAL", rs(tot), true);
  doc.setLineWidth(0.7); doc.line(bx,y,bx+bw,y); y+=5;
  F("italic",7.6); ink(60);
  doc.text(pdfSafe(words(tot)), M+W, y, {align:"right"}); y+=5.2;

  /* ---------- notes & terms ---------- */
  const N=notesList().map(pdfSafe), T=termsList().map(pdfSafe);
  const nW=64, tW=W-nW;
  F("normal",6.5);
  const nLines=[], tLines=[];
  N.forEach(t=>doc.splitTextToSize("- "+t, nW-7).forEach(l=>nLines.push(l)));
  T.forEach((t,i)=>doc.splitTextToSize((i+1)+". "+t, tW-7).forEach(l=>tLines.push(l)));
  const boxH=Math.max(nLines.length, tLines.length)*2.85 + 9;
  need(boxH+2);
  doc.setDrawColor(0); doc.setLineWidth(0.3);
  doc.rect(M,y,nW,boxH); doc.rect(M+nW,y,tW,boxH);
  F("bold",7); ink(0);
  doc.text("NOTES", M+3.5, y+5);
  doc.text("TERMS & CONDITIONS", M+nW+3.5, y+5);
  F("normal",6.5); ink(45);
  nLines.forEach((l,i)=>doc.text(l, M+3.5, y+8.6+i*2.85));
  tLines.forEach((l,i)=>doc.text(l, M+nW+3.5, y+8.6+i*2.85));
  y+=boxH+3;

  /* ---------- bank, QR, signature ---------- */
  const payH=27, qrW=52, bkW=W-qrW;
  // the footer line sits at PH-7, so this block may run closer to the edge
  if(y + payH + 19 + 2 > PH - M - 1){ doc.addPage(); y=M; }
  doc.setLineWidth(0.5); doc.setDrawColor(0);
  doc.rect(M,y,W,payH); doc.line(M+bkW,y,M+bkW,y+payH);
  F("bold",6.9); ink(0); doc.text("BANK DETAILS", M+3.5, y+5);
  const B=FIRM.bank;
  [["Name",B.name],["Bank",B.branch],["Account no",B.acc],["IFSC code",B.ifsc],["UPI ID",B.upi]]
    .forEach((r,i2)=>{
      const yy=y+9+i2*3.6;
      F("normal",7.2); ink(110); doc.text(r[0], M+3.5, yy);
      F("bold",7.6); ink(0); doc.text(pdfSafe(r[1]), M+26, yy);
    });
  F("bold",6.9); ink(0);
  doc.text("SCAN TO PAY", M+bkW+3.5, y+5);
  doc.addImage(qrNow(),"PNG", M+bkW+(qrW-16)/2, y+5.8, 16, 16);
  F("normal",5.4); ink(105);
  doc.text("PhonePe / GPay / Paytm / any UPI app", M+bkW+qrW/2, y+payH-1.9, {align:"center"});
  y+=payH;

  const sh=19, sigCell=72, scx=M+W-sigCell;
  doc.setLineWidth(0.5); doc.rect(M,y,W,sh); doc.line(scx,y,scx,y+sh);
  const sw=20, shh=sw*sizes.sig.h/sizes.sig.w;
  doc.addImage(ASSET.sig,"PNG", scx+(sigCell-sw)/2, y+0.8, sw, shh);
  F("normal",7); ink(70);
  doc.text("Authorised signatory for", scx+sigCell/2, y+sh-4.7, {align:"center"});
  F("bold",7.6); ink(0);
  doc.text(pdfSafe(FIRM.name), scx+sigCell/2, y+sh-1.6, {align:"center"});
  F("normal",7); ink(70);
  doc.text("Accepted for " + pdfSafe($("#qClient").value.trim() || "the client"), M+3.5, y+5.5);
  doc.setDrawColor(150); doc.setLineWidth(0.25);
  doc.line(M+3.5, y+sh-5.5, M+3.5+62, y+sh-5.5);
  F("normal",6.4); ink(120);
  doc.text("Signature & date", M+3.5, y+sh-2.2);
  y+=sh+4;

  /* ---------- page numbers ---------- */
  const pages=doc.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);
    F("normal",6.6); ink(130);
    doc.text(pdfSafe(`Computer-generated quotation. Rates valid ${CO("validityDays")} days unless stated otherwise.  |  `+FIRM.web),
      M, PH-7);
    doc.text(`Page ${p} of ${pages}`, M+W, PH-7, {align:"right"});
  }
  return doc;
}

async function downloadQuotePdf(){
  const b=$("#btnPdf"), was=b.textContent, mask=$("#pdfmask");
  b.disabled=true; b.textContent="Preparing\u2026";
  mask.classList.add("on");
  try{
    await loadScript(PDF_SRC, ()=> window.jspdf && window.jspdf.jsPDF);
    const doc = buildPdfDoc(window.jspdf.jsPDF, ASSET.size);
    doc.save(pdfName());
    closeSheet();
    toast("Quotation saved as PDF");
  }catch(err){
    toast("Could not build the PDF \u2014 use Print and choose Save as PDF", "Print", ()=>{
      buildPrint(); setTimeout(()=>window.print(),60);
    });
  }finally{
    mask.classList.remove("on");
    b.disabled=false; b.textContent=was;
  }
}
$("#btnFinal").onclick = () => finaliseQuote();
$("#btnPdf").onclick = async () => {
  if(!await ensureFinalised()) return;
  await downloadQuotePdf();
};

/** One gate in front of every action that issues a quotation. */
async function ensureFinalised(){
  if(!quoteLines().length){ toast("Add a line to the quotation first"); return false; }
  if(isFinalised()) return true;                 // same quotation keeps its number
  if(!confirm("This quotation has not been finalised yet.\n\nFinalise it now? It is given its number and saved to the history.")) return false;
  return !!(await finaliseQuote());
}

$("#btnPrint").onclick = async () => {
  if(!await ensureFinalised()) return;
  buildPrint(); closeSheet(); setTimeout(()=>window.print(), 60);
};
$("#btnWa").onclick = async () => {
  if(!await ensureFinalised()) return;
  const ok = await copyText(quoteText());
  if(ok) closeSheet();
  toast(ok ? "Quotation copied — paste it into WhatsApp" : "Copy failed — try Print instead");
};

/* ---------- installing, updating and working offline ----------
   The button only appears when the browser actually offers an install, and
   never inside an already-installed window. Browsers that do not support
   installing (iPhone Safari) simply never fire the event, so it stays hidden. */
let installPrompt=null;
const isStandalone = () =>
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
  window.navigator.standalone === true ||
  document.referrer.startsWith("android-app://");

function showInstall(on){
  const b=$("#btnInstall");
  if(!b) return;
  b.hidden = !on || isStandalone() || installedAlready;
}
let installedAlready = false;
/* Chrome can tell us the app is already installed even when the page is
   opened in a normal tab, which is the case the earlier check missed. */
async function checkInstalled(){
  try{
    if(navigator.getInstalledRelatedApps){
      const apps = await navigator.getInstalledRelatedApps();
      if(apps && apps.length){ installedAlready = true; showInstall(false); }
    }
  }catch(e){ /* not supported — fall back to the display-mode check */ }
}

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  if(isStandalone() || installedAlready) return;
  installPrompt=e; showInstall(true);
}, {once:false});
$("#btnInstall").onclick = async () => {
  if(!installPrompt) { showInstall(false); return; }
  installPrompt.prompt();
  let outcome="dismissed";
  try{ ({outcome} = await installPrompt.userChoice); }catch(e){}
  installPrompt=null;
  if(outcome==="accepted"){ showInstall(false); toast("Installed — open it from your home screen"); }
  else { showInstall(false); }   // Chrome discards a used prompt either way
};
window.addEventListener("appinstalled", ()=>{
  installPrompt=null; installedAlready=true; showInstall(false);
});
if(window.matchMedia){
  window.matchMedia("(display-mode: standalone)").addEventListener?.("change", ()=>showInstall(!!installPrompt));
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) showInstall(!!installPrompt); });
showInstall(false);
checkInstalled();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      // a waiting worker means a newer upload is ready; take it now
      if(reg.waiting) reg.waiting.postMessage("skipWaiting");
      reg.addEventListener("updatefound", ()=>{
        const nw=reg.installing;
        nw && nw.addEventListener("statechange", ()=>{
          if(nw.state==="installed" && navigator.serviceWorker.controller){
            nw.postMessage("skipWaiting");
            toast("A newer version is ready", "Reload", ()=>location.reload());
          }
        });
      });
      setInterval(()=>reg.update(), 60*60*1000);
    }).catch(()=>{ /* opened as a plain file */ });
  });
}

function netFlag(){
  let bar=$("#netBar");
  if(navigator.onLine){ if(bar) bar.remove(); return; }
  if(bar) return;
  bar=document.createElement("div");
  bar.id="netBar"; bar.className="offline";
  bar.textContent="No connection — quoting and PDFs still work. Stock and purchase requirements sync when you are back online.";
  document.querySelector("header.mast").after(bar);
}
window.addEventListener("online", ()=>{ netFlag(); if(state.sync.url){ syncStock(true); syncPurchase(true); } });
window.addEventListener("offline", netFlag);

(async function init(){
  const saved = await Store.get(KEY);
  if(saved){ state.ov=saved.ov||{}; state.rev=saved.rev||state.rev; state.effective=saved.effective||state.effective;
    state.custom=saved.custom||{}; state.terms=saved.terms||null; state.notes=saved.notes||null;
    state.stock=saved.stock||{}; if(saved.sync) Object.assign(state.sync, saved.sync);
    state.catOpen=saved.catOpen||{}; state.purchase=Array.isArray(saved.purchase)?saved.purchase:[];
    if(saved.numbering) Object.assign(state.numbering, saved.numbering);
    if(saved.backend) state.backend=saved.backend;
    state.priceReviewed=saved.priceReviewed||{}; state.seeded=!!saved.seeded;
    state.customers=saved.customers||[]; state.quotes=saved.quotes||[];
    state.company=saved.company||null; state.prefs=saved.prefs||{}; }
  const bm=$("#brandMark"); if(bm) bm.src=BRAND.badge;
  if(state.prefs.font) document.documentElement.style.fontSize=(state.prefs.font/100*16)+"px";
  const hadDraft = await restoreDraft();
  if(!hadDraft) applyDefaultTier();       // a restored draft keeps its own rate type
  netFlag();
  $("#revLbl").textContent = "rates "+state.rev;
  if(!state.numbering.fy) state.numbering.fy = fyNow();
  $("#qRef").placeholder = nextPreview();
  checkFinancialYear();
  initAuth();
  $$("[data-tier]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tier===state.tier));
  render();
  if(hadDraft) toast("Your unfinished quotation was restored", "Start new", ()=>{
    state.lines=[]; state.transport={on:false,amt:0,note:""};
    ["#qClient","#qSite","#qGst","#qContact","#qPhone","#qEmail","#qAddr","#trAmt","#trNote"]
      .forEach(id=>{ const el=$(id); if(el) el.value=""; });
    const on=$("#trOn"); if(on) on.checked=false;
    resetQuoteNo(); clearDraft(); applyDefaultTier(); render();
    toast("New quotation started");
  });
  if(state.sync.url){
    syncStock(true); syncPurchase(true);
    setInterval(()=>{ if(!document.hidden){ syncStock(true); syncPurchase(true); } }, 120000);
    document.addEventListener("visibilitychange", ()=>{
      if(!document.hidden){ syncStock(true); syncPurchase(true); }
    });
  }
})();
</script>
